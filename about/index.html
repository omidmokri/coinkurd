Object.assign(I.fa,{h1:'دربارهٔ <em>انتخاب</em>',lead:'یک «اتاق فرمان» رایگان برای بازار کریپتو، ساخته‌شده روی آرشیو خودکار کانال تلگرام Coin_Kurd — به فارسی، کوردی و انگلیسی.',
 whatT:'entekhab.net چیست؟',what:'<p>هر پستی که در کانال <b>Coin_Kurd</b> منتشر می‌شود، هر ۱۵ دقیقه خودکار خوانده، دسته‌بندی، ترجمه (کوردی سورانی و انگلیسی) و اینجا منتشر می‌شود. کنار آرشیو، ابزارهایی برای فهم بازار ساخته‌ایم: مغز بازار و گزارش هوش مصنوعی، اسکنر با کارنامهٔ واقعی هر الگو، امتیاز شفاف کوین‌ها، DNA بازار، ترمینال، اندیکاتورهای اختصاصی، آموزش و واژه‌نامه، و ابزارهای شخصی مثل هشدار، سبد خصوصی و معاملهٔ آزمایشی.</p>',
 whoT:'چه کسی پشت آن است؟',who:'<p>کانال Coin_Kurd را <b>امید د. موکری</b> اداره می‌کند؛ مدرس تحلیل تکنیکال، هم‌نویسندهٔ کتاب منتشرشده‌ای دربارهٔ تحلیل تکنیکال بازار ارزهای دیجیتال و سازندهٔ روش معاملاتی «روژ کردستان» و اندیکاتورهای Kurdistani در TradingView. آموزش‌ها به‌صورت زنده هم برگزار می‌شوند.</p>',
 howT:'داده‌ها از کجا می‌آیند و چطور کار می‌کند؟',how:'<ul><li>قیمت‌ها و کندل‌ها: Binance (عمومی)؛ ارزش بازار و بخش‌ها: CoinGecko؛ ترس و طمع: alternative.me؛ آن‌چین: CoinMetrics و mempool.space؛ مشتقات: OKX و Binance.</li><li>همه‌چیز با GitHub Actions به‌روز و روی GitHub Pages منتشر می‌شود؛ سرور و پایگاه دادهٔ کاربر نداریم.</li><li>ویژگی‌های شخصی (هشدار، سبد، یادداشت، معاملهٔ آزمایشی، پیشرفت آموزش) فقط در مرورگر خود شما ذخیره می‌شوند.</li><li>تازگی هر داده و کارنامهٔ واقعی ابزارها در <a href="/status/">صفحهٔ شفافیت</a> منتشر می‌شود.</li></ul>',
 rmT:'نقشهٔ راه عمومی',RM:[['✅ آماده','آرشیو سه‌زبانه و جستجوی هوشمند|اسکنر با کارنامه و بک‌تست|اندیکاتورهای Coin_Kurd با موتور سرور|آموزش، آزمون و واژه‌نامه|PWA (نصب روی گوشی) و قیمت زنده|هشدار ترکیبی و معاملهٔ آزمایشی|بررسی امنیت توکن'],['🔜 بعدی','سیگنال‌های زندهٔ TradingView از طریق کانال رله|دادهٔ آن‌چین بیشتر (جریان صرافی‌ها)|اخبار منطقه و نرخ بازار آزاد'],['🖥 نیازمند سرور','حساب کاربری و همگام‌سازی بین دستگاه‌ها|انجمن، نظر و رأی‌دهی|جدول رتبه‌بندی عمومی|اشتراک پولی و اپ بومی']],
 ctT:'تماس و پشتیبانی',ct:'سؤال، پیشنهاد یا گزارش خطا را در کانال یا گروه تلگرام Coin_Kurd بفرستید.',nfaL:'<b>توجه:</b> هیچ‌یک از مطالب و ابزارهای این سایت توصیهٔ مالی نیست؛ همه‌چیز توصیف وضعیت و آموزش است.',nfa:'آموزشی است، توصیهٔ مالی نیست'});
Object.assign(I.ckb,{h1:'دەربارەی <em>ئینتیخاب</em>',lead:'«ژووری فەرمان»ێکی بێبەرامبەر بۆ بازاڕی کریپتۆ، دروستکراو لەسەر ئەرشیڤی خۆکاری کەناڵی تێلێگرامی Coin_Kurd — بە فارسی، کوردی و ئینگلیزی.',
 whatT:'entekhab.net چییە؟',what:'<p>هەر پۆستێک لە کەناڵی <b>Coin_Kurd</b> هەر ١٥ خولەک جارێک خۆکار دەخوێنرێتەوە، پۆلێن دەکرێت، وەردەگێڕدرێت و لێرە بڵاو دەکرێتەوە. لەگەڵ ئەرشیڤ، ئامرازی تێگەیشتن لە بازاڕمان دروست کردووە: مێشکی بازاڕ، پشکنەر بە تۆماری ڕاستەقینە، نمرەی ڕوون، DNAی بازاڕ، تێرمیناڵ، ئیندیکاتۆرەکان، فێربوون و ئامرازی تایبەت.</p>',
 whoT:'کێ لە پشتیەتی؟',who:'<p>کەناڵی Coin_Kurd لەلایەن <b>ئومێد د. موکری</b>ـەوە بەڕێوە دەبرێت؛ مامۆستای شیکاریی تەکنیکی، هاونووسەری کتێبێکی بڵاوکراوە دەربارەی شیکاریی تەکنیکیی بازاڕی دراوە دیجیتاڵییەکان و دروستکەری ڕێبازی «ڕۆژی کوردستان» و ئیندیکاتۆرەکانی Kurdistani لە TradingView.</p>',
 howT:'داتا لە کوێوە دێت؟',how:'<ul><li>نرخ: Binance؛ بەهای بازاڕ: CoinGecko؛ ترس و تەماح: alternative.me؛ ئۆن‌چەین: CoinMetrics و mempool.space؛ داڕێژراوەکان: OKX و Binance.</li><li>هەموو شتێک بە GitHub Actions نوێ دەکرێتەوە و لە GitHub Pages بڵاو دەکرێتەوە.</li><li>تایبەتمەندییە کەسییەکان تەنها لە وێبگەڕەکەتدا هەڵدەگیرێن.</li><li>تازەیی داتا و تۆماری ئامرازەکان لە <a href="/status/">پەڕەی ڕوونی</a>دا بڵاو دەکرێتەوە.</li></ul>',
 rmT:'نەخشەی ڕێگای گشتی',RM:[['✅ ئامادە','ئەرشیڤی سێ زمانی|پشکنەر بە تۆمار|ئیندیکاتۆرەکانی Coin_Kurd|فێربوون و فەرهەنگ|PWA و نرخی زیندوو|ئاگاداریی تێکەڵ و مامەڵەی تاقیکاری|پشکنینی ئاسایشی تۆکن'],['🔜 دواتر','ئاماژەی زیندووی TradingView|داتای ئۆن‌چەینی زیاتر|هەواڵی ناوچە'],['🖥 پێویستی بە سێرڤەر','هەژماری بەکارهێنەر|کۆڕ و دەنگدان|خشتەی پلەبەندی|بەشداریی پارەدار و ئەپی ڕەسەن']],
 ctT:'پەیوەندی',ct:'پرسیار، پێشنیار یان ڕاپۆرتی هەڵە لە کەناڵ یان گرووپی تێلێگرامی Coin_Kurd بنێرە.',nfaL:'<b>ئاگاداری:</b> هیچ کام لە ناوەڕۆک و ئامرازەکان ئامۆژگاریی دارایی نین.',nfa:'فێرکارییە، ئامۆژگاریی دارایی نییە'});
Object.assign(I.en,{h1:'About <em>Entekhab</em>',lead:'A free “command room” for the crypto market, built on the automatic archive of the Coin_Kurd Telegram channel — in Persian, Kurdish and English.',
 whatT:'What is entekhab.net?',what:'<p>Every post published on the <b>Coin_Kurd</b> channel is read every 15 minutes, categorised, translated (Sorani Kurdish and English) and published here. Around the archive we built tools to understand the market: the market brain and AI report, a scanner with a real track record for every pattern, transparent coin scores, Market DNA, the terminal, the channel\'s own indicators, lessons and a glossary, and personal tools such as alerts, a private portfolio and paper trading.</p>',
 whoT:'Who is behind it?',who:'<p>The Coin_Kurd channel is run by <b>Omid D. Mokri</b> — a technical-analysis teacher, co-author of a published book on technical analysis of cryptocurrency markets, and creator of the “Kurdistan Roj” trading method and the Kurdistani indicators on TradingView. Lessons are also held live.</p>',
 howT:'Where does the data come from?',how:'<ul><li>Prices and candles: Binance (public); market caps and sectors: CoinGecko; Fear & Greed: alternative.me; on-chain: CoinMetrics and mempool.space; derivatives: OKX and Binance.</li><li>Everything is refreshed by GitHub Actions and published on GitHub Pages; there is no server or user database.</li><li>Personal features (alerts, portfolio, notes, paper trading, learning progress) are stored only in your own browser.</li><li>Data freshness and the tools’ real track record are published on the <a href="/status/">status page</a>.</li></ul>',
 rmT:'Public roadmap',RM:[['✅ Live','Three-language archive and smart search|Scanner with track record and backtest|Coin_Kurd indicators with server engines|Lessons, quizzes and glossary|Installable app (PWA) and live prices|Combined alerts and paper trading|Token safety check'],['🔜 Next','Live TradingView signals via the relay channel|More on-chain data (exchange flows)|Regional news and free-market rates'],['🖥 Needs a server','Accounts and cross-device sync|Forum, comments and voting|Public leaderboard|Paid plans and native apps']],
 ctT:'Contact & support',ct:'Send questions, ideas or bug reports to the Coin_Kurd Telegram channel or group.',nfaL:'<b>Note:</b> nothing on this site is financial advice; everything describes the market or teaches.',nfa:'Educational, not financial advice'});

uiLang(render);
</script>

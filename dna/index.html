let DNA=null,cur=(window.DNA_COIN||location.hash.slice(1)||'BTC').toUpperCase();
const col=v=>v==null?'#3a3d42':v>=66?'#f7931a':v>=33?'#b88a3c':'#2b6cb0';

function pick(){const cs=Object.keys(DNA.coins).sort((a,b)=>(DNA.coins[b].raw.qvol30||0)-(DNA.coins[a].raw.qvol30||0));

function pathChart(tw){const W=520,H=170,all=tw.flatMap(x=>x.path),lo=Math.min(...all,100),hi=Math.max(...all,100),Y=v=>H-4-(v-lo)/(hi-lo||1)*(H-8),X=i=>i*W/30;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin:6px 0"><line x1="0" x2="${W}" y1="${Y(100)}" y2="${Y(100)}" stroke="#444" stroke-dasharray="3 3"/>${tw.map(x=>`<polyline points="${x.path.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}" fill="none" stroke="${x.f30>=0?'rgba(34,197,94,.7)':'rgba(239,68,68,.7)'}" stroke-width="1.6"/>`).join('')}<text x="4" y="12" fill="#888" font-size="10">+${fm(hi-100,0)}%</text><text x="4" y="${H-6}" fill="#888" font-size="10">${fm(lo-100,0)}%</text></svg>`}

function helixInit(){if(!window.THREE)return;const cv=$('#helix');let r;try{r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true})}catch(e){return}

 const grp=new THREE.Group();sc.add(grp);const rungs=[],TURN=3,N=GENES.length*TURN,HGT=12,R=2.4;

 const tube=(pts,c)=>new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),400,.13,10,false),new THREE.MeshStandardMaterial({color:c,metalness:.6,roughness:.35,emissive:c,emissiveIntensity:.25}));
 grp.add(tube(s1,0xf7931a),tube(s2,0x8a5a1c));
 for(let i=0;i<N;i++){const t=(i+.5)/N,a=t*TURN*Math.PI*2,y=(t-.5)*HGT;const g=GENES[i%GENES.length];

 sc.add(new THREE.AmbientLight(0xffffff,.55));const d=new THREE.DirectionalLight(0xffffff,1.1);d.position.set(5,6,8);sc.add(d);const p=new THREE.PointLight(0xf7931a,1.4,40);p.position.set(-6,-4,6);sc.add(p);

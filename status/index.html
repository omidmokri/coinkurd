  const cell = a => a && a.n24 ? `<td class="num">${a.n24}</td><td class="num">${a.win24}%</td><td class="num ${a.avg24 >= 0 ? 'pos' : 'neg'}">${a.avg24 >= 0 ? '+' : ''}${a.avg24}%</td>` : `<td class="num">—</td><td></td><td></td>`;

    pats.map(p => `<tr><td>${T(p)}</td>${cell(p === '_all' ? st._bt : st[p + '|bt'])}${cell(p === '_all' ? st._live : st[p + '|live'])}</tr>`).join('') + `</table><p class="disc">${SC.backfilled ? `${T('bt')}: ${esc((SC.backfilled.at || '').slice(0, 10))} · ` : ''}${T('live')}: ${esc((SC.live_since || '—').slice(0, 10))} →</p>` : `<p class="disc">${T('none')}</p>`;
  const ss = (SG && SG.stats) || {}, nm = id => ((IND && IND.items || []).find(x => x.id === id) || {}).name || id;
  $('#sig').innerHTML = Object.keys(ss).length ? `<table><tr><th></th><th>${T('n')}</th><th>${T('p24')}</th><th></th></tr>${Object.entries(ss).map(([k, a]) => `<tr><td><a href="/indicators/${esc(k)}/">${esc(nm(k))}</a></td><td class="num">${a.n}</td><td class="num">${a.win != null ? a.win + '% (' + a.h + ')' : '—'}</td><td class="num ${a.avg >= 0 ? 'pos' : 'neg'}">${a.avg != null ? (a.avg >= 0 ? '+' : '') + a.avg + '%' : ''}</td></tr>`).join('')}</table>` : `<p class="disc">${T('none')}</p>`;
  if (IM) { const rows = Object.values(IM).filter(r => r.r4h != null); const n = rows.length, abs4 = n ? rows.reduce((a, r) => a + Math.abs(r.r4h), 0) / n : 0, pos4 = n ? rows.filter(r => r.r4h > 0).length * 100 / n : 0, abs1 = n ? rows.reduce((a, r) => a + Math.abs(r.r1h || 0), 0) / n : 0;
    $('#imp').innerHTML = n ? `<div class="kv" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px"><div class="card" style="padding:10px"><small class="disc">${T('n')}</small><b class="num">${n}</b></div><div class="card" style="padding:10px"><small class="disc">|Δ| 1h / 4h</small><b class="num">${abs1.toFixed(2)}% / ${abs4.toFixed(2)}%</b></div><div class="card" style="padding:10px"><small class="disc">+4h</small><b class="num">${pos4.toFixed(0)}%</b></div></div>` : `<p class="disc">${T('none')}</p>`; }
}
uiLang(render);
(async () => { [H, SC, SG, IM, IND] = await Promise.all(['/data/health.json', '/data/scanstats.json', '/data/signals.json', '/data/impact.json', '/data/indicators.json'].map(u => j(u + V()))); render(); if (location.hash === '#perf') document.getElementById('perf').scrollIntoView(); })();
</script>
</body>

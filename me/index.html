 const donut=`<svg viewBox="0 0 100 100" style="width:140px;height:140px;flex:none">${rows.map((r,k)=>{const s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${pal[k%pal.length]}" stroke-width="16" stroke-dasharray="${C*r.w} ${C}" stroke-dashoffset="${-C*acc}" transform="rotate(-90 50 50)"/>`;acc+=r.w;return s}).join('')}</svg>`;
 el.innerHTML=`<div class="row" style="gap:22px;align-items:center">${donut}<div><div class="disc">${T('total')}</div><div class="big">$${fm(val,2)}</div><div>${T('pnl')}: ${cost?sg((val/cost-1)*100):'—'} <span class="num">(${cost?(val-cost>=0?'+':'−')+'$'+fm(Math.abs(val-cost),2):'—'})</span></div><div class="disc">${T('hhi')}: <b class="num">${hhi.toFixed(2)}</b> · ${T('pvol')}: <b class="num">${pvol==null?'—':pvol.toFixed(1)+'%'}</b></div></div></div>
 <table style="margin-top:10px"><tr><th></th><th>qty</th><th>$</th><th>${T('alloc')}</th><th>${T('pnl')}</th><th></th></tr>${rows.map((r,k)=>`<tr><td><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${pal[k%pal.length]}"></i> ${logoTag(r.coin,18)}${r.coin}</td><td class="num">${fm(r.qty,6)}</td><td class="num">${r.px?fm(r.v,2):'—'}</td><td class="num">${(r.w*100).toFixed(1)}%</td><td>${r.cost&&r.px?sg((r.px/r.cost-1)*100):'—'}</td><td><button class="btn" data-del="${r.i}" style="padding:2px 8px">✕</button></td></tr>`).join('')}</table>
 ${rows.length>1&&n>=10?`<h3 style="font-size:.9rem;margin-top:12px">${T('corrT')}</h3><table>${['',...rows.map(r=>r.coin)].map((h,i)=>i===0?`<tr><th></th>${rows.map(r=>`<th>${r.coin}</th>`).join('')}</tr>`:`<tr><th>${h}</th>${rows.map((r2,k2)=>{const c=corr(rets[i-1],rets[k2]);return `<td class="num" style="background:rgba(247,147,26,${c==null?0:Math.max(0,c)*.35})">${c==null?'—':c.toFixed(2)}</td>`}).join('')}</tr>`).join('')}</table>`:''}
 <p style="margin-top:10px"><button class="btn" id="pCard">🖼 ${T('shareCard')}</button></p><div id="pOut"></div>`;
 el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const a=ls.get('ek_port',[]);a.splice(+b.dataset.del,1);ls.set('ek_port',a);renderPf();renderLvl()});
 $('#pCard').onclick=()=>{const cv=document.createElement('canvas');cv.width=1080;cv.height=1080;const x=cv.getContext('2d');bgPaint(x,1080,1080);x.textAlign='center';x.fillStyle='#f7931a';x.font='700 44px "Space Grotesk"';x.fillText('MY CRYPTO MIX',540,100);
  let a0=-Math.PI/2;rows.forEach((r,k)=>{x.beginPath();x.moveTo(540,460);x.arc(540,460,250,a0,a0+r.w*Math.PI*2);x.closePath();x.fillStyle=pal[k%pal.length];x.fill();a0+=r.w*Math.PI*2});x.beginPath();x.arc(540,460,140,0,7);x.fillStyle='#0b0c0f';x.fill();
  x.fillStyle='#fff';x.font='700 40px "Space Grotesk"';x.fillText(rows.length+' assets',540,475);rows.slice(0,8).forEach((r,k)=>{const y=790+Math.floor(k/2)*58,cx=k%2?760:320;x.fillStyle=pal[k%pal.length];x.fillRect(cx-150,y-26,28,28);x.fillStyle='#fff';x.textAlign='left';x.font='600 34px "Space Grotesk"';x.fillText(`${r.coin} ${(r.w*100).toFixed(1)}%`,cx-108,y-2);x.textAlign='center'});
  x.fillStyle='#f7931a';x.font='700 40px "Space Grotesk"';x.fillText('entekhab.net/me',540,1040);const u=cv.toDataURL('image/png');cv.className='card-out';cv.style.maxWidth='300px';$('#pOut').innerHTML=`<a class="btn p" download="entekhab-my-mix.png" href="${u}" style="margin-top:8px">⬇ PNG</a>`;$('#pOut').prepend(cv)}}
$('#pAdd').onclick=()=>{const c=$('#pC').value,q=+$('#pQ').value,p=+$('#pP').value;if(!c||!(q>0))return;const a=ls.get('ek_port',[]);a.push({coin:c,qty:q,cost:p>0?p:null});ls.set('ek_port',a.slice(0,20));$('#pQ').value=$('#pP').value='';renderPf();renderLvl()};
/* ---- alerts ---- */
function renderAlerts(){const a=ls.get('ek_alerts',[]),lg=ls.get('ek_alert_log',[]),LV=T('lv'),MT=T('metrics');
 $('#alerts').innerHTML=(a.length?a.map((r,i)=>`<div class="note"><span class="chip lv-${r.level}">${LV[r.level]}</span> ${logoTag(r.coin,16)}<b>${r.coin}</b> · ${MT[r.metric]} ${r.metric==='signal'?esc(r.val):esc(r.op)+' '+esc(r.val)} <button class="btn" data-adel="${i}" style="padding:1px 8px;float:inline-end">✕</button></div>`).join(''):`<p class="disc">${T('none')}</p>`)+(window.Notification&&Notification.permission!=='granted'?`<button class="btn" id="aPerm" style="margin-top:6px">🔔 ${T('notif')}</button>`:'');
 $('#alerts').querySelectorAll('[data-adel]').forEach(b=>b.onclick=()=>{const x=ls.get('ek_alerts',[]);x.splice(+b.dataset.adel,1);ls.set('ek_alerts',x);renderAlerts()});
 const pb=$('#aPerm');if(pb)pb.onclick=()=>Notification.requestPermission().then(renderAlerts);
 const ord={critical:0,important:1,info:2};$('#alog').innerHTML=lg.length?lg.slice().sort((x,y)=>(ord[x.level]-ord[y.level])||y.t-x.t).slice(0,20).map(x=>`<div class="note"><span class="chip lv-${x.level}">${LV[x.level]}</span> <span class="num">${esc(x.msg)}</span><br><small>${new Date(x.t).toLocaleString(lang==='en'?'en-GB':'fa-IR')}</small></div>`).join(''):`<p class="disc">${T('none')}</p>`}
$('#aAdd').onclick=()=>{const r={id:Date.now(),coin:$('#aC').value,metric:$('#aM').value,op:$('#aO').value,val:($('#aV').value||'').trim(),level:$('#aL').value};if(!r.coin||!r.val)return;if(r.metric!=='signal'&&isNaN(+r.val))return;const a=ls.get('ek_alerts',[]);a.push(r);ls.set('ek_alerts',a.slice(0,40));$('#aV').value='';renderAlerts();renderLvl();if(window.Notification&&Notification.permission==='default')Notification.requestPermission();alertTick()};
$('#aM').onchange=()=>{$('#aO').style.display=$('#aM').value==='signal'?'none':'';$('#aV').placeholder=$('#aM').value==='signal'?'any / volume_spike / rsi_oversold …':'value'};
addEventListener('ek-alerts',renderAlerts);
/* ---- notebook ---- */
function renderNotes(){const q=($('#nS').value||'').toLowerCase(),a=ls.get('ek_notes',[]).filter(n=>!q||(n.title+' '+n.body+' '+(n.tags||'')+' '+(n.coin||'')).toLowerCase().includes(q));
 $('#notes').innerHTML=a.length?a.map(n=>{const nowPx=n.coin?(M?.coins||[]).find(c=>c.coin===n.coin)?.price:null;return `<div class="note"><b>${esc(n.title)}</b> ${n.coin?`${logoTag(n.coin,16)}<span class="chip">${n.coin}</span>`:''}${(n.tags||'').split(/[,،\s]+/).filter(Boolean).map(t=>`<span class="chip">#${esc(t)}</span>`).join('')}<div style="white-space:pre-wrap;font-size:.9rem;margin:4px 0">${esc(n.body)}</div><small>${new Date(n.t).toLocaleString(lang==='en'?'en-GB':'fa-IR')}${n.px?` · ${T('then')} <span class="num">$${fm(n.px,n.px<1?6:2)}</span>${nowPx?` → ${T('now')} <span class="num">$${fm(nowPx,nowPx<1?6:2)}</span> ${sg((nowPx/n.px-1)*100)}`:''}`:''}</small> <button class="btn" data-ndel="${n.id}" style="padding:1px 8px;float:inline-end">✕</button></div>`}).join(''):`<p class="disc">${T('none')}</p>`;
 $('#notes').querySelectorAll('[data-ndel]').forEach(b=>b.onclick=()=>{ls.set('ek_notes',ls.get('ek_notes',[]).filter(n=>n.id!=b.dataset.ndel));renderNotes();renderLvl()})}
$('#nAdd').onclick=()=>{const t=$('#nT').value.trim(),b=$('#nB').value.trim();if(!t&&!b)return;const c=$('#nC').value,px=c?(M?.coins||[]).find(x=>x.coin===c)?.price:null;const a=ls.get('ek_notes',[]);a.unshift({id:Date.now(),t:Date.now(),title:t||b.slice(0,40),body:b,tags:$('#nG').value,coin:c||null,px:px||null});ls.set('ek_notes',a.slice(0,500));$('#nT').value=$('#nB').value=$('#nG').value='';renderNotes();renderLvl()};
$('#nS').oninput=renderNotes;
$('#nExp').onclick=()=>{const blob=new Blob([JSON.stringify({notes:ls.get('ek_notes',[]),portfolio:ls.get('ek_port',[]),alerts:ls.get('ek_alerts',[])},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='entekhab-my-space.json';a.click()};
$('#nImp').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(Array.isArray(d.notes))ls.set('ek_notes',d.notes);if(Array.isArray(d.portfolio))ls.set('ek_port',d.portfolio);if(Array.isArray(d.alerts))ls.set('ek_alerts',d.alerts);renderAll()}catch(err){alert('JSON?')}};
function forms(){const cs=coinsList(),opt=cs.map(c=>`<option>${c}</option>`).join('');$('#pC').innerHTML=opt;$('#aC').innerHTML=opt;$('#nC').innerHTML='<option value="">—</option>'+opt;
 $('#aM').innerHTML=Object.entries(T('metrics')).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');$('#aL').innerHTML=Object.entries(T('lv')).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
 $('#nT').placeholder=T('notePh');$('#nG').placeholder=T('tagPh');$('#nS').placeholder=T('searchPh');$('#nB').placeholder=T('bodyPh')}
function renderAll(){forms();renderLvl();renderPf();renderAlerts();renderNotes()}
(async()=>{const [m,lg]=await Promise.all([j('/data/market.json'+V()),j('/data/logos/index.json'+V())]);M=m;LOGO=new Set(lg||[]);uiLang(renderAll)})();
</script>

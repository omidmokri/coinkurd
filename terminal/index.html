function coinsIn(q){const s=' '+q.toLowerCase()+' ',out=[];Object.keys(NAMES).sort((a,b)=>b.length-a.length).forEach(n=>{const i=s.indexOf(n);if(i>=0&&!out.some(o=>o[1]===NAMES[n]))out.push([i,NAMES[n]])});
 const tick=new Set((D.market?.coins||[]).map(c=>c.coin));const STOP=new Set(['WHY','IS','THE','OF','AND','OR','VS','PRICE','DOWN','UP','TODAY','WHAT','HOW','IN','ON','TO','ME','MY','IT','AT','BE','DO','GO','NO','SO','AN','AS','BY','IF','DNA','ARE','WAS','FOR','WITH','NOW','NEWS','COIN','COINS','MARKET']);(q.toUpperCase().match(/\b[A-Z0-9]{2,10}\b/g)||[]).forEach(w=>{const i=q.toUpperCase().indexOf(w);if(tick.has(w)&&!STOP.has(w)&&!out.some(o=>o[1]===w))out.push([i,w])});
 return out.sort((a,b)=>a[0]-b[0]).map(x=>x[1])}

function coinLine(c){const k=(D.market?.coins||[]).find(x=>x.coin===c);if(!k)return L3(`دادهٔ ${c} در اسکنر نیست.`,`داتای ${c} لە پشکنەردا نییە.`,`${c} is not in the scanner.`);

function why(c){const k=(D.market?.coins||[]).find(x=>x.coin===c),btc=(D.market?.coins||[]).find(x=>x.coin==='BTC');if(!k)return coinLine(c);const out=[coinLine(c)];
 const cut=Date.now()-30*36e5,nn=(D.news?.items||[]).filter(n=>n.coins?.includes(c)&&Date.parse(n.date)>=cut);
 if(btc&&c!=='BTC'){const d=(k.chg24||0)-(btc.chg24||0);out.push(Math.abs(d)<2&&Math.sign(k.chg24)===Math.sign(btc.chg24)?L3(`• هم‌جهت با بیت‌کوین (${btc.chg24}٪) حرکت کرده؛ حرکت عمومی بازار.`,`• هاوئاڕاستە لەگەڵ بیتکۆین (${btc.chg24}٪).`,`• Moved with Bitcoin (${btc.chg24}%) — a market-wide move.`):L3(`• حرکت مستقل از بیت‌کوین: ${d>0?'+':''}${d.toFixed(2)} واحد درصد اختلاف.`,`• جوڵەی سەربەخۆ لە بیتکۆین: ${d.toFixed(2)} خاڵ.`,`• Independent of Bitcoin: ${d>0?'+':''}${d.toFixed(2)} pp difference.`))}
 const vs=(D.market.opportunities||[]).filter(o=>o.coin===c&&o.type==='volume_spike');if(vs.length)out.push(L3(`• جهش حجم معاملات (×${vs[0].detail?.x??'?'}) هم‌زمان با حرکت.`,`• بازدانی قەبارە لەگەڵ جوڵەکە.`,`• A volume spike (×${vs[0].detail?.x??'?'}) coincided with the move.`));
 const sw=(D.deriv?.swaps||[]).find(s=>s.coin===c);if(sw&&sw.funding!=null)out.push(L3(`• فاندینگ OKX: ${sw.funding}٪ هر ۸ ساعت (${sw.funding_ann}٪ سالانه).`,`• فەندینگی OKX: ${sw.funding}٪.`,`• OKX funding: ${sw.funding}% per 8h (${sw.funding_ann}%/yr).`));

  ex.forEach(x=>{const h=.15+Math.sqrt(x.vol_btc/mx)*2.6,base=ll(x.lat,x.lon,R),dir=base.clone().normalize(),geo=new THREE.CylinderGeometry(.07,.07,h,8);geo.translate(0,h/2,0);const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0xf7931a,transparent:true,opacity:.9}));m.position.copy(base);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);layer.add(m)});
  $('#ginfo').innerHTML=ex.slice(0,6).map(x=>`${esc(x.country)} <span class="num">${fm(x.vol_btc,0)} BTC</span> <span style="color:#777">(${x.top.slice(0,2).map(esc).join(', ')})</span>`).join(' · ')+`<br>${esc(D.flows?.exchanges_note||'')}`}
 else{const n=D.chain?.nodes;if(!n?.cells){$('#ginfo').textContent=T('noData');return}const P=[],C=[];n.cells.forEach(([la,lo,c])=>{const v=ll(la,lo,R*1.01);P.push(v.x,v.y,v.z);const k=Math.min(1,Math.log2(1+c)/8);C.push(1,.55+.4*k,.15+.6*k)});
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(C,3));layer.add(new THREE.Points(geo,new THREE.PointsMaterial({size:.12,vertexColors:true})));
  $('#ginfo').innerHTML=`<span class="num">${fm(n.total,0)}</span> ${L3('نود در دسترس','نۆدی بەردەست','reachable nodes')} · ${n.countries} ${L3('کشور','وڵات','countries')} · ${(n.top_countries||[]).slice(0,5).map(([c,k])=>`${c} ${k}`).join(' · ')}<br>bitnodes.io · ${n.at?.slice(0,16).replace('T',' ')} UTC`}}
/* ---------- sentiment thermometer ---------- */
function therm(){const s=D.dna?.headline_sentiment,f=D.market?.fng,btc=D.dna?.coins?.BTC?.raw,br=D.brain?.regime?.breadth;if(!s&&!f){$('#therm').innerHTML=`<p class="disc">${T('noData')}</p>`;return}
 const hs=s?.score7==null?null:Math.round(50+50*s.score7),mood=[hs,f?.value].filter(v=>v!=null),moodV=mood.length?Math.round(mood.reduce((a,b)=>a+b)/mood.length):null;
 const real=btc?.ret7!=null?Math.max(0,Math.min(100,50+btc.ret7*4)):null,realV=real!=null&&br?Math.round((real+br.up_pct)/2):real;
 const gap=moodV!=null&&realV!=null?moodV-realV:null;
 $('#therm').innerHTML=`<div class="therm"><div style="text-align:center"><div class="tube"><i style="height:${moodV??0}%"></i></div><small class="disc">${L3('هیجان','هەست','Mood')}</small><div class="big" style="font-size:1.3rem">${moodV??'—'}</div></div>
 <div style="text-align:center"><div class="tube"><i style="height:${realV??0}%"></i></div><small class="disc">${L3('رفتار واقعی','ڕەفتاری ڕاستەقینە','Reality')}</small><div class="big" style="font-size:1.3rem">${realV??'—'}</div></div>
 <div style="flex:1;font-size:.86rem;line-height:1.9">${L3('هیجان = میانگین ترس‌وطمع','هەست = تێکڕای ترس و تەماح','Mood = avg of Fear & Greed')} (<b class="num">${f?.value??'—'}</b>) ${L3('و لحن تیترهای ۷ روز','و تۆنی سەردێڕەکان','and 7-day headline tone')} (<b class="num">${hs??'—'}</b>, n=${s?.n7??0})<br>${L3('رفتار واقعی = بازده ۷ روزهٔ BTC','ڕەفتار = قازانجی ٧ ڕۆژی BTC','Reality = BTC 7-day return')} (${sg(btc?.ret7)}) ${L3('و پهنای بازار','و پانیی بازاڕ','and breadth')} (<b class="num">${br?.up_pct??'—'}%</b> ⬆)<br><b>${gap==null?'—':Math.abs(gap)<10?L3('هم‌راستا: هیجان با واقعیت می‌خواند.','هاوئاڕاستە.','Aligned: mood matches reality.'):gap>0?L3('هیجان جلوتر از واقعیت است (خوش‌بینی بیش از حد؟)','هەست لە پێش ڕاستییە','Mood runs ahead of reality (over-optimism?)'):L3('بدبینی بیشتر از واقعیت است (ترس بیش از حد؟)','ترس زیاترە لە ڕاستی','Pessimism exceeds reality (excess fear?)')}</b> <span class="num">(${gap>0?'+':''}${gap??''})</span></div></div>
 ${s?.days?.length?`<div class="row" style="margin-top:10px">${s.days.map(d=>`<span class="chip" title="+${d.pos} / −${d.neg}">${d.day.slice(5)} <b class="num" style="color:${d.score>0?'var(--g)':d.score<0?'var(--r)':'#aaa'}">${d.score>0?'+':''}${d.score}</b></span>`).join('')}</div>`:''}
 <p class="disc">alternative.me · RSS (${L3('لحن تیتر با واژه‌نامه؛ نه شبکه‌های اجتماعی','تۆنی سەردێڕ بە فەرهەنگ','lexicon headline tone; not social media')}) · Binance</p>`}
/* ---------- claim-proof lab ---------- */
const CLAIMS=[
 ['btcUp',{fa:'بیت‌کوین در روند صعودی است',ckb:'بیتکۆین لە ڕەوتی بەرزبوونەوەدایە',en:'Bitcoin is in an uptrend'}],
 ['altSeason',{fa:'فصل آلت‌کوین‌ها شروع شده',ckb:'وەرزی ئاڵتکۆینەکان دەستی پێکردووە',en:'Altcoin season is starting'}],
 ['overheat',{fa:'بازار مشتقات بیش از حد داغ است',ckb:'بازاڕی مەشتەقە زۆر گەرمە',en:'Leverage is overheated'}],
 ['whales',{fa:'نهنگ‌ها در حال خرید هستند',ckb:'نەهەنگەکان دەکڕن',en:'Whales are buying'}],
 ['fear',{fa:'بازار در ترس است',ckb:'بازاڕ لە ترسدایە',en:'The market is fearful'}],
 ['volExp',{fa:'نوسان بیت‌کوین در آستانهٔ انفجار است',ckb:'لەرزینی بیتکۆین نزیکە بتەقێتەوە',en:'Bitcoin volatility is about to expand'}],
 ['aiFlow',{fa:'پول به سمت کوین‌های هوش مصنوعی می‌رود',ckb:'پارە بەرەو دراوەکانی AI دەچێت',en:'Money is flowing into AI coins'}],
 ['netHealth',{fa:'شبکهٔ بیت‌کوین سالم و فعال است',ckb:'تۆڕی بیتکۆین تەندروستە',en:'The Bitcoin network is healthy'}]];
function claimEval(id){const E=[],add=(l,v,ok,src)=>E.push({l,v,ok,src});const m=D.market||{},btc=(m.coins||[]).find(c=>c.coin==='BTC')||{},dr=D.dna?.coins?.BTC?.raw||{},br=D.brain?.regime;
 if(id==='btcUp'){add('trend (1h EMA20/50)',btc.trend,btc.trend==='up'?1:btc.trend==='down'?-1:0,'Binance');add('30d',dr.ret30!=null?dr.ret30+'%':null,dr.ret30==null?0:dr.ret30>0?1:-1,'Binance');add('90d',dr.ret90!=null?dr.ret90+'%':null,dr.ret90==null?0:dr.ret90>0?1:-1,'Binance');add('regime',br?.regime,br?.regime==='bull'?1:br?.regime==='bear'?-1:0,'brain')}
 if(id==='altSeason'){const cs=Object.entries(D.dna?.coins||{}).filter(([c])=>c!=='BTC'),b30=dr.ret30;const out=b30==null?null:cs.filter(([,v])=>v.raw.ret30!=null&&v.raw.ret30>b30).length;add(L3('آلت‌های بهتر از BTC در ۳۰ روز','','Alts beating BTC over 30d'),out==null?null:`${out}/${cs.length}`,out==null?0:out/cs.length>.6?1:out/cs.length<.4?-1:0,'Binance');
  const dom=D.flows?.dominance||[];if(dom.length>1){const d=dom.at(-1).btc-dom[0].btc;add('BTC dominance Δ',`${d>0?'+':''}${d.toFixed(2)} pp`,d<-.3?1:d>.3?-1:0,'CoinGecko')}add('breadth',br?`${br.breadth?.up_pct}% ⬆`:null,br?br.breadth.up_pct>55?1:br.breadth.up_pct<40?-1:0:0,'brain')}
 if(id==='overheat'){const d=D.deriv||{},B=d.BTC||{};add('OI-weighted funding (8h)',d.avg_funding!=null?d.avg_funding+'%':null,d.avg_funding==null?0:d.avg_funding>0.03?1:d.avg_funding<0.005?-1:0,'OKX');add('BTC funding (ann.)',B.funding_ann!=null?B.funding_ann+'%':null,B.funding_ann==null?0:B.funding_ann>30?1:B.funding_ann<8?-1:0,'OKX');add('BTC long/short',B.long_short?.length?B.long_short.at(-1)[1]:null,B.long_short?.length?(B.long_short.at(-1)[1]>2.2?1:B.long_short.at(-1)[1]<1.2?-1:0):0,'OKX');
  const h=d.history||[];if(h.length>24){const ch=(h.at(-1).oi/h.at(-25).oi-1)*100;add('OI 24h',ch.toFixed(1)+'%',ch>8?1:ch<-5?-1:0,'OKX')}}
 if(id==='whales'){add(L3('دادهٔ کیف‌پول نهنگ‌ها','داتای جزدانی نەهەنگ','Whale wallet data'),L3('منبع رایگان معتبر ندارد','نییە','no reliable free source'),0,'—');add('BTC taker buy share 7d',dr.taker7!=null?dr.taker7+'%':null,dr.taker7==null?0:dr.taker7>52?1:dr.taker7<48?-1:0,'Binance');const lq=D.deriv?.BTC?.liq;if(lq)add('BTC liquidations short vs long',`${usd(lq.short_usd)} / ${usd(lq.long_usd)}`,lq.short_usd>lq.long_usd*1.5?1:lq.long_usd>lq.short_usd*1.5?-1:0,'OKX')}
 if(id==='fear'){const f=m.fng;add('Fear & Greed',f?.value,f?.value==null?0:f.value<40?1:f.value>60?-1:0,'alternative.me');const s=D.dna?.headline_sentiment?.score7;add('headline tone 7d',s,s==null?0:s<-.1?1:s>.1?-1:0,'RSS')}
 if(id==='volExp'){const v=D.lab?.vol?.BTC;if(v){add('BB width rank (1y)',v.bw_rank,v.bw_rank<=15?1:v.bw_rank>=60?-1:0,'Binance');add('RV7 / RV90',`${v.rv7}% / ${v.rv90}%`,v.rv7<v.rv90*.6?1:v.rv7>v.rv90?-1:0,'Binance')}const o=D.lab?.options?.BTC;if(o?.dvol)add('DVOL now vs 7d',`${o.dvol.now} / ${o.dvol.d7_ago}`,o.dvol.now<o.dvol.d7_ago-3?1:0,'Deribit')}
 if(id==='aiFlow'){const s=(D.flows?.sectors||[]).find(r=>r.id==='artificial-intelligence');if(s)add('AI sector mcap 24h',`${s.chg24}% (${usd(s.delta_usd)})`,s.chg24>1?1:s.chg24<-1?-1:0,'CoinGecko');const n=(D.narr?.narratives||[]).find(x=>/ai/i.test(x.id));if(n){add('AI narrative mentions / momentum',`${n.mentions_24h} · ×${n.momentum}`,n.momentum>1.3?1:n.momentum<.8?-1:0,'RSS');add('AI coins 24h',n.perf_24h!=null?n.perf_24h+'%':null,n.perf_24h==null?0:n.perf_24h>0?1:-1,'Binance')}}
 if(id==='netHealth'){const c=D.chain||{},b=c.blocks||[];if(b.length>1){const span=(b[0].timestamp-b.at(-1).timestamp)/(b.length-1)/60;add('avg block time (last 15)',span.toFixed(1)+' min',span<12?1:span>15?-1:0,'mempool.space')}add('hashrate',c.hashrate?(c.hashrate/1e21).toFixed(2)+' ZH/s':null,c.hashrate?1:0,'mempool.space');add('reachable nodes',c.nodes?.total,c.nodes?.total?(c.nodes.total>10000?1:0):0,'bitnodes.io');add('fee (30 min)',c.fees?c.fees.halfHourFee+' sat/vB':null,c.fees?1:0,'mempool.space')}
 const known=E.filter(e=>e.v!=null&&e.v!==undefined),sc=known.reduce((a,e)=>a+e.ok,0);
 const v=id==='whales'?'na':!known.length?'na':known.every(e=>e.ok===0)?'nd':sc>=Math.max(2,known.length*.5)?'ok':sc<=-Math.max(1,known.length*.4)?'no':'mix';
 return {E,v}}
function claim(){const sel=$('#claimSel');if(!sel.options.length||sel.dataset.l!==lang){const cur=sel.value;sel.innerHTML=CLAIMS.map(([id,t])=>`<option value="${id}">${esc(t[lang]||t.en)}</option>`).join('');sel.dataset.l=lang;if(cur)sel.value=cur}
 const {E,v}=claimEval(sel.value||CLAIMS[0][0]);const VL={ok:L3('پشتیبانی می‌شود','پشتگیری دەکرێت','Supported'),no:L3('رد می‌شود','ڕەت دەکرێتەوە','Contradicted'),mix:L3('شواهد متناقض','بەڵگەی ناکۆک','Mixed evidence'),nd:L3('دادهٔ فعلی آن را تأیید نمی‌کند','داتای ئێستا پشتگیری ناکات','Not supported by current data'),na:L3('قابل‌اثبات نیست','ناسەلمێندرێت','Cannot be verified')};
 $('#claim').innerHTML=`<span class="verdict ${v}">${VL[v]}</span>${E.map(e=>`<div class="evd">${e.ok>0?'✅':e.ok<0?'❌':'➖'} ${esc(e.l)}: <span>${esc(e.v??'—')}</span> <span class="disc">${esc(e.src)}</span></div>`).join('')}<p class="disc">${L3('قواعد ساده و شفاف روی دادهٔ واقعی؛ ✅ موافق ادعا، ❌ مخالف، ➖ خنثی/نامعلوم.','','Simple transparent rules on real data; ✅ supports, ❌ contradicts, ➖ neutral/unknown.')}</p>`}
$('#claimSel').onchange=claim;
/* ---------- prediction-quality index ---------- */
function acc(){const log=D.clog||[];if(!log.length){$('#acc').innerHTML=`<p class="disc">${L3('ثبت پیش‌بینی‌های میزگرد هوش مصنوعی از امروز شروع شده؛ هر نظر ۷ روز بعد با حرکت واقعی بیت‌کوین سنجیده می‌شود.','تۆمارکردن لە ئەمڕۆوە دەستی پێکردووە.','Logging of the AI council’s calls has started; each call is scored against Bitcoin’s real move 7 days later.')}</p>`;return}
 const btcNow=(D.market?.coins||[]).find(c=>c.coin==='BTC')?.price,sc={},pend=[];
 log.forEach(e=>{const age=(Date.now()-Date.parse(e.at))/864e5;const later=log.find(x=>Math.abs((Date.parse(x.at)-Date.parse(e.at))/864e5-7)<1.5);const p2=later?.btc??(age>=7&&age<9?btcNow:null);
  if(age<7||!e.btc||!p2){pend.push(e);return}const r=(p2/e.btc-1)*100;Object.entries(e.stances||{}).forEach(([a,[s]])=>{sc[a]=sc[a]||{n:0,hit:0};if(s==='neutral'){if(Math.abs(r)<3){sc[a].n++;sc[a].hit++}else sc[a].n++}else{sc[a].n++;if((s==='bullish')===(r>0))sc[a].hit++}})});
 const rows=Object.entries(sc);$('#acc').innerHTML=(rows.length?`<table><tr><th></th><th>n</th><th>${L3('دقت','وردی','Hit rate')}</th></tr>${rows.map(([a,v])=>`<tr><td>${esc(a)}</td><td class="num">${v.n}</td><td class="num">${Math.round(v.hit*100/v.n)}%</td></tr>`).join('')}</table>`:'')+`<p class="disc">${log.length} ${L3('نظر ثبت‌شده','بۆچوونی تۆمارکراو','logged calls')} · ${pend.length} ${L3('در انتظار ۷ روز','چاوەڕێی ٧ ڕۆژ','waiting for 7 days')} · ${L3('روش: صعودی/نزولی = جهت درست بازده ۷ روزه؛ خنثی = حرکت کمتر از ۳٪','','method: bullish/bearish = correct sign of the 7-day BTC return; neutral = |move| < 3%')}</p>`}

function render(){layout();$('#q').placeholder=T('ph');$('#ex').innerHTML=T('ex').map(x=>`<button>${esc(x)}</button>`).join('');wall();deriv();flow();therm();claim();acc();globeLayer()}
uiLang(()=>{if(D.market!==undefined)render()});load().then(()=>{globeInit();const q=new URLSearchParams(location.search).get('q');if(q)ask(q)});setInterval(()=>{if(!document.hidden)load()},120000);

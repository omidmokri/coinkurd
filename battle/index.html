 S.bidL=vis(bids,r.low-r.R*.3,1e18);S.askL=vis(asks,0,r.high+r.R*.3);$('#bidL').textContent=fmtU(S.bidL);$('#askL').textContent=fmtU(S.askL);
 if(!S.UN){S.UN=Math.max(500,(S.bidL+S.askL)/1000)}const bb=bucketize(bids),ab=bucketize(asks);const maxC=Math.max(...bb.map(b=>b.usd),...ab.map(b=>b.usd),1)/S.UN;
 const tot=(bb.reduce((s,b)=>s+b.usd,0)+ab.reduce((s,b)=>s+b.usd,0))/S.UN;if(tot>2*ACAP)S.UN*=1.5;
 if(R3){placeArmy(bull,bb,-1);placeArmy(bear,ab,1)}drawDepth();
 const wall=(bk,kind)=>{for(const b of bk){if(b.usd>=S.UN*120&&Math.abs(X(b.p))<70&&!S.walls.has(kind+b.k)){S.walls.add(kind+b.k);feed({k:kind,usd:b.usd,p:b.p})}}};wall(bb,'wallB');wall(ab,'wallA');if(S.walls.size>400)S.walls=new Set()}
function drawDepth(){const cv=$('#depth'),x=cv.getContext('2d'),W=cv.width,H=cv.height,r=S.round;if(!r)return;x.clearRect(0,0,W,H);const lo=r.low-r.R*.6,hi=r.high+r.R*.6,px=p=>(p-lo)/(hi-lo)*W;
 const cum=(a,asc)=>{let s=0;const o=[];for(const [p,q] of a){if(+p<lo||+p>hi)continue;s+=(+p)*(+q);o.push([+p,s])}return o};const B=cum(S.bids),A=cum(S.asks);const mx=Math.max(B.length?B[B.length-1][1]:0,A.length?A[A.length-1][1]:0,1);
 const area=(arr,col)=>{if(!arr.length)return;x.beginPath();x.moveTo(px(arr[0][0]),H);arr.forEach(([p,s])=>x.lineTo(px(p),H-s/mx*(H-10)));x.lineTo(px(arr[arr.length-1][0]),H);x.closePath();x.fillStyle=col;x.fill()};
 area(B,'rgba(34,197,94,.45)');area(A,'rgba(239,68,68,.45)');x.strokeStyle='#f7931a';x.lineWidth=2;const fp=px(S.price||r.p0);x.beginPath();x.moveTo(fp,0);x.lineTo(fp,H);x.stroke();
 $('#axL').textContent=fmtP(lo);$('#axM').textContent=fmtP(S.price||r.p0);$('#axR').textContent=fmtP(hi)}
/* ======================= trades / liquidations ======================= */
function onTrade(p,q,isSell,t){if(!S.round)return;const usd=p*q;S.trades.push({t,usd,sell:isSell});const cut=t-6e4;while(S.trades.length&&S.trades[0].t<cut)S.trades.shift();
 if(usd>=800||Math.random()<.15)shoot(isSell?'sell':'buy',usd,false);if(usd>=1e5){feed({k:usd>=5e5?(isSell?'hugeSell':'hugeBuy'):(isSell?'bigSell':'bigBuy'),usd,p});snd(isSell?220:440,.08,.05)}}
function onLiq(side,usd,p,t){if(!S.round||usd<1000)return;S.liqs.push({t,usd,side});const cut=t-6e5;while(S.liqs.length&&S.liqs[0].t<cut)S.liqs.shift();
 if(usd>=5e5){for(let i=0;i<3;i++)setTimeout(()=>shoot(side,usd/3,true),i*260)}else shoot(side,usd,true);if(usd>=1e4)feed({k:side==='long'?'liqL':'liqS',usd,p});snd(side==='long'?90:140,.25,Math.min(.25,usd/2e6+.06))}
function updStats(){const now=Date.now();const b=S.trades.filter(x=>!x.sell).reduce((s,x)=>s+x.usd,0),s=S.trades.filter(x=>x.sell).reduce((a,x)=>a+x.usd,0),tot=b+s||1;$('#buyP').textContent=fmtU(b)+' · '+Math.round(b/tot*100)+'%';$('#sellP').textContent=Math.round(s/tot*100)+'% · '+fmtU(s);$('#pI').style.width=(b/tot*100)+'%';
 const ll=S.liqs.filter(x=>x.side==='long').reduce((a,x)=>a+x.usd,0),ls_=S.liqs.filter(x=>x.side==='short').reduce((a,x)=>a+x.usd,0);$('#lqS').textContent=fmtU(ls_);$('#lqL').textContent=fmtU(ll);$('#scB').textContent=S.score.bulls;$('#scR').textContent=S.score.bears;$('#liqSrc').textContent=S.lqSrc||'…';void now}
function feed(ev){ev.t=Date.now();S.feed.unshift(ev);S.feed=S.feed.slice(0,60);renderFeed()}
function renderFeed(){const F=T('f');$('#feed').innerHTML=S.feed.slice(0,30).map(e=>{const cls=/Buy|liqS|wallB/.test(e.k)?'buy':/Sell|liqL|wallA/.test(e.k)?'sell':'win';return `<div class="it ${cls}"><span class="t">${new Date(e.t).toLocaleTimeString('en-GB')}</span><span class="k">${e.k==='win'?(e.side==='bulls'?F.bullsWin:F.bearsWin):F[e.k]||e.k}${e.p?` <span class="t">@ ${fmtP(e.p)}</span>`:''}</span><span class="u">${e.usd?fmtU(e.usd):''}</span></div>`}).join('')}
function updRound(){const r=S.round,p=S.price||r.p0;$('#lowP').textContent=fmtP(r.low);$('#highP').textContent=fmtP(r.high);$('#rndI').style.left=(THREE.MathUtils.clamp((p-r.low)/(r.high-r.low),0,1)*100)+'%'}
function onPrice(p){S.price=p;if(!S.round)newRound(p);const r=S.round;if(p>=r.high){win('bulls');return}if(p<=r.low){win('bears');return}const now=performance.now();if(now-S.pxT<120)return;S.pxT=now;
 $('#px').textContent=fmtP(p);if(S.open){const c=(p/S.open-1)*100;const e=$('#ch');e.textContent=(c>=0?'+':'')+c.toFixed(2)+'% 24h';e.className='ch '+(c>=0?'pos':'neg')}if(R3)relabel(frontLbl,fmtP(p),'#ffd59a');updRound()}
function win(side){S.score[side]++;ls.set('ek_battle',S.score);feed({k:'win',side});const bn=$('#banner');bn.className='banner show '+(side==='bulls'?'bull':'bear');bn.innerHTML=(side==='bulls'?T('bullsWin'):T('bearsWin'))+`<small>${T('newRound')} ${fmtP(S.price)}</small>`;setTimeout(()=>bn.classList.remove('show'),4200);
 if(R3){const bx=side==='bulls'?68:-68;for(let i=0;i<5;i++)setTimeout(()=>boom(bx+(Math.random()-.5)*10,(Math.random()-.5)*12,2.2,side==='bulls'?0x86efac:0xfca5a5),i*180)}snd(side==='bulls'?660:160,.5,.2);
 newRound(S.price);S.pxT=0;if(S.bids.length)onBook(S.bids,S.asks)}
/* ======================= sound (optional, synthesized) ======================= */
function snd(freq,dur,vol){if(!SND.on)return;try{if(!SND.ctx)SND.ctx=new (window.AudioContext||window.webkitAudioContext)();const c=SND.ctx,o=c.createOscillator(),g=c.createGain();o.type=freq<200?'sawtooth':'triangle';o.frequency.setValueAtTime(freq,c.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*.4),c.currentTime+dur);g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+dur)}catch(e){}}
/* ======================= streams ======================= */
let bookTimer=null,retry=0;
async function pollBook(){if(document.hidden)return;const d=await j(`https://data-api.binance.vision/api/v3/depth?symbol=${SYM}USDT&limit=1000`);if(d&&d.bids&&S.round)onBook(d.bids,d.asks)}
function connect(){disconnect();const s=SYM.toLowerCase();$('#srcLbl').textContent=`BINANCE SPOT · ${SYM}/USDT`;$('#px').textContent=T('conn');
 try{S.ws=new WebSocket(`wss://data-stream.binance.vision/stream?streams=${s}usdt@aggTrade/${s}usdt@bookTicker/${s}usdt@miniTicker`)}catch(e){return}
 S.ws.onopen=()=>{retry=0;pollBook();bookTimer=setInterval(pollBook,2200)};
 S.ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}const st=m.stream||'',d=m.data||{};
  if(st.endsWith('@bookTicker')){const mid=(+d.b+(+d.a))/2;if(mid>0)onPrice(mid)}
  else if(st.endsWith('@aggTrade')){onTrade(+d.p,+d.q,!!d.m,d.T||Date.now())}
  else if(st.endsWith('@miniTicker')){S.open=+d.o;if(!S.price)onPrice(+d.c)}};
 S.ws.onclose=()=>{clearInterval(bookTimer);S.ws=null;if(!document.hidden)setTimeout(connect,Math.min(2e4,1500*Math.pow(2,retry++)))};
 liqConnect()}
function disconnect(){clearInterval(bookTimer);if(S.ws){S.ws.onclose=null;try{S.ws.close()}catch(e){}S.ws=null}if(S.lws){S.lws.onclose=null;try{S.lws.close()}catch(e){}S.lws=null}clearTimeout(S.lfb)}
function liqConnect(){const s=SYM.toLowerCase();let got=false;S.lqSrc='Binance Futures …';try{S.lws=new WebSocket(`wss://fstream.binance.com/ws/${s}usdt@forceOrder`)}catch(e){return liqOkx()}
 S.lws.onmessage=ev=>{try{const o=JSON.parse(ev.data).o;if(!o)return;got=true;S.lqSrc='Binance Futures';const px=+o.ap||+o.p,usd=px*(+o.z||+o.q);onLiq(o.S==='SELL'?'long':'short',usd,px,o.T||Date.now())}catch(e){}};
 S.lws.onerror=()=>{if(!got)liqOkx()};S.lws.onclose=()=>{if(S.lqSrc==='OKX')return;S.lws=null;if(!document.hidden)setTimeout(liqConnect,6000)};
 S.lfb=setTimeout(()=>{if(!got)liqOkx()},15000)}
async function liqOkx(){if(S.lws){S.lws.onclose=null;try{S.lws.close()}catch(e){}}S.lqSrc='OKX';const ins=await j('https://www.okx.com/api/v5/public/instruments?instType=SWAP'),CT={};((ins&&ins.data)||[]).forEach(x=>CT[x.instId]={v:+x.ctVal,t:x.ctType});
 try{S.lws=new WebSocket('wss://ws.okx.com/ws/v5/public')}catch(e){return}let ping=null;
 S.lws.onopen=()=>{S.lws.send(JSON.stringify({op:'subscribe',args:[{channel:'liquidation-orders',instType:'SWAP'}]}));ping=setInterval(()=>{try{S.lws&&S.lws.readyState===1&&S.lws.send('ping')}catch(e){}},25000)};
 S.lws.onmessage=ev=>{if(ev.data==='pong')return;let m;try{m=JSON.parse(ev.data)}catch(e){return}(m.data||[]).forEach(it=>{const fam=it.instFamily||'';if(fam!==`${SYM}-USDT`&&fam!==`${SYM}-USD`)return;const c=CT[it.instId]||{v:1,t:'linear'};(it.details||[]).forEach(d=>{const px=+d.bkPx,sz=+d.sz;if(!px||!sz)return;onLiq(d.posSide==='long'||(d.posSide==='net'&&d.side==='sell')?'long':'short',c.t==='inverse'?sz*c.v:sz*c.v*px,px,+d.ts||Date.now())})})};
 S.lws.onclose=()=>{clearInterval(ping);S.lws=null;if(!document.hidden)setTimeout(liqOkx,6000)}}
/* ======================= ui ======================= */
function setSym(s){SYM=s;ls.set('ek_bf_sym',s);S.price=null;S.open=null;S.round=null;S.UN=null;S.bids=[];S.asks=[];S.trades=[];S.liqs=[];S.walls=new Set();PJ.length=0;$('#feed').innerHTML='';if(R3){[bull,bear].forEach(A=>{[A.body,A.head,A.tank,A.tur].forEach(m=>m.count=0)})}connect()}
function ui(){$('#sym').innerHTML=SYMS.map(s=>`<option${s===SYM?' selected':''}>${s}</option>`).join('');$('#sym').onchange=()=>setSym($('#sym').value);
 const L=T('lights');$('#lightSel').innerHTML=Object.entries(L).map(([k,v])=>`<option value="${k}"${k===lightSet?' selected':''}>${v}</option>`).join('');$('#lightSel').onchange=()=>R3&&setLight($('#lightSel').value);
 const sb=$('#sndB');sb.textContent=(SND.on?'🔊 ':'🔇 ')+T('snd');sb.classList.toggle('on',SND.on);sb.onclick=()=>{SND.on=!SND.on;ls.set('ek_bf_snd',SND.on);ui();if(SND.on)snd(440,.15,.1)};
 $('#fsB').onclick=()=>{const b=$('#bf');if(document.fullscreenElement){document.exitFullscreen()}else if(b.requestFullscreen){b.requestFullscreen().catch(()=>b.classList.toggle('fs'))}else b.classList.toggle('fs');setTimeout(resize,300)};
 $('#helpB').onclick=()=>{const i=$('#intro');i.hidden=!i.hidden};$('#zIn').onclick=()=>zoom(-12);$('#zOut').onclick=()=>zoom(12);
 $('#nogl').innerHTML=T('nogl');renderFeed()}
document.addEventListener('fullscreenchange',()=>setTimeout(resize,200));
document.addEventListener('visibilitychange',()=>{if(document.hidden)disconnect();else{lastF=performance.now();connect()}});
uiLang(ui);setInterval(updStats,1000);setTimeout(()=>{$('#intro').hidden=true},9000);
if(hasGL()){try{init3d()}catch(e){R3=null;$('#nogl').hidden=false}}else{$('#nogl').hidden=false}
connect();

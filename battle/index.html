body{overflow-x:hidden}
.bf{position:relative;direction:ltr;height:calc(100vh - 60px);min-height:540px;background:#0a0a0a;overflow:hidden;user-select:none;--glass:rgba(10,12,16,.55);--gb:rgba(255,255,255,.08)}

.pan{position:absolute;background:var(--glass);border:1px solid var(--gb);border-radius:14px;padding:8px 12px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#e8e6e0;font-size:.8rem;box-shadow:0 8px 30px rgba(0,0,0,.25)}

.rnd{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:6px;font-size:.72rem}
.rnd .bar{height:7px;border-radius:5px;background:linear-gradient(90deg,#ef4444,#3f3f46 50%,#22c55e);position:relative}

.feed .it{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:4px 0;border-top:1px solid rgba(255,255,255,.07);font-size:.72rem;align-items:center;cursor:pointer}

.ctl button.on,.grp button.on{border-color:var(--o);color:var(--o)}
.grp{display:inline-flex;gap:0}.grp button{border-radius:0}.grp button:first-child{border-radius:10px 0 0 10px}.grp button:last-child{border-radius:0 10px 10px 0}
.settings{right:10px;top:56px;width:min(300px,calc(100% - 20px));font-size:.74rem;z-index:3}.settings label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}.settings select,.settings input[type=range]{max-width:55%}.settings input[type=range]{width:140px}

.replay{position:absolute;left:50%;bottom:142px;transform:translateX(-50%);width:min(560px,calc(100% - 20px));padding:6px 12px;display:flex;gap:8px;align-items:center;font-size:.72rem}

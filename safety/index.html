  `<div class="kp"><div><small>${T('price')}</small><b>${P?.priceUsd?'$'+(+P.priceUsd).toLocaleString('en-US',{maximumSignificantDigits:5}):'—'}</b></div><div><small>${T('liq')}</small><b>${usd(P?.liquidity?.usd)}</b></div><div><small>${T('vol')}</small><b>${usd(P?.volume?.h24)}</b></div><div><small>${T('fdv')}</small><b>${usd(P?.fdv)}</b></div><div><small>${T('age')}</small><b>${age}</b></div><div><small>${T('holders')}</small><b>${res?.holder_count?(+res.holder_count).toLocaleString('en-US'):'—'}</b></div></div>`+
  `<div class="flags">${F.sort((x,y)=>({bad:0,mid:1,ok:2}[x.level]-{bad:0,mid:1,ok:2}[y.level])).map(f=>f.html).join('')}</div>`+
  `<p class="disc">${T('src')}${P?`<a href="${esc(P.url)}" target="_blank" rel="noopener nofollow">${T('dex')}: ${esc(P.dexId)} ↗</a>`:''}</p>`}
$('#go').onclick=check;$('#ad').addEventListener('keydown',e=>{if(e.key==='Enter')check()});
document.querySelector('.ex').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('#ch').value=b.dataset.c;$('#ad').value=b.dataset.a;check()});
function render(){const v=$('#ch').value||'1';$('#ch').innerHTML=CH.map(([k,n])=>`<option value="${k}"${k===v?' selected':''}>${n}</option>`).join('');const q=new URLSearchParams(location.search);
 if(q.get('a')&&!$('#ad').value){$('#ad').value=q.get('a');if(q.get('c'))$('#ch').value=q.get('c');check()}else if($('#out').innerHTML&&$('#ad').value)check()}
uiLang(render);
</script>
</body>

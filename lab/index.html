const BN='https://data-api.binance.vision/api/v3';
const D={};
async function j(u){try{const r=await fetch(u);return r.ok?r.json():null}catch(e){return null}}
async function kl(sym,start,end,limit=1000){let u=`${BN}/klines?symbol=${sym}&interval=1d&limit=${limit}`;if(start)u+=`&startTime=${start}`;if(end)u+=`&endTime=${end}`;const k=await j(u);return (k||[]).map(x=>({t:x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4]}))}
async function px(sym='BTCUSDT'){const r=await j(`${BN}/ticker/price?symbol=${sym}`);return r?+r.price:null}

function applyLang(){const rtl=lang!=='en';document.documentElement.lang=lang;document.documentElement.dir=rtl?'rtl':'ltr';
 $('#hT').innerHTML=T('hT');$('#hL').textContent=T('hL');$('#honest').innerHTML=T('honest');
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T(e.dataset.t));
 const ids=['flowS','arenaS','tmS','dnaS','memS','derS','devS'];$('#tabs').innerHTML=T('tabs').map((t,i)=>`<a href="${i<7?'#'+ids[i]:'/'}">${t}</a>`).join('');
 document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));renderAll()}
$('#langs').onclick=e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{localStorage.setItem('ck_lang',lang)}catch(_){}applyLang()};

function renderPulse(){const m=D.market,b=D.brain,v=(D.lab||{}).vol||{};if(!m){$('#pulse').innerHTML='';return}
 const btc=(m.coins||[]).find(c=>c.coin==='BTC')||{},r=(b||{}).regime||{},br=r.breadth||{},g=(b?.gainers||[])[0],P=T('pulse');
 const sq=Object.entries(v).filter(([,x])=>x.state==='squeeze'||x.shift).map(([k])=>k);
 $('#pulse').innerHTML=[[P[0],`$${fm(btc.price,0)}`,sg(btc.chg24)],[P[1],(T('reg')[r.regime]||'—'),''],[P[2],m.fng?.value??'—',esc(m.fng?.class||'')],[P[3],br.up_pct!=null?`${br.up_pct}% ⬆`:'—',br.down_pct!=null?`${br.down_pct}% ⬇`:''],[P[4],g?g.coin:'—',g?sg(g.chg24):''],[P[5],sq.length?sq.slice(0,4).join(' '):'—','']].map(([a,b,c])=>`<div><small>${a}</small><b>${b}</b> <span style="font-size:.8rem">${c}</span></div>`).join('');
 const rep=b?.report?.[lang]||b?.report?.en;$('#pulseNote').innerHTML=rep?`<b>${esc(rep.headline)}</b>`:''}

/* ---------- Money flow ---------- */
function renderFlow(){const s=$('#flow'),nr=D.narr;if(!nr?.narratives?.length){s.innerHTML=`<text x="500" y="220" fill="#888" text-anchor="middle">${T('noData')}</text>`;return}
 const ns=nr.narratives.slice(0,12),mx=Math.max(1,...ns.map(n=>n.mentions_24h)),W=1000,H=440;
 const nodes=ns.map((n,i)=>({n,r:28+Math.sqrt(n.mentions_24h/mx)*70,x:W/2+Math.cos(i*2.4)*260*(i%3+1)/3,y:H/2+Math.sin(i*2.4)*150*(i%3+1)/3}));
 for(let it=0;it<300;it++){for(const a of nodes){a.x+=(W/2-a.x)*.01;a.y+=(H/2-a.y)*.012;for(const b of nodes){if(a===b)continue;const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1,m=a.r+b.r+6;if(d<m){const k=(m-d)/d*.5;a.x+=dx*k;a.y+=dy*k}}a.x=Math.max(a.r,Math.min(W-a.r,a.x));a.y=Math.max(a.r,Math.min(H-a.r,a.y))}}
 const col=p=>p==null?'#3a3d42':p>=0?`rgba(34,197,94,${.25+Math.min(.65,p/8)})`:`rgba(239,68,68,${.25+Math.min(.65,-p/8)})`;
 s.innerHTML=`<defs><filter id="gl"><feGaussianBlur stdDeviation="6"/></filter></defs>`+nodes.map((o,i)=>`<g data-i="${i}" style="cursor:pointer"><circle cx="${o.x}" cy="${o.y}" r="${o.r}" fill="${col(o.n.perf_24h)}" stroke="${o.n.momentum>1.3?'#f7931a':'rgba(255,255,255,.2)'}" stroke-width="${o.n.momentum>1.3?3:1}"><animate attributeName="r" values="${o.r};${o.r*1.04};${o.r}" dur="${3+i%4}s" repeatCount="indefinite"/></circle><text x="${o.x}" y="${o.y-4}" fill="#fff" text-anchor="middle" font-size="${Math.max(11,o.r/4)}" font-family="Vazirmatn">${esc(o.n.name[lang]||o.n.name.en)}</text><text x="${o.x}" y="${o.y+16}" fill="#ddd" text-anchor="middle" font-size="12">${o.n.perf_24h==null?'':(o.n.perf_24h>=0?'+':'')+o.n.perf_24h+'%'} · ${o.n.mentions_24h}</text></g>`).join('');
 s.onclick=e=>{const g=e.target.closest('g[data-i]');if(!g)return;const n=nodes[+g.dataset.i].n;$('#flowInfo').innerHTML=`<b style="color:#fff">${esc(n.name[lang]||n.name.en)}</b> — ×${n.momentum} · ${n.members.map(m=>`<span class="chip">${m.coin} ${m.chg24!=null?sg(m.chg24):''}</span>`).join('')}<br>${(n.headlines||[]).slice(0,3).map(h=>`<a href="${esc(h.url)}" target="_blank" rel="noopener nofollow" dir="ltr">• ${esc(h.title)}</a>`).join('<br>')}`}}

/* ---------- Prediction arena ---------- */
async function renderArena(){const el=$('#arena');let st=ls.get('ek_arena',{calls:[]});const now=Date.now(),p=await px();
 let changed=false;
 for(const c of st.calls){if(c.res==null&&now>=c.at+864e5){const k=await kl('BTCUSDT',c.at+864e5-6e4,c.at+864e5+36e5,1);const end=k[0]?.o||(now-c.at<9e7?p:null);if(end){c.end=end;c.res=(c.dir==='up')===(end>c.p)?1:0;changed=true}}}
 if(changed)ls.set('ek_arena',st);
 const done=st.calls.filter(c=>c.res!=null),hits=done.filter(c=>c.res).length;let streak=0;for(const c of [...done].reverse()){if(c.res)streak++;else break}
 const today=st.calls.find(c=>now-c.at<864e5);
 el.innerHTML=`<h3>${T('arenaT')} · BTC</h3><div class="big">$${fm(p,0)}</div>`+(today?`<p>${T('yourCall')}: <b>${today.dir==='up'?T('up'):T('dn')}</b> — ${T('locked')} <span class="num">$${fm(today.p,0)}</span> · ${T('resolveAt')}: <span class="num">${new Date(today.at+864e5).toLocaleString(lang==='en'?'en-GB':'fa-IR',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})}</span></p>`
 :`<div class="row" style="margin:12px 0"><button class="btn g" data-d="up">${T('up')}</button><button class="btn r" data-d="dn">${T('dn')}</button></div>`)
 +`<div class="row" style="gap:18px;margin-top:10px"><div><small class="disc">${T('hits')}</small><div class="big">${hits}/${done.length}</div></div><div><small class="disc">${T('streak')}</small><div class="big">🔥${streak}</div></div><div><small class="disc">%</small><div class="big">${done.length?Math.round(hits*100/done.length):0}</div></div></div>`
 +(done.length?`<table style="margin-top:10px"><tr><th>${T('history')}</th><th></th><th>${T('price')}</th><th></th></tr>${done.slice(-6).reverse().map(c=>`<tr><td class="num">${new Date(c.at).toISOString().slice(0,10)}</td><td>${c.dir==='up'?'⬆':'⬇'}</td><td class="num">${fm(c.p,0)} → ${fm(c.end,0)}</td><td>${c.res?'✅':'❌'}</td></tr>`).join('')}</table>`:'')
 +`<p style="margin-top:12px"><button class="btn" id="arShare">📤 ${T('share')}</button></p>`;
 el.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const pp=await px();if(!pp)return;st.calls.push({at:Date.now(),dir:b.dataset.d,p:pp});st.calls=st.calls.slice(-200);ls.set('ek_arena',st);renderArena()});
 $('#arShare').onclick=()=>share(`Entekhab Prediction Arena — ${hits}/${done.length} ✅ 🔥${streak}`,'https://entekhab.net/lab/#arenaS')}

let G=null;
async function newGuess(){const start=Date.UTC(2018,0,1),end=Date.now()-90*864e5,t=start+Math.random()*(end-start);const k=await kl('BTCUSDT',t,null,74);if(k.length<74){$('#guess').innerHTML=`<p class="disc">${T('noData')}</p>`;return}G={k,ans:null};drawGuess()}
function spark(k,hide,W=520,H=200,rv=G&&G.ans!=null){const lo=Math.min(...k.map(x=>x.l)),hi=Math.max(...k.map(x=>x.h)),n=k.length,X=i=>i*(W/(n-1)),Y=v=>H-6-(v-lo)/(hi-lo||1)*(H-12);
 const pts=k.slice(0,hide).map((x,i)=>`${X(i)},${Y(x.c)}`).join(' '),rest=k.slice(hide-1).map((x,i)=>`${X(i+hide-1)},${Y(x.c)}`).join(' ');
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><polyline points="${pts}" fill="none" stroke="#f7931a" stroke-width="2"/>${rv?`<polyline points="${rest}" fill="none" stroke="${k[n-1].c>=k[hide-1].c?'#22c55e':'#ef4444'}" stroke-width="2.5" stroke-dasharray="5 3"/>`:`<rect x="${X(hide-1)}" y="0" width="${W-X(hide-1)}" height="${H}" fill="rgba(255,255,255,.04)"/><text x="${(X(hide-1)+W)/2}" y="${H/2}" fill="#888" text-anchor="middle" font-size="28">?</text>`}<line x1="${X(hide-1)}" x2="${X(hide-1)}" y1="0" y2="${H}" stroke="#555" stroke-dasharray="3 3"/></svg>`}
function drawGuess(){const el=$('#guess'),s=ls.get('ek_guess',{h:0,n:0});if(!G){el.innerHTML='';return}const k=G.k,h=60;
 const up=k[k.length-1].c>=k[h-1].c,ch=(k[k.length-1].c/k[h-1].c-1)*100;
 el.innerHTML=`<h3>${T('guessT')}</h3><p class="disc" style="margin:-4px 0 8px">${T('guessL')}</p>${spark(k,h)}`+(G.ans==null?`<div class="row" style="margin-top:10px"><button class="btn g" data-g="1">${T('up')}</button><button class="btn r" data-g="0">${T('dn')}</button></div>`
 :`<p style="margin-top:8px"><b>${G.ans===up?T('right'):T('wrong')}</b> ${sg(+ch.toFixed(2))} · ${T('was')}: <span class="num">${new Date(k[0].t).toISOString().slice(0,10)} → ${new Date(k[k.length-1].t).toISOString().slice(0,10)}</span></p><button class="btn p" id="gNext">${T('next')}</button>`)
 +`<p class="disc">${T('score')}: <span class="num">${s.h}/${s.n}</span></p>`;
 el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{G.ans=b.dataset.g==='1';const s2=ls.get('ek_guess',{h:0,n:0});s2.n++;if(G.ans===up)s2.h++;ls.set('ek_guess',s2);drawGuess()});
 const nx=$('#gNext');if(nx)nx.onclick=newGuess}

/* ---------- Time machine ---------- */
const TM_COINS=['BTC','ETH','BNB','SOL','XRP','DOGE','ADA','TRX','LINK','AVAX','TON','DOT','LTC','BCH','NEAR','SUI'];
async function timeMachine(){const c=$('#tmCoin').value,a=Date.parse($('#tmA').value),b=Date.parse($('#tmB').value),amt=+$('#tmAmt').value||1000,sl=Math.abs(+$('#tmStop').value)||0,o=$('#tmOut');
 if(!(a<b)){o.innerHTML='<p class="neg">⚠ date</p>';return}o.innerHTML='…';
 let k=[],s=a;while(s<b){const part=await kl(c+'USDT',s,b);if(!part.length)break;k=k.concat(part);s=part[part.length-1].t+864e5;if(part.length<1000)break}
 if(k.length<2){o.innerHTML=`<p class="disc">${T('noData')}</p>`;return}
 const e=k[0].o,x=k[k.length-1].c;let peak=e,mdd=0,stop=null;for(const d of k){if(sl&&!stop&&d.l<=e*(1-sl/100))stop=d;peak=Math.max(peak,d.h);mdd=Math.min(mdd,(d.l/peak-1)*100)}
 const r=(x/e-1)*100,rs=stop?-sl:r;
 o.innerHTML=`<div class="row" style="gap:28px"><div><small class="disc">${T('hold')}</small><div class="big ${r>=0?'pos':'neg'}">$${fm(amt*(1+r/100),2)}</div>${sg(+r.toFixed(2))}</div>${sl?`<div><small class="disc">SL ${sl}%</small><div class="big ${rs>=0?'pos':'neg'}">$${fm(amt*(1+rs/100),2)}</div>${stop?`${T('stopHit')} <span class="num">${new Date(stop.t).toISOString().slice(0,10)}</span>`:'—'}</div>`:''}<div><small class="disc">${T('maxdd')}</small><div class="big neg">${fm(mdd,1)}%</div></div></div>
 <p class="disc"><span class="num">${c}: $${fm(e,6)} → $${fm(x,6)} · ${k.length}d</span></p>${(()=>{const kk=k.length>400?k.filter((_,i)=>i%Math.ceil(k.length/400)===0):k;return spark(kk,kk.length,900,180,true)})()}
 <p style="margin-top:8px"><button class="btn" id="tmShare">📤 ${T('share')}</button></p>`;
 $('#tmShare').onclick=()=>share(`Entekhab Time Machine: $${amt} ${c} ${$('#tmA').value} → ${$('#tmB').value} = $${fm(amt*(1+r/100),0)} (${r>=0?'+':''}${fm(r,1)}%)`,'https://entekhab.net/lab/#tmS')}

/* ---------- Trader DNA ---------- */
function renderDNA(){const qs=T('dnaQs');$('#dnaQ').innerHTML=qs.map((q,i)=>`<div class="q"><p>${i+1}. ${q[0]}</p>${q[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}">${o}</label>`).join('')}</div>`).join('')+`<button class="btn p" id="dnaGo">${T('dnaMake')}</button>`;$('#dnaGo').onclick=makeDNA;
 const prev=ls.get('ek_dna',null);if(prev)drawDNA(prev)}
function makeDNA(){const a=[...Array(6)].map((_,i)=>+(document.querySelector(`input[name=q${i}]:checked`)?.value??-1));if(a.includes(-1)){alert('?');return}
 const sc={sniper:0,surfer:0,hunter:0,oak:0,gambler:0,analyst:0};
 [['hunter','analyst','gambler','analyst'],['hunter','sniper','surfer','oak'],['sniper','surfer','gambler','gambler'],['sniper','analyst','oak','hunter'],['sniper','surfer','hunter','gambler'],['sniper','surfer','gambler','oak']].forEach((m,i)=>sc[m[a[i]]]+=2);
 if(a[0]===0)sc.oak++;if(a[3]===0)sc.sniper++;
 const type=Object.entries(sc).sort((x,y)=>y[1]-x[1])[0][0],risk=[10,35,70,95][a[4]],disc=[95,65,40,15][a[2]],pat=[30,55,75,95][a[1]],data=[80,85,70,25][a[3]];
 const r={type,risk,disc,pat,data};ls.set('ek_dna',r);drawDNA(r)}
function drawDNA(r){const [name,desc]=T('dnaTypes')[r.type],cv=document.createElement('canvas');cv.width=1080;cv.height=1350;cv.className='card-out';const x=cv.getContext('2d'),rtl=lang!=='en';
 const g=x.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#1a1006');g.addColorStop(.5,'#0b0c0f');g.addColorStop(1,'#071018');x.fillStyle=g;x.fillRect(0,0,1080,1350);
 x.strokeStyle='rgba(255,255,255,.05)';for(let i=0;i<1080;i+=54){x.beginPath();x.moveTo(i,0);x.lineTo(i,1350);x.stroke()}for(let i=0;i<1350;i+=54){x.beginPath();x.moveTo(0,i);x.lineTo(1080,i);x.stroke()}
 x.fillStyle='#f7931a';x.beginPath();x.arc(540,330,150,0,7);x.fill();x.fillStyle='#000';x.font='900 190px Arial';x.textAlign='center';x.fillText('₿',540,398);
 x.fillStyle='#f7931a';x.font='700 38px "Space Grotesk",sans-serif';x.fillText('TRADER DNA',540,90);
 x.fillStyle='#fff';x.font='900 92px Vazirmatn,sans-serif';x.direction=rtl?'rtl':'ltr';x.fillText(name,540,620);
 x.fillStyle='#bbb';x.font='400 38px Vazirmatn,sans-serif';wrap(x,desc,540,690,880,54);
 const bars=[[T('dnaQs')[4][0].replace('؟','').replace('?',''),r.risk],['Discipline / '+(lang==='en'?'stop-loss':'انضباط'),r.disc],['Patience',r.pat],['Data-driven',r.data]];
 bars.forEach(([l,v],i)=>{const y=880+i*95;x.textAlign=rtl?'right':'left';x.fillStyle='#ddd';x.font='600 32px Vazirmatn,sans-serif';x.fillText(l,rtl?960:120,y);x.fillStyle='rgba(255,255,255,.1)';x.fillRect(120,y+18,840,18);x.fillStyle='#f7931a';rtl?x.fillRect(960-840*v/100,y+18,840*v/100,18):x.fillRect(120,y+18,840*v/100,18)});
 x.textAlign='center';x.direction='ltr';x.fillStyle='#f7931a';x.font='700 44px "Space Grotesk",sans-serif';x.fillText('entekhab.net/lab',540,1290);
 const url=cv.toDataURL('image/png');$('#dnaOut').innerHTML='';$('#dnaOut').append(cv);
 const row=document.createElement('div');row.className='row';row.style.marginTop='10px';row.innerHTML=`<a class="btn p" download="entekhab-trader-dna.png" href="${url}">⬇ ${T('dl')}</a><button class="btn" id="dnaSh">📤 ${T('share')}</button>`;$('#dnaOut').append(row);
 $('#dnaSh').onclick=async()=>{try{const b=await (await fetch(url)).blob(),f=new File([b],'entekhab-dna.png',{type:'image/png'});if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f],text:`${name} — entekhab.net/lab`});return}}catch(e){}share(`My Trader DNA: ${name}`,'https://entekhab.net/lab/#dnaS')}}
function wrap(x,t,cx,y,w,lh){const ws=t.split(' ');let line='';for(const wd of ws){const tt=line?line+' '+wd:wd;if(x.measureText(tt).width>w){x.fillText(line,cx,y);y+=lh;line=wd}else line=tt}x.fillText(line,cx,y)}
function share(text,url){const tg=`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;if(navigator.share){navigator.share({text,url}).catch(()=>window.open(tg,'_blank'))}else window.open(tg,'_blank')}

 const m=L.memory;$('#mem').innerHTML=`<h3>${T('analogs')} · BTC</h3>`+(m?`<p class="disc" style="margin:-4px 0 8px"><span class="num">${m.since} → ${m.today.date} · ${m.history_days}d</span> — ${T('today')}: 7d ${sg(m.today.ret7)} · 30d ${sg(m.today.ret30)} · RSI <span class="num">${m.today.rsi}</span> · MA200 ${sg(m.today.vs_ma200)}</p>
 <div class="row" style="gap:22px"><div><small class="disc">${T('after30')} ${T('upOf')}</small><div class="big">${m.stats.up30}/${m.stats.n}</div></div><div><small class="disc">${T('avg')} 30d</small><div class="big">${sg(m.stats.avg30)}</div></div><div><small class="disc">${T('avg')} 7d</small><div class="big">${sg(m.stats.avg7)}</div></div></div>
 ${analogChart(m.analogs)}<table><tr><th></th><th>${T('price')}</th><th>${T('after7')}</th><th>${T('after30')}</th><th>${T('dd30')}</th></tr>${m.analogs.map(a=>`<tr><td class="num">${a.date}</td><td class="num">$${fm(a.price,0)}</td><td>${sg(a.f7)}</td><td>${sg(a.f30)}</td><td>${sg(a.dd30)}</td></tr>`).join('')}</table>`:nd);
 const f=L.futures;$('#mc').innerHTML=`<h3>${T('cone')}</h3>`+(f?coneChart(f)+`<table><tr><td>${T('pUp')}</td><td class="num">${f.p_up}%</td></tr><tr><td>${T('p10')}</td><td class="num pos">${f.p_up10}%</td></tr><tr><td>${T('m10')}</td><td class="num neg">${f.p_dn10}%</td></tr><tr><td>P5 / P50 / P95</td><td class="num">$${fm(f.cone['5'].at(-1),0)} / $${fm(f.cone['50'].at(-1),0)} / $${fm(f.cone['95'].at(-1),0)}</td></tr></table><p class="disc">${f.paths} paths · block bootstrap · ${f.sample_days}d · σ ${f.sim_vol_annual}%/y</p>`:nd);
 const v=L.vol;$('#vol').innerHTML=`<h3>${T('volT')}</h3>`+(v?`<table><tr><th></th><th>BB rank</th><th>ATR14/100</th><th>RV7 / RV90</th><th></th></tr>${Object.entries(v).sort((a,b)=>a[1].bw_rank-b[1].bw_rank).map(([c,x])=>`<tr><td><b>${c}</b></td><td><div class="bar" style="width:70px;display:inline-block"><i style="width:${x.bw_rank}%;background:${x.bw_rank<=10?'#38bdf8':x.bw_rank>=85?'#ef4444':'#f7931a'}"></i></div> <span class="num">${x.bw_rank}</span></td><td class="num">${x.atr_ratio}</td><td class="num">${x.rv7}% / ${x.rv90}%</td><td>${T('state')[x.state]}${x.shift?` <b style="color:#f59e0b">${T('shift')[x.shift]}</b>`:''}</td></tr>`).join('')}</table><p class="disc">BB rank = percentile of Bollinger bandwidth in 1y (≤10 = squeeze)</p>`:nd);
 const o=L.options;$('#opt').innerHTML=`<h3>${T('optT')}</h3>`+(o&&Object.keys(o).length?`<table><tr><th></th>${Object.keys(o).map(k=>`<th>${k}</th>`).join('')}</tr>${[[T('pc'),k=>o[k].pc_oi],['Put/Call (vol)',k=>o[k].pc_vol],[T('iv'),k=>o[k].iv_oi_weighted!=null?o[k].iv_oi_weighted+'%':'—'],['DVOL',k=>o[k].dvol?`${o[k].dvol.now} <span class="disc">(7d: ${o[k].dvol.d7_ago})</span>`:'—'],[T('mp'),k=>o[k].max_pain?`$${fm(o[k].max_pain.max_pain,0)} ${sg(o[k].max_pain.vs_spot_pct)}`:'—'],[T('exp'),k=>o[k].max_pain?.expiry||'—']].map(([l,f])=>`<tr><td>${l}</td>${Object.keys(o).map(k=>`<td class="num">${f(k)??'—'}</td>`).join('')}</tr>`).join('')}</table>`:nd);
 const xe=L.xex;$('#xex').innerHTML=`<h3>${T('xexT')}</h3>`+(xe?.length?`<table><tr><th></th><th>Binance</th><th>Coinbase</th><th>Kraken</th><th>OKX</th><th>${T('spread')}</th></tr>${xe.map(r=>`<tr><td><b>${r.coin}</b></td>${['Binance','Coinbase','Kraken','OKX'].map(e=>`<td class="num">${r.prices[e]!=null?fm(r.prices[e],r.prices[e]<5?5:2):'—'}</td>`).join('')}<td class="num" style="color:${r.spread_pct>0.3?'#f59e0b':'inherit'}">${r.spread_pct}%</td></tr>`).join('')}</table><p class="disc">USD vs USDT pairs — part of the gap is the USDT premium.</p>`:nd);
 const mc=L.macro;$('#macro').innerHTML=`<h3>${T('macroT')}</h3>`+(mc&&(mc.gold||mc.eurusd)?`<table><tr><th></th><th>${T('price')}</th><th>30d</th><th>${T('c30')}</th><th>${T('c90')}</th></tr>${[['BTC',{chg30:mc.btc_chg30}],[T('gold'),mc.gold],[T('eur'),mc.eurusd]].filter(r=>r[1]).map(([n,x])=>`<tr><td>${n}</td><td class="num">${x.price?fm(x.price,4):''}</td><td>${sg(x.chg30)}</td><td class="num">${x.corr30??''}</td><td class="num">${x.corr90??''}</td></tr>`).join('')}</table><p class="disc">Pearson correlation of daily returns · −1 … +1</p>`:nd);
 const dv=L.dev;$('#dev').innerHTML=dv?.length?`<table><tr><th></th><th>repo</th><th>7d</th><th>30d</th><th>×</th><th>${T('rel')}</th></tr>${dv.map(r=>`<tr><td><b>${r.coin}</b></td><td><a href="https://github.com/${r.repo}" target="_blank" rel="noopener" class="num" style="color:var(--mute)">${r.repo}</a></td><td class="num">${r.c7}</td><td><div class="bar" style="width:90px;display:inline-block"><i style="width:${Math.min(100,r.c30/Math.max(...dv.map(x=>x.c30))*100)}%"></i></div> <span class="num">${r.c30}${r.c30>=500?'+':''}</span></td><td class="num ${r.trend>1.15?'pos':r.trend<.85?'neg':''}">${r.trend??'—'}</td><td class="num">${esc(r.release||'—')} <span class="disc">${r.release_at?r.release_at.slice(0,10):''}</span></td></tr>`).join('')}</table><p class="disc">× = 7d pace vs 30d average · GitHub API</p>`:nd}
function analogChart(a){const W=520,H=160,all=a.flatMap(x=>x.path),lo=Math.min(...all),hi=Math.max(...all),Y=v=>H-4-(v-lo)/(hi-lo||1)*(H-8),X=i=>i*W/30;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin:8px 0"><line x1="0" x2="${W}" y1="${Y(100)}" y2="${Y(100)}" stroke="#444" stroke-dasharray="3 3"/>${a.map(x=>`<polyline points="${x.path.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}" fill="none" stroke="${x.f30>=0?'rgba(34,197,94,.55)':'rgba(239,68,68,.55)'}" stroke-width="1.5"/>`).join('')}<text x="4" y="12" fill="#888" font-size="10">+${fm(hi-100,0)}%</text><text x="4" y="${H-6}" fill="#888" font-size="10">${fm(lo-100,0)}%</text></svg>`}
function coneChart(f){const W=520,H=200,c=f.cone,lo=Math.min(...c['5'],f.price),hi=Math.max(...c['95']),n=c['50'].length,X=i=>(i+1)*W/n,Y=v=>H-4-(v-lo)/(hi-lo)*(H-8);
 const band=(a,b,op)=>`<polygon points="${[`0,${Y(f.price)}`,...c[a].map((v,i)=>`${X(i)},${Y(v)}`),...c[b].map((v,i)=>`${X(i)},${Y(v)}`).reverse()].join(' ')}" fill="rgba(247,147,26,${op})"/>`;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${band('5','95',.12)}${band('25','75',.25)}<polyline points="0,${Y(f.price)} ${c['50'].map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}" fill="none" stroke="#f7931a" stroke-width="2"/><line x1="0" x2="${W}" y1="${Y(f.price)}" y2="${Y(f.price)}" stroke="#555" stroke-dasharray="3 3"/><text x="${W-4}" y="14" fill="#aaa" text-anchor="end" font-size="11">P95 $${fm(c['95'].at(-1),0)}</text><text x="${W-4}" y="${H-8}" fill="#aaa" text-anchor="end" font-size="11">P5 $${fm(c['5'].at(-1),0)}</text></svg>`}

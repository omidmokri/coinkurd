let lang=(()=>{try{return localStorage.getItem('ck_lang')}catch(e){return null}})()||'fa';

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=(n,d=2)=>n==null?'—':Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const sg=n=>n==null?'—':`<span class="num ${n>=0?'pos':'neg'}">${n>=0?'+':''}${fm(n)}%</span>`;
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const BN='https://data-api.binance.vision/api/v3';
const D={};
async function j(u){try{const r=await fetch(u);return r.ok?r.json():null}catch(e){return null}}
async function kl(sym,start,end,limit=1000){let u=`${BN}/klines?symbol=${sym}&interval=1d&limit=${limit}`;if(start)u+=`&startTime=${start}`;if(end)u+=`&endTime=${end}`;const k=await j(u);return (k||[]).map(x=>({t:x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4]}))}
async function px(sym='BTCUSDT'){const r=await j(`${BN}/ticker/price?symbol=${sym}`);return r?+r.price:null}

function applyLang(){const rtl=lang!=='en';document.documentElement.lang=lang;document.documentElement.dir=rtl?'rtl':'ltr';
 $('#hT').innerHTML=T('hT');$('#hL').textContent=T('hL');$('#honest').innerHTML=T('honest');
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T(e.dataset.t));
 const ids=['flowS','arenaS','tmS','dnaS','memS','derS','devS'];$('#tabs').innerHTML=[['discS',T('dT')],['watchS',T('wT')],['radarS',T('rT')],['galS',T('galT')],['wrapS',T('wrT')]].map(([a,t])=>`<a href="#${a}">${t}</a>`).join('')+T('tabs').map((t,i)=>`<a href="${i<7?'#'+ids[i]:'/'}">${t}</a>`).join('');
 document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));renderAll()}
$('#langs').onclick=e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{localStorage.setItem('ck_lang',lang)}catch(_){}applyLang()};

/* ---------- 60s pulse ---------- */
function renderPulse(){const m=D.market,b=D.brain,v=(D.lab||{}).vol||{};if(!m){$('#pulse').innerHTML='';return}
 const btc=(m.coins||[]).find(c=>c.coin==='BTC')||{},r=(b||{}).regime||{},br=r.breadth||{},g=(b?.gainers||[])[0],P=T('pulse');
 const sq=Object.entries(v).filter(([,x])=>x.state==='squeeze'||x.shift).map(([k])=>k);
 $('#pulse').innerHTML=[[P[0],`$${fm(btc.price,0)}`,sg(btc.chg24)],[P[1],(T('reg')[r.regime]||'—'),''],[P[2],m.fng?.value??'—',esc(m.fng?.class||'')],[P[3],br.up_pct!=null?`${br.up_pct}% ⬆`:'—',br.down_pct!=null?`${br.down_pct}% ⬇`:''],[P[4],g?g.coin:'—',g?sg(g.chg24):''],[P[5],sq.length?sq.slice(0,4).join(' '):'—','']].map(([a,b,c])=>`<div><small>${a}</small><b>${b}</b> <span style="font-size:.8rem">${c}</span></div>`).join('');
 const rep=b?.report?.[lang]||b?.report?.en;$('#pulseNote').innerHTML=rep?`<b>${esc(rep.headline)}</b>`:''}

/* ---------- Money flow ---------- */
function renderFlow(){const s=$('#flow'),nr=D.narr;if(!nr?.narratives?.length){s.innerHTML=`<text x="500" y="220" fill="#888" text-anchor="middle">${T('noData')}</text>`;return}
 const ns=nr.narratives.slice(0,12),mx=Math.max(1,...ns.map(n=>n.mentions_24h)),W=1000,H=440;
 const nodes=ns.map((n,i)=>({n,r:28+Math.sqrt(n.mentions_24h/mx)*70,x:W/2+Math.cos(i*2.4)*260*(i%3+1)/3,y:H/2+Math.sin(i*2.4)*150*(i%3+1)/3}));
 for(let it=0;it<300;it++){for(const a of nodes){a.x+=(W/2-a.x)*.01;a.y+=(H/2-a.y)*.012;for(const b of nodes){if(a===b)continue;const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1,m=a.r+b.r+6;if(d<m){const k=(m-d)/d*.5;a.x+=dx*k;a.y+=dy*k}}a.x=Math.max(a.r,Math.min(W-a.r,a.x));a.y=Math.max(a.r,Math.min(H-a.r,a.y))}}
 const col=p=>p==null?'#3a3d42':p>=0?`rgba(34,197,94,${.25+Math.min(.65,p/8)})`:`rgba(239,68,68,${.25+Math.min(.65,-p/8)})`;
 s.innerHTML=`<defs><filter id="gl"><feGaussianBlur stdDeviation="6"/></filter></defs>`+nodes.map((o,i)=>`<g data-i="${i}" style="cursor:pointer"><circle cx="${o.x}" cy="${o.y}" r="${o.r}" fill="${col(o.n.perf_24h)}" stroke="${o.n.momentum>1.3?'#f7931a':'rgba(255,255,255,.2)'}" stroke-width="${o.n.momentum>1.3?3:1}"><animate attributeName="r" values="${o.r};${o.r*1.04};${o.r}" dur="${3+i%4}s" repeatCount="indefinite"/></circle><text x="${o.x}" y="${o.y-4}" fill="#fff" text-anchor="middle" font-size="${Math.max(11,o.r/4)}" font-family="Vazirmatn">${esc(o.n.name[lang]||o.n.name.en)}</text><text x="${o.x}" y="${o.y+16}" fill="#ddd" text-anchor="middle" font-size="12">${o.n.perf_24h==null?'':(o.n.perf_24h>=0?'+':'')+o.n.perf_24h+'%'} · ${o.n.mentions_24h}</text></g>`).join('');
 s.onclick=e=>{const g=e.target.closest('g[data-i]');if(!g)return;const n=nodes[+g.dataset.i].n;$('#flowInfo').innerHTML=`<b style="color:#fff">${esc(n.name[lang]||n.name.en)}</b> — ×${n.momentum} · ${n.members.map(m=>`<span class="chip">${m.coin} ${m.chg24!=null?sg(m.chg24):''}</span>`).join('')}<br>${(n.headlines||[]).slice(0,3).map(h=>`<a href="${esc(h.url)}" target="_blank" rel="noopener nofollow" dir="ltr">• ${esc(h.title)}</a>`).join('<br>')}`}}

/* ---------- Prediction arena ---------- */
async function renderArena(){const el=$('#arena');let st=ls.get('ek_arena',{calls:[]});const now=Date.now(),p=await px();
 let changed=false;
 for(const c of st.calls){if(c.res==null&&now>=c.at+864e5){const k=await kl('BTCUSDT',c.at+864e5-6e4,c.at+864e5+36e5,1);const end=k[0]?.o||(now-c.at<9e7?p:null);if(end){c.end=end;c.res=(c.dir==='up')===(end>c.p)?1:0;changed=true}}}
 if(changed)ls.set('ek_arena',st);
 const done=st.calls.filter(c=>c.res!=null),hits=done.filter(c=>c.res).length;let streak=0;for(const c of [...done].reverse()){if(c.res)streak++;else break}
 const today=st.calls.find(c=>now-c.at<864e5);
 el.innerHTML=`<h3>${T('arenaT')} · BTC</h3><div class="big">$${fm(p,0)}</div>`+(today?`<p>${T('yourCall')}: <b>${today.dir==='up'?T('up'):T('dn')}</b> — ${T('locked')} <span class="num">$${fm(today.p,0)}</span> · ${T('resolveAt')}: <span class="num">${new Date(today.at+864e5).toLocaleString(lang==='en'?'en-GB':'fa-IR',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})}</span></p>`
 :`<div class="row" style="margin:12px 0"><button class="btn g" data-d="up">${T('up')}</button><button class="btn r" data-d="dn">${T('dn')}</button></div>`)
 +`<div class="row" style="gap:18px;margin-top:10px"><div><small class="disc">${T('hits')}</small><div class="big">${hits}/${done.length}</div></div><div><small class="disc">${T('streak')}</small><div class="big">🔥${streak}</div></div><div><small class="disc">%</small><div class="big">${done.length?Math.round(hits*100/done.length):0}</div></div></div>`
 +(done.length?`<table style="margin-top:10px"><tr><th>${T('history')}</th><th></th><th>${T('price')}</th><th></th></tr>${done.slice(-6).reverse().map(c=>`<tr><td class="num">${new Date(c.at).toISOString().slice(0,10)}</td><td>${c.dir==='up'?'⬆':'⬇'}</td><td class="num">${fm(c.p,0)} → ${fm(c.end,0)}</td><td>${c.res?'✅':'❌'}</td></tr>`).join('')}</table>`:'')
 +`<p style="margin-top:12px"><button class="btn" id="arShare">📤 ${T('share')}</button></p>`;
 el.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const pp=await px();if(!pp)return;st.calls.push({at:Date.now(),dir:b.dataset.d,p:pp});st.calls=st.calls.slice(-200);ls.set('ek_arena',st);renderArena()});
 $('#arShare').onclick=()=>share(`Entekhab Prediction Arena — ${hits}/${done.length} ✅ 🔥${streak}`,'https://entekhab.net/lab/#arenaS')}

   x.textAlign='right';x.font='800 46px "Space Grotesk"';x.fillStyle=k.chg24>=0?'#22c55e':'#ef4444';x.fillText((k.chg24>=0?'+':'')+k.chg24+'%',990,y);x.font='500 26px "Space Grotesk"';x.fillStyle='#999';x.fillText(`${sig.length} signals · ${news.length} news`,990,y+40)});

function bgPaint(x,W,H){const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#1a1006');g.addColorStop(.5,'#0b0c0f');g.addColorStop(1,'#071018');x.fillStyle=g;x.fillRect(0,0,W,H);x.strokeStyle='rgba(255,255,255,.05)';for(let i=0;i<W;i+=54){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=54){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}}

 s.innerHTML=`<defs><linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(247,147,26,0)"/><stop offset="1" stop-color="rgba(247,147,26,.35)"/></linearGradient></defs>${[50,100,150,200].map(r=>`<circle r="${r}" fill="none" stroke="rgba(255,255,255,.08)"/>`).join('')}<line x1="-200" x2="200" stroke="rgba(255,255,255,.06)"/><line y1="-200" y2="200" stroke="rgba(255,255,255,.06)"/>
 <g><path d="M0,0 L200,0 A200,200 0 0,0 141,-141 Z" fill="url(#sw)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/></g>
 ${pts.map((p,i)=>`<g data-i="${i}" style="cursor:pointer"><circle cx="${p.x}" cy="${p.y}" r="${p.o.confidence==='high'?6:4}" fill="${p.c}"><animate attributeName="opacity" values="1;.35;1" dur="${2+i%3}s" repeatCount="indefinite"/></circle>${p.o.confidence==='high'?`<text x="${p.x+8}" y="${p.y+4}" fill="#ddd" font-size="10">${p.o.coin}</text>`:''}</g>`).join('')}<circle r="4" fill="#f7931a"/>`;
 const legend=`<div style="margin-bottom:10px">${types.map((t,i)=>`<span class="chip"><span style="color:${pal[i%pal.length]}">●</span> ${tName(t)} <span class="num">${op.filter(o=>o.type===t).length}</span></span>`).join('')}</div>`;
 const top=op.filter(o=>o.confidence==='high').slice(0,8);
 $('#radarInfo').innerHTML=`<h3>${T('rT')}</h3>${legend}<table>${top.map(o=>`<tr><td><b>${o.coin}</b></td><td>${tName(o.type)}</td><td class="num">${o.tf}</td><td class="num">${o.strength??''}</td></tr>`).join('')}</table><p class="disc">${op.length} findings · ${(D.market.coins||[]).length} coins · Binance</p>`;
 s.onclick=e=>{const g=e.target.closest('g[data-i]');if(!g)return;const o=pts[+g.dataset.i].o,k=(D.market.coins||[]).find(c=>c.coin===o.coin)||{};
  $('#radarInfo').innerHTML=`<h3>${logoTag(o.coin,28)}${o.coin} · ${tName(o.type)}</h3><div class="big">$${fm(k.price,k.price<1?6:2)}</div>${sg(k.chg24)} · RSI <span class="num">${k.rsi??'—'}</span><p class="disc">tf ${o.tf} · strength ${o.strength??'—'} · ${o.confidence} · ${esc(JSON.stringify(o.detail||{}))}</p>${legend}`}}

 if(!nr.length&&!items.length){s.innerHTML=`<text x="500" y="280" fill="#888" text-anchor="middle">${T('noData')}</text>`;return}
 const N=[],E=[],idx={},add=(id,o)=>{if(idx[id]==null){idx[id]=N.length;N.push({id,...o,x:500+(Math.random()-.5)*600,y:280+(Math.random()-.5)*360})}return idx[id]};
 const mk=D.market?.coins||[];nr.filter(n=>n.mentions_24h>0).slice(0,6).forEach(n=>{const a=add('n:'+n.id,{t:'n',label:n.name[lang]||n.name.en,r:18,o:n});n.members.slice(0,4).forEach(m=>E.push([a,add('c:'+m.coin,{t:'c',label:m.coin,r:13})]))});
 items.forEach((it,i)=>{const a=add('h:'+i,{t:'h',label:'',r:5,o:it});it.coins.slice(0,3).forEach(c=>E.push([a,add('c:'+c,{t:'c',label:c,r:13})]))});
 N.forEach(n=>{if(n.t==='c'){const k=mk.find(x=>x.coin===n.label);n.chg=k?.chg24}});
 for(let it=0;it<400;it++){for(const a of N)for(const b of N){if(a===b)continue;const dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+1,f=900/d2;a.x+=dx*f*.05;a.y+=dy*f*.05}for(const [i,j] of E){const a=N[i],b=N[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-90)*.02;a.x+=dx/d*f;a.y+=dy/d*f;b.x-=dx/d*f;b.y-=dy/d*f}for(const a of N){a.x+=(500-a.x)*.004;a.y+=(280-a.y)*.004;a.x=Math.max(30,Math.min(970,a.x));a.y=Math.max(20,Math.min(540,a.y))}}
 const col=n=>n.t==='n'?'#f7931a':n.t==='h'?'#38bdf8':n.chg==null?'#666':n.chg>=0?'#22c55e':'#ef4444';
 s.innerHTML=E.map(([i,j])=>`<line x1="${N[i].x}" y1="${N[i].y}" x2="${N[j].x}" y2="${N[j].y}" stroke="rgba(255,255,255,.12)"/>`).join('')+`<defs>${N.map((n,i)=>n.t==='c'?`<clipPath id="cp${i}"><circle cx="${n.x}" cy="${n.y}" r="${n.r+2}"/></clipPath>`:'').join('')}</defs>`+N.map((n,i)=>`<g data-i="${i}" style="cursor:pointer">${n.t==='c'&&logoUrl(n.label)?`<circle cx="${n.x}" cy="${n.y}" r="${n.r+4}" fill="#fff" stroke="${col(n)}" stroke-width="3"/><image href="${logoUrl(n.label)}" x="${n.x-n.r-2}" y="${n.y-n.r-2}" width="${2*n.r+4}" height="${2*n.r+4}" clip-path="url(#cp${i})"/>`:`<circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${col(n)}" fill-opacity="${n.t==='n'?.85:.9}"/>`}${n.label?`<text x="${n.x}" y="${n.y-n.r-4}" fill="#ddd" text-anchor="middle" font-size="${n.t==='n'?13:11}" font-family="Vazirmatn">${esc(n.label)}</text>`:''}</g>`).join('');
 s.onclick=e=>{const g=e.target.closest('g[data-i]');if(!g)return;const n=N[+g.dataset.i];$('#graphInfo').innerHTML=n.t==='h'?`<a href="${esc(n.o.url)}" target="_blank" rel="noopener nofollow" dir="ltr" style="color:#fff">${esc(n.o.title)}</a> — ${esc(n.o.source)}`:n.t==='n'?`<b style="color:#fff">${esc(n.label)}</b> · ${n.o.mentions_24h} · ×${n.o.momentum} · ${sg(n.o.perf_24h)}`:`${logoTag(n.label,24)}<b style="color:#fff">${n.label}</b> ${sg(n.chg)}`}}

function galaxy(){const box=$('#galaxy'),m=D.market;if(!window.THREE||!m?.coins){box.innerHTML=`<p class="disc" style="padding:16px">${T('noData')}</p>`;return}
 const cs=m.coins.filter(c=>(c.spark||[]).length>=24).sort((a,b)=>(b.qvol||0)-(a.qvol||0)).slice(0,80);if(cs.length<5){box.innerHTML=`<p class="disc" style="padding:16px">${T('noData')}</p>`;return}
 const R=cs.map(c=>{const s=c.spark;return s.slice(1).map((v,i)=>v/s[i]-1)}),n=cs.length;
 const cor=(a,b)=>{const k=Math.min(a.length,b.length);a=a.slice(-k);b=b.slice(-k);const ma=a.reduce((x,y)=>x+y)/k,mb=b.reduce((x,y)=>x+y)/k;let c=0,da=0,db=0;for(let i=0;i<k;i++){c+=(a[i]-ma)*(b[i]-mb);da+=(a[i]-ma)**2;db+=(b[i]-mb)**2}return da&&db?c/Math.sqrt(da*db):0};
 const C=[...Array(n)].map((_,i)=>[...Array(n)].map((_,j)=>i===j?1:0));for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)C[i][j]=C[j][i]=cor(R[i],R[j]);
 const P=cs.map(()=>new THREE.Vector3((Math.random()-.5)*60,(Math.random()-.5)*60,(Math.random()-.5)*60));
 for(let it=0;it<260;it++){for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const d=P[i].clone().sub(P[j]),L=d.length()||.01,rest=7+(1-C[i][j])*36,f=(L-rest)*.02;d.multiplyScalar(f/L);P[i].sub(d);P[j].add(d)}}
 const ctr=P.reduce((a,b)=>a.add(b.clone()),new THREE.Vector3()).multiplyScalar(1/n);P.forEach(p=>p.sub(ctr));
 const W=box.clientWidth,H=box.clientHeight,sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,W/H,.1,1000);cam.position.set(0,0,58);
 const rd=new THREE.WebGLRenderer({antialias:true,alpha:true});rd.setPixelRatio(Math.min(2,devicePixelRatio));rd.setSize(W,H);box.innerHTML='';box.append(rd.domElement);
 const grp=new THREE.Group();sc.add(grp);const mx=Math.max(...cs.map(c=>c.qvol||1));

 const nr=(D.narr?.narratives||[]).slice().sort((a,b)=>b.mentions_24h-a.mentions_24h);if(nr.length>=4){const nm=n=>n.name[lang]||n.name.en;qs.push({id:'n',q:Q.narr,opt:pick(nr.slice(0,4).map(nm),4),ans:nm(nr[0])})}
 const liq=m.coins.filter(c=>(c.qvol||0)>=5e6&&c.chg24!=null).sort((a,b)=>b.chg24-a.chg24);if(liq.length>=4)qs.push({id:'g',q:Q.gain,opt:pick([liq[0].coin,...liq.slice(5,8).map(c=>c.coin)],4),ans:liq[0].coin});
 $('#missions').innerHTML=`<h3>🗺 ${T('msT')} <span class="chip num">${T('pts')} ${st.pts}</span></h3>`+qs.map(q=>{const k=day+q.id,d=st.done[k];return `<div class="q" data-k="${k}"><p>${esc(q.q)}</p><div class="row">${q.opt.map(o=>`<button class="btn" ${d?'disabled':''} data-a="${esc(o)}" style="${d&&o===q.ans?'background:var(--g);color:#000':''}">${LOGO.has(o)?logoTag(o,16):''}${esc(o)}</button>`).join('')}</div>${d?`<p class="disc">${d==='ok'?T('ok'):T('bad')+' '+esc(q.ans)}</p>`:''}</div>`}).join('');
 $('#missions').querySelectorAll('.q').forEach(el=>el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const q=qs.find(q=>day+q.id===el.dataset.k),s=ls.get('ek_miss',{pts:0,done:{}});if(s.done[el.dataset.k])return;const ok=b.dataset.a===q.ans;s.done[el.dataset.k]=ok?'ok':'no';if(ok)s.pts+=10;ls.set('ek_miss',s);missions()}))}

/* ---- coin battle ---- */
async function battle(){const m=D.market;if(!m?.coins)return;const cs=m.coins.slice().sort((a,b)=>(b.qvol||0)-(a.qvol||0)).map(c=>c.coin);
 if(!$('#bA')){$('#battle').innerHTML=`<h3>⚔️ ${T('baT')}</h3><div class="row"><select id="bA">${cs.map(c=>`<option ${c==='BTC'?'selected':''}>${c}</option>`).join('')}</select><b>VS</b><select id="bB">${cs.map(c=>`<option ${c==='ETH'?'selected':''}>${c}</option>`).join('')}</select><button class="btn p" id="bGo">${T('fight')}</button></div><div id="bOut" style="margin-top:12px"></div>`;$('#bGo').onclick=battle;return}
 const A=$('#bA').value,B=$('#bB').value;if(A===B)return;$('#bOut').innerHTML='…';
 const [ka,kb]=await Promise.all([kl(A+'USDT',null,null,31),kl(B+'USDT',null,null,31)]);
 const st=(k,c)=>{const cl=k.map(x=>x.c),r=cl.slice(1).map((v,i)=>v/cl[i]-1),sd=Math.sqrt(r.reduce((a,b)=>a+b*b,0)/(r.length||1))*Math.sqrt(365)*100;let pk=cl[0],dd=0;cl.forEach(v=>{pk=Math.max(pk,v);dd=Math.min(dd,(v/pk-1)*100)});const mc=m.coins.find(x=>x.coin===c)||{};
  return{chg24:mc.chg24,c7:cl.length>8?+((cl.at(-1)/cl.at(-8)-1)*100).toFixed(2):null,c30:cl.length>30?+((cl.at(-1)/cl[0]-1)*100).toFixed(2):null,vol:+sd.toFixed(1),rsi:mc.rsi,qvol:mc.qvol,score:D.score?.coins?.[c]?.score,dd:+dd.toFixed(1),r}};
 const a=st(ka,A),b=st(kb,B),cr=corr2(a.r,b.r),R=T('rows'),better={chg24:1,c7:1,c30:1,vol:-1,rsi:0,qvol:1,score:1,dd:1};let sa=0,sb=0;
 const rows=Object.keys(better).map(k=>{const va=a[k],vb=b[k];let w='';if(better[k]&&va!=null&&vb!=null&&va!==vb){w=(va>vb)===(better[k]>0)?'a':'b';w==='a'?sa++:sb++}const f=v=>v==null?'—':k==='qvol'?'$'+fm(v/1e6,1)+'M':['chg24','c7','c30','dd'].includes(k)?(v>0?'+':'')+v+'%':k==='vol'?v+'%':v;
  return`<tr><td style="${w==='a'?'color:var(--g);font-weight:800':''}" class="num">${f(va)}</td><td style="text-align:center">${R[k]}</td><td style="${w==='b'?'color:var(--g);font-weight:800':''}" class="num">${f(vb)}</td></tr>`}).join('');
 $('#bOut').innerHTML=`<div class="row" style="justify-content:space-around;font-size:1.3rem">${logoTag(A,40)}<b>${A}</b><span class="big">${sa} : ${sb}</span><b>${B}</b>${logoTag(B,40)}</div><table style="margin-top:8px">${rows}<tr><td></td><td style="text-align:center">${R.corr}: <span class="num">${cr??'—'}</span></td><td></td></tr></table><p style="margin-top:8px">🏆 ${T('win')}: <b>${sa===sb?'=':sa>sb?A:B}</b> · <button class="btn" id="bSh">📤 ${T('share')}</button></p><p class="disc">${T('nfa')} · Binance 30d</p>`;
 $('#bSh').onclick=()=>share(`Coin Battle: ${A} ${sa} : ${sb} ${B}`,'https://entekhab.net/lab/#discS')}
function corr2(a,b){const n=Math.min(a.length,b.length);if(n<5)return null;a=a.slice(-n);b=b.slice(-n);const ma=a.reduce((x,y)=>x+y)/n,mb=b.reduce((x,y)=>x+y)/n;let c=0,da=0,db=0;for(let i=0;i<n;i++){c+=(a[i]-ma)*(b[i]-mb);da+=(a[i]-ma)**2;db+=(b[i]-mb)**2}return da&&db?+(c/Math.sqrt(da*db)).toFixed(2):null}

/* ---- daily poster ---- */
function poster(){const m=D.market,b=D.brain;if(!m?.coins){$('#poster').innerHTML='';return}const btc=m.coins.find(c=>c.coin==='BTC')||{},eth=m.coins.find(c=>c.coin==='ETH')||{};
 const cv=document.createElement('canvas');cv.width=1080;cv.height=1920;const x=cv.getContext('2d');bgPaint(x,1080,1920);x.textAlign='center';
 x.fillStyle='#f7931a';x.font='700 44px "Space Grotesk"';x.fillText('ENTEKHAB · DAILY MARKET',540,120);x.fillStyle='#999';x.font='500 34px "Space Grotesk"';x.fillText(new Date().toUTCString().slice(0,16),540,175);
 x.fillStyle='#fff';x.font='800 70px "Space Grotesk"';x.fillText('BTC',540,330);x.font='800 130px "Space Grotesk"';x.fillText('$'+fm(btc.price,0),540,470);x.fillStyle=btc.chg24>=0?'#22c55e':'#ef4444';x.font='800 64px "Space Grotesk"';x.fillText((btc.chg24>=0?'+':'')+btc.chg24+'%  (24h)',540,560);
 const tiles=[['ETH','$'+fm(eth.price,0),(eth.chg24>=0?'+':'')+eth.chg24+'%'],['FEAR & GREED',String(m.fng?.value??'—'),m.fng?.class||''],['REGIME',(b?.regime?.regime||'—').replace('_',' ').toUpperCase(),''],['BREADTH',(b?.regime?.breadth?.up_pct??'—')+'% UP','']];
 tiles.forEach((t,i)=>{const cx=i%2?810:270,y=700+Math.floor(i/2)*230;x.fillStyle='rgba(255,255,255,.05)';x.fillRect(cx-240,y-80,480,200);x.fillStyle='#f7931a';x.font='700 30px "Space Grotesk"';x.fillText(t[0],cx,y-25);x.fillStyle='#fff';x.font='800 56px "Space Grotesk"';x.fillText(t[1],cx,y+45);x.fillStyle='#aaa';x.font='500 30px "Space Grotesk"';x.fillText(t[2],cx,y+95)});
 const g=(b?.gainers||[]).slice(0,4),l=(b?.losers||[]).slice(0,4);x.fillStyle='#f7931a';x.font='700 36px "Space Grotesk"';x.fillText('TOP GAINERS',270,1240);x.fillText('TOP LOSERS',810,1240);
 g.forEach((r,i)=>{x.fillStyle='#fff';x.font='700 40px "Space Grotesk"';x.textAlign='left';x.fillText(r.coin,80,1310+i*70);x.textAlign='right';x.fillStyle='#22c55e';x.fillText('+'+r.chg24+'%',470,1310+i*70)});
 l.forEach((r,i)=>{x.fillStyle='#fff';x.font='700 40px "Space Grotesk"';x.textAlign='left';x.fillText(r.coin,620,1310+i*70);x.textAlign='right';x.fillStyle='#ef4444';x.fillText(r.chg24+'%',1010,1310+i*70)});
 x.textAlign='center';const h=(b?.report?.en?.headline||'').slice(0,90);if(h){x.fillStyle='#ddd';x.font='500 34px "Space Grotesk"';wrap(x,h,540,1660,940,46)}
 x.fillStyle='#f7931a';x.font='700 50px "Space Grotesk"';x.fillText('entekhab.net',540,1850);
 const u=cv.toDataURL('image/png');cv.className='card-out';cv.style.maxWidth='320px';$('#poster').innerHTML=`<h3>🖼 ${T('poT')}</h3>`;$('#poster').append(cv);const r=document.createElement('div');r.className='row';r.style.marginTop='8px';r.innerHTML=`<a class="btn p" download="entekhab-daily-${new Date().toISOString().slice(0,10)}.png" href="${u}">⬇ ${T('dl')}</a><span class="disc">1080×1920 · story</span>`;$('#poster').append(r)}

function renderDisc(){heartbeat();unusual();weather();missions();if(!$('#bA'))battle();poster()}

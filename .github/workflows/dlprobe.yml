name: Downloader probe

# Self-test for the bot's downloader. It runs scripts/bot_dl.py against real links twice —
# once with no ffmpeg on the machine and once with it — because the bot's own runner installs
# ffmpeg in the background and the first minutes of every run have none.
# Nothing is posted to Telegram.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "لینک دلخواه برای تست (خالی = تست‌های پیش‌فرض)"
        type: string
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: pip install -q -U yt-dlp && yt-dlp --version

      - name: Write the test
        run: |
          cat > /tmp/selftest.py <<'EOF'
          import logging, os, shutil, sys, time
          logging.basicConfig(level=logging.INFO, format="%(name)s %(levelname)s %(message)s")
          sys.path.insert(0, "scripts")
          import bot_dl as DL

          CASES = [("X video",    "https://x.com/SpaceX/status/1732824684683784516", False),
                   ("TikTok",     "https://www.tiktok.com/@tiktok/video/7106594312292453675", False),
                   ("SoundCloud", "https://soundcloud.com/forss/flickermood", True),
                   ("Direct mp4", "https://download.samplelib.com/mp4/sample-5s.mp4", False)]
          one = (os.environ.get("ONE") or "").strip()
          if one:
              CASES = [("custom", one, DL.wants_audio(one))]

          print("ffmpeg present: %s" % DL.has_ffmpeg())
          bad = 0
          for name, url, audio in CASES:
              t0 = time.time()
              res = DL.fetch(url, audio)
              dt = time.time() - t0
              if not res.get("ok"):
                  print("%-11s FAIL  err=%-10s %5.1fs" % (name, res["err"], dt))
                  bad += 1
                  continue
              assert res["size"] <= DL.CAP, "over the upload cap"
              assert os.path.getsize(res["path"]) == res["size"]
              print("%-11s OK    %-5s %-9s %5.1fs  %s" % (name, res["kind"], DL.human(res["size"]), dt, res["title"][:38]))
              print("            " + DL.caption(res, "fa", DL.site_of(url)).replace("\n", " / ")[:150])
              DL.cleanup(res)
              assert not os.path.exists(res["dir"]), "temp dir left behind"
          print("failures: %d" % bad)
          sys.exit(1 if bad else 0)
          EOF

      - name: Without ffmpeg (the bot's first minutes)
        env:
          ONE: ${{ inputs.url }}
        run: python /tmp/selftest.py

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1

      - name: With ffmpeg
        env:
          ONE: ${{ inputs.url }}
        run: python /tmp/selftest.py

name: Site pages (light rebuild)

# بازسازی سریع صفحات سایت از داده‌های فعلی data/ — بدون واکشی یا هوش مصنوعی.
# ربات بعد از ذخیرهٔ خوراک آنچین/اخبار این را اجرا می‌کند تا /onchain/ و /crypto-news/ زود به‌روز شوند.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-light
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Build static pages
        run: python scripts/build_pages.py
      - name: Build reality-check pages
        continue-on-error: true
        run: python scripts/build_reality.py
      - name: Build the Roundtable and the opportunity calculator
        continue-on-error: true
        run: |
          python scripts/build_roundtable.py
          python scripts/build_opportunity.py
          python scripts/build_trackrecord.py
          python scripts/build_today.py
          python scripts/build_class.py
          python scripts/build_autopilot.py
          python scripts/build_map.py
          python scripts/build_kids.py
          python scripts/build_quant.py
      - name: Cache the read-aloud voices
        id: ttscache
        uses: actions/cache@v4
        with:
          path: ~/.cache/entekhab-tts
          key: tts-${{ hashFiles('scripts/fetch_tts.py') }}
      - name: Install the int8 quantiser (only when the voice cache is cold)
        if: steps.ttscache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: pip install onnxruntime==1.31.1 onnx==1.23.2
      - name: Fetch the read-aloud voices (Persian, Sorani) into tts/
        continue-on-error: true
        run: python scripts/fetch_tts.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

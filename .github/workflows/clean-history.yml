name: Clean Co-Authored-By from history
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install git-filter-repo
        run: pip install git-filter-repo --break-system-packages

      - name: Remove Co-Authored-By Claude lines
        run: |
          git filter-repo --force --message-callback '
            import re
            msg = message.decode("utf-8")
            msg = re.sub(r"\nCo-[Aa]uthored-[Bb]y: Claude[^\n]*", "", msg)
            msg = re.sub(r"\nClaude-Session:[^\n]*", "", msg)
            msg = re.sub(r"\n🤖 Generated with \[Claude[^\n]*", "", msg)
            return msg.encode("utf-8")
          '

      - name: Force push cleaned history
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/omidmokri/coinkurd.git
          git push origin main --force

# The site's languages, on their own.
#
# The three translating steps sat at the very end of "Sync Telegram → Site", a chain whose cycle is about 29
# minutes, immediately before the deploy. A run that ended early -- and most do, because a push supersedes the one
# waiting -- threw away everything they had just translated, because the commit came after them. On 2026-11-22,
# 18 of 23 runs ended that way and not one dictionary was written all day.
#
# They need Gemini and git and nothing else from that run, so they stand alone here, commit their own files, and
# ask for the light rebuild. The calls themselves are paced across the quota day by pro_l10n.quota_allowance, so
# running more often does not spend more -- it only stops the work being lost.
name: Site and market languages

on:
  schedule:
    - cron: "11,41 * * * *"          # twice an hour; each run takes the slice of the day's calls released by then
  workflow_dispatch:

permissions:
  contents: write
  actions: write                     # to ask for the light page rebuild once the dictionaries are in

env:
  PYTHONUNBUFFERED: "1"
  # 2026-11-26: the owner asked for every language to be finished as fast as possible. 80 calls a key a day
  # left the 50 languages weeks away (about 6,000 calls still to make), and every key reported "working" with
  # room to spare. A key that does reach Google's own daily limit is retired for the run by scripts/ai.py, so
  # this only lifts our own ceiling, not Google's.
  L10N_PER_KEY: "400"
  I18N_SITE_SECONDS: "1320"          # 22 minutes of translating a run (it was 3)
  I18N_SITE_REQUESTS: "3000"         # the run takes whatever the day has released, not 8 calls a key
  # the same pool of free Gemini keys the long chain declares; without them nothing here translates at all
  # every free Gemini key in this repository's secrets, as one pool for scripts/ai.py
  ALI_API_KEY: ${{ secrets.ALI_API_KEY }}
  AZARI_API_KEY: ${{ secrets.AZARI_API_KEY }}
  HAMA_ADI_KEY: ${{ secrets.HAMA_ADI_KEY }}
  HANA_ADI_KEY: ${{ secrets.HANA_ADI_KEY }}
  HANA2_ADI_KEY: ${{ secrets.HANA2_ADI_KEY }}
  KURD_ADI_KEY: ${{ secrets.KURD_ADI_KEY }}
  MOKRI_API_KEY: ${{ secrets.MOKRI_API_KEY }}
  OMID_API_KEY: ${{ secrets.OMID_API_KEY }}
  SALAH_API_KEY: ${{ secrets.SALAH_API_KEY }}
  SARA_API_KEY: ${{ secrets.SARA_API_KEY }}
  # The owner's own numbered keys (he names them OMID01_ADI_KEY, OMID02_ADI_KEY …). Fifteen are listed so he
  # can keep adding them in his own naming without this file changing again.
  OMID01_ADI_KEY: ${{ secrets.OMID01_ADI_KEY }}
  OMID02_ADI_KEY: ${{ secrets.OMID02_ADI_KEY }}
  OMID03_ADI_KEY: ${{ secrets.OMID03_ADI_KEY }}
  OMID04_ADI_KEY: ${{ secrets.OMID04_ADI_KEY }}
  OMID05_ADI_KEY: ${{ secrets.OMID05_ADI_KEY }}
  OMID06_ADI_KEY: ${{ secrets.OMID06_ADI_KEY }}
  OMID07_ADI_KEY: ${{ secrets.OMID07_ADI_KEY }}
  OMID08_ADI_KEY: ${{ secrets.OMID08_ADI_KEY }}
  OMID09_ADI_KEY: ${{ secrets.OMID09_ADI_KEY }}
  OMID10_ADI_KEY: ${{ secrets.OMID10_ADI_KEY }}
  OMID11_ADI_KEY: ${{ secrets.OMID11_ADI_KEY }}
  OMID12_ADI_KEY: ${{ secrets.OMID12_ADI_KEY }}
  OMID13_ADI_KEY: ${{ secrets.OMID13_ADI_KEY }}
  OMID14_ADI_KEY: ${{ secrets.OMID14_ADI_KEY }}
  OMID15_ADI_KEY: ${{ secrets.OMID15_ADI_KEY }}
  # Ten spare slots for keys added later: make a secret named KEY01_API_KEY … KEY10_API_KEY in
  # Settings -> Secrets and variables -> Actions and it joins the pool by itself. A slot with no secret behind
  # it arrives empty, and scripts/ai.py passes over anything not shaped like a Gemini key, so the unused ones
  # cost nothing and nothing here has to change again.
  KEY01_API_KEY: ${{ secrets.KEY01_API_KEY }}
  KEY02_API_KEY: ${{ secrets.KEY02_API_KEY }}
  KEY03_API_KEY: ${{ secrets.KEY03_API_KEY }}
  KEY04_API_KEY: ${{ secrets.KEY04_API_KEY }}
  KEY05_API_KEY: ${{ secrets.KEY05_API_KEY }}
  KEY06_API_KEY: ${{ secrets.KEY06_API_KEY }}
  KEY07_API_KEY: ${{ secrets.KEY07_API_KEY }}
  KEY08_API_KEY: ${{ secrets.KEY08_API_KEY }}
  KEY09_API_KEY: ${{ secrets.KEY09_API_KEY }}
  KEY10_API_KEY: ${{ secrets.KEY10_API_KEY }}

concurrency:
  group: languages
  cancel-in-progress: false          # never interrupt a run part-way through committing

jobs:
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      # i18n reads the strings off the built pages, and /coins/, /academy/, /library/ and the rest are built by CI
      # rather than committed. Without this the corpus is the handful of committed pages -- 52 of them, against
      # roughly a thousand -- and almost nothing would be found to translate.
      - name: Build the pages the strings are read from
        timeout-minutes: 12
        run: python scripts/build_pages.py

      - name: Arabic dictionaries
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/i18n_ar.py || echo "::warning::Arabic dictionaries failed; the site ships without new ones"

      # 47 languages are live now, not the 8 that existed when 8 minutes was set: the step was cut off mid-run
      # on 2026-11-22 with work still queued. The day's calls are capped anyway, so a longer ceiling spends no
      # more -- it only lets a run finish what it has already paid for.
      - name: Site languages (the other 43, new strings only)
        id: site
        continue-on-error: true
        timeout-minutes: 30            # 22 of translating, the caches written every minute, then the dictionaries
        run: python scripts/i18n_site.py || echo "::warning::site languages failed; the pages use what the cache has"

      - name: Live-market languages (new strings only)
        continue-on-error: true
        timeout-minutes: 8
        env:
          COIN_KURD_API_KEY: ${{ secrets.COIN_KURD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/pro_l10n.py || echo "::warning::market translations failed; the pages use what the cache has"

      - name: Commit
        run: |
          git config user.name  "coinkurd-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/i18n_ar.json data/i18n data/pro_l10n 2>/dev/null || true
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "chore: site and market languages $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push && { echo "pushed=1" >> "$GITHUB_ENV"; break; }
            sleep 5
          done

      - name: Ask for the light page rebuild
        if: env.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main || echo "::warning::could not ask for the rebuild; the next run tries again"

      # GitHub starts this schedule three or four times a day rather than every 30 minutes. While strings are
      # still waiting and the day has calls left, the run starts the next one itself; i18n_site.more_after
      # decides, and the chain ends on its own when either runs out.
      - name: Start the next run while work and calls remain
        if: steps.site.outputs.more == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run languages.yml --repo "${{ github.repository }}" --ref main || echo "::warning::could not start the next run; the schedule picks it up"

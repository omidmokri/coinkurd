name: markets-try
on:
  push:
    branches: [markets-data]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests
      - run: MARKETS_FORCE=1 python scripts/markets.py
      - uses: actions/upload-artifact@v4
        with: { name: markets, path: data/markets/ }

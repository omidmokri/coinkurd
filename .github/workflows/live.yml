# The fast half of the site's data.
#
# "Sync Telegram → Site" is a chain: each run dispatches the next, because this repository's cron has been known
# to arrive hours late, and its own schedule is the net that restarts the chain if it breaks. That is working as
# intended -- the cancelled runs in its history are the net being superseded by the chain, not a fault.
#
# What it does mean is a cycle about 29 minutes long. Signals were read a third of the way into that cycle but
# not committed until roughly ten minutes later, so a signal waited half an hour for the site even when
# everything went right, and longer when a run ended early.
#
# These two steps need a few API calls and no AI, so they run on their own every 15 minutes, in their own
# concurrency group, and commit only their own files. They commit under data/, which update.yml ignores for its
# push trigger, so this adds no work to the chain -- and the chain no longer carries these two steps at all.
name: Live signals and DeFi

on:
  schedule:
    - cron: "2,17,32,47 * * * *"    # a few minutes ahead of the long run, so it starts with fresh signals
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild the DeFi file even if the last one is still within its three hours"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write          # to ask for the light page rebuild once the data is in

concurrency:
  group: live
  cancel-in-progress: false         # never interrupt a run that is part-way through committing

env:
  PYTHONUNBUFFERED: "1"

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "requests>=2.31" "beautifulsoup4>=4.12"

      - name: Indicator signals (TradingView alert relay + real outcomes)
        continue-on-error: true
        timeout-minutes: 5
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/signals.py

      # /charts/mvrv/, /charts/exchange-flows/, /charts/network/, /charts/bitcoin-cycle/: every day of seven chains'
      # history from Coin Metrics' community API. A handful of requests and no AI, like the rest of this workflow;
      # it sat in the long chain, where a cancelled run meant a day's figures simply never arrived.
      - name: On-chain daily series (Coin Metrics community data)
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/obs_chain.py

      # /charts/stablecoins/ — must follow obs_chain.py: it reads data/obs/chain_btc.json for Bitcoin's market value
      - name: Stablecoin supply and SSR (DefiLlama)
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/obs_stables.py

      # /charts/thermocap/ … /charts/decentralization/ — must follow obs_chain.py: it reads data/obs/chain_*.json
      # (and data/btcinfo.json for the mining pools); no network, a few seconds
      - name: More on-chain measures (score, compass, thermocap, hashprice, rotation)
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/obs_xchain.py

      - name: DeFi (TVL, chains, protocols, yields — DefiLlama)
        continue-on-error: true
        timeout-minutes: 5
        env:
          OBS_DEFI_FORCE: ${{ inputs.force && '1' || '' }}
        run: python scripts/obs_defi.py

      - name: Volume profile (dollars traded by price — Binance spot candles)
        continue-on-error: true
        timeout-minutes: 6
        env:
          OBS_VPROFILE_FORCE: ${{ inputs.force && '1' || '' }}
        run: python scripts/obs_vprofile.py

      - name: Commit
        run: |
          git config user.name  "coinkurd-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/signals.json data/live.json data/obs 2>/dev/null || true
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "chore: live signals and DeFi $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push && { echo "pushed=1" >> "$GITHUB_ENV"; break; }
            sleep 5
          done

      # Committing is only half of it: the site is served from a build, so without this the fresh data would sit
      # in the repository until the long chain next deployed -- up to half an hour, which is what this workflow
      # exists to avoid. The light rebuild cancels its own previous run, so asking often is harmless.
      - name: Ask for the light page rebuild
        if: env.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main || echo "::warning::could not ask for the rebuild; the next run tries again"

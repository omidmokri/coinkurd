name: Referral Bot

# ربات دعوت روی GitHub Actions اجرا می‌شود؛ هر اجرا ~۱۴ دقیقه به تلگرام گوش می‌دهد.
# state (کاربران/امتیازها) در برنچ جداگانهٔ refbot-state نگه داشته می‌شود تا
# روی سایت (GitHub Pages) منتشر نشود. کرون هر ۱۵ دقیقه اجرای بعدی را شروع می‌کند.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refbot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests

      - name: Load state branch
        run: |
          if git fetch origin refbot-state:refbot-state; then
            git worktree add state refbot-state
          else
            mkdir state && git -C state init -q -b refbot-state && echo '{}' > state/referrals.json
          fi

      - name: Run bot
        env:
          REF_BOT_TOKEN: ${{ secrets.REF_BOT_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHANNEL: "@Coin_Kurd"
          CHANNEL_LINK: "https://t.me/Coin_Kurd"
          GROUP: "@Coin_Kurd_Group"
          ADMIN_IDS: ${{ vars.ADMIN_IDS }}
          REWARD_AT: ${{ vars.REWARD_AT || '5' }}
          REWARD_TEXT: ${{ vars.REWARD_TEXT }}
          RUN_SECONDS: "840"
          STATE_PATH: state/referrals.json
          PUBLIC_PATH: state/leaderboard.json
        run: python scripts/refbot.py

      - name: Save state
        if: always()
        working-directory: state
        run: |
          git config user.name  "coinkurd-bot"
          git config user.email "bot@users.noreply.github.com"
          git remote get-url origin >/dev/null 2>&1 || git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "refbot state $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:refbot-state

name: Referral Bot

# ربات تلگرام انتخاب/Coin_Kurd روی GitHub Actions.
# هر اجرا ~۵۵ دقیقه به تلگرام گوش می‌دهد و در پایان، اجرای بعدی را خودش فوراً شروع می‌کند
# (پس ربات تقریباً بی‌وقفه آنلاین است). کرون فقط نگهبان است اگر زنجیره قطع شد.
# state (کاربران، امتیازها، هشدارها، زبان) در برنچ refbot-state است و هر ۱۰ دقیقه push می‌شود.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refbot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 pillow

      - name: Load state branch
        run: |
          git config --global user.name  "coinkurd-bot"
          git config --global user.email "bot@users.noreply.github.com"
          if git fetch origin refbot-state:refbot-state; then
            git worktree add state refbot-state
          else
            mkdir state && git -C state init -q -b refbot-state && echo '{}' > state/referrals.json
            git -C state remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
          git worktree add --detach mainwt origin/main

      - name: Run bot
        id: bot
        env:
          REF_BOT_TOKEN: ${{ secrets.REF_BOT_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHANNEL: "@Coin_Kurd"
          CHANNEL_LINK: "https://t.me/Coin_Kurd"
          GROUP: "@Coin_Kurd_Group"
          ADMIN_IDS: ${{ vars.ADMIN_IDS }}
          REWARD_AT: ${{ vars.REWARD_AT || '5' }}
          REWARD_TEXT: ${{ vars.REWARD_TEXT }}
          BRIEF_HOUR_UTC: ${{ vars.BRIEF_HOUR_UTC || '5' }}
          RUN_SECONDS: "3300"
          STATE_PATH: state/referrals.json
          PUBLIC_PATH: state/leaderboard.json
          STATE_GIT: state
          STATE_PUSH_EVERY: "600"
          MAIN_WORKTREE: mainwt
          TOPIC_IDS: "onchain:fa=47623,onchain:ckb=219340,news:fa=42033,news:ckb=69794,fx=33986"
          COIN_KURD_API_KEY: ${{ secrets.COIN_KURD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/refbot.py

      - name: Save state
        if: always()
        working-directory: state
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "refbot state $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:refbot-state

      - name: Start next run
        if: steps.bot.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refbot.yml --repo "${{ github.repository }}" --ref main || true

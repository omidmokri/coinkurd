# Measure candidate Persian voices and report. Publishes nothing and changes no page: it uploads the readings
# and the sample files so a person can look at the numbers and listen before a voice is chosen.
name: Voice test (Persian reading)

on:
  workflow_dispatch:
    inputs:
      only:
        description: "one candidate key, or empty for all"
        required: false
        default: ""

permissions:
  contents: write   # only to attach the sample files to a release for listening

concurrency:
  group: voicetest
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - name: Dependencies
        run: |
          python -m pip install -q --upgrade pip
          # coqui-tts is the maintained fork of the original TTS package; it runs VITS on the processor
          # coqui-tts does not pull PyTorch itself; without it every candidate fails while the job still
          # reports success. The processor-only wheels are installed first, from PyTorch's own index.
          pip install -q torch torchaudio torchcodec --index-url https://download.pytorch.org/whl/cpu
          # from PyTorch 2.9 the audio input and output goes through torchcodec, which coqui-tts ships as
          # its "codec" extra; without it every model fails at import
          # coqui-tts is installed WITHOUT its codec extra: that extra pulls torchcodec from PyPI, which is
          # built against CUDA and fails on a runner with no graphics card ("libnvrtc.so.13: cannot open
          # shared object file"). The processor build installed above is the one that must stay.
          # six is pulled in indirectly by coqui-tts but not declared by it
          pip install -q numpy "coqui-tts" huggingface_hub soundfile six sherpa-onnx
          python -c "import torch, torchcodec;print('torch', torch.__version__, 'cpu only:', not torch.cuda.is_available())"
      # the podcast's own transcriber, so a candidate is judged by the same listening test that decides
      # whether a finished episode may go to the channel
      - name: Voice models (cached)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../podcast-models
          key: podcast-models-v1
      - name: Fetch the transcriber
        continue-on-error: true
        env:
          PODCAST_MODELS: ${{ github.workspace }}/../podcast-models
        run: |
          pip install -q sherpa-onnx
          python scripts/podcast/models.py || echo "transcriber unavailable; the pitch reading still stands"

      - name: Read the sentences and measure
        timeout-minutes: 35
        env:
          PODCAST_MODELS: ${{ github.workspace }}/../podcast-models
        run: python scripts/podcast/voicetest.py --out "${{ runner.temp }}/voices" --only "${{ inputs.only }}"
      - name: Put the samples where they can be listened to
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${{ runner.temp }}/voices"
          ls *.wav >/dev/null 2>&1 || { echo "no samples to publish"; exit 0; }
          R="${{ github.repository }}"   # gh is run outside the checkout, so the repository must be named
          gh release delete voicetest -y --cleanup-tag --repo "$R" 2>/dev/null || true
          gh release create voicetest --repo "$R" --title "Persian voice test" --notes \
            "Samples read by each candidate, with the measured pitch in report.json. Nothing here is published to the site." \
            *.wav report.json

      - name: Keep the readings and the samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persian-voice-test
          path: ${{ runner.temp }}/voices
          retention-days: 14

name: Sync Telegram → Site

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # هر ۱۵ دقیقه
  workflow_dispatch:
    inputs:
      pages:
        description: "تعداد صفحات برای بک‌فیل (هر صفحه ~۲۰ پست)"
        default: "3"
      translate_limit:
        description: "حداکثر پست برای ترجمه در این اجرا"
        default: "120"
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      # هر مرحله مستقل است: شکست یکی مانع انتشار بقیه نمی‌شود (continue-on-error)
      - name: Fetch & classify posts
        id: fetch
        continue-on-error: true
        env:
          TG_CHANNEL: Coin_Kurd
          MAX_PAGES: ${{ github.event.inputs.pages || '3' }}
          BACKFILL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          python scripts/fetch.py || (sleep 30 && python scripts/fetch.py)

      - name: Repair links/footers & merge stored translations
        id: repair
        continue-on-error: true
        run: |
          python scripts/repair.py
          python scripts/merge_tr.py

      - name: Pick fastest working Gemini model
        continue-on-error: true
        env:
          COIN_KURD_API_KEY: ${{ secrets.COIN_KURD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_CHECK_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: timeout 300 python scripts/ai_check.py

      - name: Market dashboard & opportunity scanner (Binance / CoinGecko / alternative.me)
        id: market
        continue-on-error: true
        run: python scripts/market.py

      - name: Bitcoin network snapshot (mempool.space blocks, bitnodes nodes)
        id: chain
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/chain.py

      - name: Derivatives command room (OKX funding, OI, long/short, liquidations)
        id: deriv
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/derivatives.py

      - name: Coin logos (CoinGecko, only new ones)
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/logos.py

      - name: Multi-source news (RSS)
        id: news
        continue-on-error: true
        run: python scripts/news.py

      - name: Capital flow by sector + exchanges globe (CoinGecko)
        id: flows
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/flows.py

      - name: Narrative Radar
        id: narr
        continue-on-error: true
        run: python scripts/narratives.py

      - name: Economic calendar & market reaction
        id: events
        continue-on-error: true
        run: python scripts/events.py

      - name: Lab (memory, Monte Carlo, volatility, options, exchanges, dev activity, macro)
        id: lab
        continue-on-error: true
        timeout-minutes: 6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/lab.py

      - name: Market DNA (genes, similar coins, historical twins)
        id: dna
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/dna.py

      - name: Kurdistani indicators engine (open-source ports — Power Law, Style Cycle, Spiral)
        id: kind
        continue-on-error: true
        timeout-minutes: 4
        env:
          KIND_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/kind.py

      - name: Indicator signals (TradingView alert relay + real outcomes)
        id: signals
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/signals.py

      - name: Market Wrapped (weekly / monthly)
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/wrapped.py

      - name: Post & signal track record
        id: impact
        continue-on-error: true
        run: python scripts/impact.py

      - name: Entekhab Score
        id: score
        continue-on-error: true
        run: python scripts/score.py

      - name: Market Brain (regime, why-it-moved, Gemini report)
        id: brain
        continue-on-error: true
        env:
          COIN_KURD_API_KEY: ${{ secrets.COIN_KURD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAIN_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        timeout-minutes: 5
        run: python scripts/brain.py

      - name: AI Council (daily)
        continue-on-error: true
        timeout-minutes: 4
        env:
          COIN_KURD_API_KEY: ${{ secrets.COIN_KURD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/council.py

      - name: Market Replay snapshot
        continue-on-error: true
        run: python scripts/snapshot.py

      - name: Translate new posts (fa → ckb, en)
        id: translate
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COIN_KURD_API_KEY: ${{ secrets.COIN_KURD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRANSLATE_LIMIT: ${{ github.event.inputs.translate_limit || '25' }}
        timeout-minutes: 8
        run: python scripts/translate.py

      - name: Enrich archive (post types, repeats, entities, light index)
        id: enrich
        continue-on-error: true
        run: python scripts/enrich.py

      - name: Health check & Telegram alert
        id: health
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ALERT_CHAT: ${{ secrets.TG_ALERT_CHAT }}
          STEP_FETCH: ${{ steps.fetch.outcome }}
          STEP_REPAIR: ${{ steps.repair.outcome }}
          STEP_MARKET: ${{ steps.market.outcome }}
          STEP_IMPACT: ${{ steps.impact.outcome }}
          STEP_NEWS: ${{ steps.news.outcome }}
          STEP_SCORE: ${{ steps.score.outcome }}
          STEP_BRAIN: ${{ steps.brain.outcome }}
          STEP_NARR: ${{ steps.narr.outcome }}
          STEP_EVENTS: ${{ steps.events.outcome }}
          STEP_LAB: ${{ steps.lab.outcome }}
          STEP_CHAIN: ${{ steps.chain.outcome }}
          STEP_DERIV: ${{ steps.deriv.outcome }}
          STEP_FLOWS: ${{ steps.flows.outcome }}
          STEP_DNA: ${{ steps.dna.outcome }}
          STEP_KIND: ${{ steps.kind.outcome }}
          STEP_SIGNALS: ${{ steps.signals.outcome }}
          STEP_ENRICH: ${{ steps.enrich.outcome }}
        run: python scripts/health.py

      - name: Commit data
        run: |
          git config user.name  "coinkurd-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: sync data $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 5
          done

      - name: Build static SEO pages (posts, coins, sitemap)
        run: python scripts/build_pages.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Sync Telegram → Site

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # هر ۱۵ دقیقه
  workflow_dispatch:
    inputs:
      pages:
        description: "تعداد صفحات برای بک‌فیل (هر صفحه ~۲۰ پست)"
        default: "3"
      translate_limit:
        description: "حداکثر پست برای ترجمه در این اجرا"
        default: "120"
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write          # the run needs this to start the next one itself

concurrency:
  group: sync
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: t0
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      # هر مرحله مستقل است: شکست یکی مانع انتشار بقیه نمی‌شود (continue-on-error)
      - name: Fetch & classify posts
        id: fetch
        continue-on-error: true
        env:
          TG_CHANNEL: Coin_Kurd
          MAX_PAGES: ${{ github.event.inputs.pages || '3' }}
          BACKFILL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          python scripts/fetch.py || (sleep 30 && python scripts/fetch.py)

      - name: Repair links/footers & merge stored translations
        id: repair
        continue-on-error: true
        run: |
          python scripts/repair.py
          python scripts/merge_tr.py

      # Every post keeps its picture in the repo: Telegram's CDN links expire after a few days (and are
      # filtered for many readers in Iran), which left almost the whole archive without pictures.
      # Expired links are refreshed from the channel pages; a post that never had a picture gets a
      # card of its own headline. The first run clears the backlog; later runs only add the new posts.
      - name: Archive post images in the repo (Telegram CDN links expire)
        continue-on-error: true
        timeout-minutes: 14
        run: python scripts/postimg.py --limit 1200 --cards 80

      - name: Pick fastest working Gemini model
        continue-on-error: true
        env:
          COIN_KURD_API_KEY: ${{ secrets.COIN_KURD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_CHECK_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: timeout 300 python scripts/ai_check.py

      - name: Market dashboard & opportunity scanner (Binance / CoinGecko / alternative.me)
        id: market
        continue-on-error: true
        run: python scripts/market.py

      - name: Scanner track record (one-time 40-day backtest + live log of every finding)
        id: scanlog
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/scanlog.py

      - name: Scanner audit (each pattern vs the same coins at other hours, exact shift test)
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/scanaudit.py

      - name: Bitcoin network snapshot (mempool.space blocks, bitnodes nodes)
        id: chain
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/chain.py

      - name: Derivatives command room (OKX funding, OI, long/short, liquidations)
        id: deriv
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/derivatives.py

      - name: Altcoin Season Index (CoinGecko top 50, Binance daily closes; every 6 h)
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/altseason.py

      - name: Coin logos (CoinGecko, only new ones)
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/logos.py

      - name: Multi-source news (RSS)
        id: news
        continue-on-error: true
        run: python scripts/news.py

      - name: News live translation (Gemini → Google fallback) → Persian & Sorani
        continue-on-error: true
        timeout-minutes: 6
        env:
          COIN_KURD_API_KEY: ${{ secrets.COIN_KURD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: timeout 330 python scripts/news_tr.py

      - name: Capital flow by sector + exchanges globe (CoinGecko)
        id: flows
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/flows.py

      - name: Post stance labels for the directional study (Gemini, quote-verified; no page yet)
        continue-on-error: true
        timeout-minutes: 5
        env:
          COIN_KURD_API_KEY: ${{ secrets.COIN_KURD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: timeout 280 python scripts/stance.py 48

      - name: Directional study (stance vs next-24h move, day-level permutation test)
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/direction.py

      - name: Narrative Radar
        id: narr
        continue-on-error: true
        run: python scripts/narratives.py

      - name: Economic calendar & market reaction
        id: events
        continue-on-error: true
        run: python scripts/events.py

      - name: Lab (memory, Monte Carlo, volatility, options, exchanges, dev activity, macro)
        id: lab
        continue-on-error: true
        timeout-minutes: 6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/lab.py

      - name: Market DNA (genes, similar coins, historical twins)
        id: dna
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/dna.py

      - name: Kurdistani indicators engine (open-source ports — Power Law, Style Cycle, Spiral)
        id: kind
        continue-on-error: true
        timeout-minutes: 4
        env:
          KIND_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/kind.py

      - name: Crypto vs global markets (FRED + Binance correlations)
        id: macro
        continue-on-error: true
        timeout-minutes: 3
        env:
          MACRO_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/macro.py

      - name: Indicator signals (TradingView alert relay + real outcomes)
        id: signals
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/signals.py

      - name: Market Wrapped (weekly / monthly)
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/wrapped.py

      - name: Post & signal track record
        id: impact
        continue-on-error: true
        run: python scripts/impact.py

      - name: Channel track record (posts vs random hours, randomisation test)
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/trackrecord.py

      - name: Entekhab Score
        id: score
        continue-on-error: true
        run: python scripts/score.py

      - name: Market Brain (regime, why-it-moved, Gemini report)
        id: brain
        continue-on-error: true
        env:
          COIN_KURD_API_KEY: ${{ secrets.COIN_KURD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAIN_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        timeout-minutes: 5
        run: python scripts/brain.py

      - name: AI Council (daily)
        continue-on-error: true
        timeout-minutes: 4
        env:
          COIN_KURD_API_KEY: ${{ secrets.COIN_KURD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/council.py

      # ---------------- Reality check layer (واقعیت‌سنج): each step independent
      - name: Iran local friction score
        id: friction
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/friction.py

      - name: Local correlation matrix (Iran dollar/tether archive backfill + Binance)
        id: localcorr
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/localcorr.py

      - name: Hype half-life (daily)
        id: hype
        continue-on-error: true
        timeout-minutes: 5
        env:
          HYPE_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/hype.py

      - name: Silent exit detector (hourly)
        id: silent
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/silent_exit.py

      - name: Time-locked signal ledger (+ daily OpenTimestamps anchor)
        id: ledger
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/ledger.py

      - name: Market Replay snapshot
        continue-on-error: true
        run: python scripts/snapshot.py

      - name: Translate new posts (fa → ckb, en)
        id: translate
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COIN_KURD_API_KEY: ${{ secrets.COIN_KURD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRANSLATE_LIMIT: ${{ github.event.inputs.translate_limit || '25' }}
        timeout-minutes: 8
        run: python scripts/translate.py

      - name: Enrich archive (post types, repeats, entities, light index)
        id: enrich
        continue-on-error: true
        run: python scripts/enrich.py

      - name: Health check & Telegram alert
        id: health
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ALERT_CHAT: ${{ secrets.TG_ALERT_CHAT }}
          STEP_FETCH: ${{ steps.fetch.outcome }}
          STEP_REPAIR: ${{ steps.repair.outcome }}
          STEP_MARKET: ${{ steps.market.outcome }}
          STEP_IMPACT: ${{ steps.impact.outcome }}
          STEP_NEWS: ${{ steps.news.outcome }}
          STEP_SCORE: ${{ steps.score.outcome }}
          STEP_BRAIN: ${{ steps.brain.outcome }}
          STEP_NARR: ${{ steps.narr.outcome }}
          STEP_EVENTS: ${{ steps.events.outcome }}
          STEP_LAB: ${{ steps.lab.outcome }}
          STEP_CHAIN: ${{ steps.chain.outcome }}
          STEP_DERIV: ${{ steps.deriv.outcome }}
          STEP_FLOWS: ${{ steps.flows.outcome }}
          STEP_DNA: ${{ steps.dna.outcome }}
          STEP_KIND: ${{ steps.kind.outcome }}
          STEP_SIGNALS: ${{ steps.signals.outcome }}
          STEP_ENRICH: ${{ steps.enrich.outcome }}
          STEP_SCANLOG: ${{ steps.scanlog.outcome }}
        run: python scripts/health.py

      - name: IndexNow (notify search engines of new pages)
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/indexnow.py

      - name: Toman opportunity-cost data
        id: opportunity
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/opportunity.py

      - name: Regime radar (HMM, once per closed day)
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/regime.py

      - name: Coin logos for the coins wall (every coin shows its own logo)
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/coin_logos.py

      - name: Strategy-lab context (Fear & Greed, BTC regime, funding)
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/lab_context.py

      - name: Anomaly hunter (daily scan + light now-view)
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/anomaly.py

      - name: Signal Truth Lab
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/truth.py

      - name: Site assistant index (homepage help chat)
        id: assistant
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/build_assistant.py

      - name: Freeze today's /today/ snapshot (data/today_days.json)
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/build_today.py --snapshot

      - name: Leak guard (no indicator source may ever reach the public repo or site)
        run: python scripts/leak_guard.py

      - name: Commit data
        run: |
          git config user.name  "coinkurd-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: sync data $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 5
          done

      - name: Build static SEO pages (posts, coins, sitemap)
        run: python scripts/build_pages.py

      - name: Build reality-check pages (ledger, friction, hype, silent exit, correlation)
        continue-on-error: true
        run: python scripts/build_reality.py

      - name: Build the quant pages (regime, truth lab, anomalies)
        continue-on-error: true
        run: python scripts/build_quant.py && python scripts/build_strategy_lab.py && python scripts/build_dca.py && python scripts/build_derivatives.py

      - name: Build the Roundtable page
        continue-on-error: true
        run: python scripts/build_roundtable.py

      - name: Build the opportunity-cost calculator page
        continue-on-error: true
        run: python scripts/build_opportunity.py

      - name: Build the channel track-record page
        continue-on-error: true
        run: python scripts/build_trackrecord.py

      - name: Build the daily spine page (/today/)
        continue-on-error: true
        run: python scripts/build_today.py

      - name: Build the nightly class page (/class/)
        continue-on-error: true
        run: python scripts/build_class.py

      - name: Build the autopilot log page
        continue-on-error: true
        run: python scripts/build_autopilot.py

      - name: Build the learning map (/map/)
        continue-on-error: true
        run: python scripts/build_map.py

      - name: Make the WebP copies of new pictures
        continue-on-error: true
        run: python -I scripts/webp.py

      - name: Rebuild the markets library (data/library.json)
        continue-on-error: true
        run: python -I scripts/libdata/build.py

      - name: Check the Bitcoin for Juniors translations (structure, letters, digits)
        continue-on-error: true
        run: |
          python -I scripts/b4j_check.py fa
          python -I scripts/b4j_check.py ckb

      - name: Build Bitcoin for Juniors (/kids/)
        continue-on-error: true
        run: python scripts/build_kids.py

      - name: Check the built /kids/ pages
        continue-on-error: true
        run: python scripts/kids_check.py

      - name: Cache the read-aloud voices
        id: ttscache
        uses: actions/cache@v4
        with:
          path: ~/.cache/entekhab-tts
          key: tts-${{ hashFiles('scripts/fetch_tts.py') }}
      - name: Install the int8 quantiser (only when the voice cache is cold)
        if: steps.ttscache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: pip install onnxruntime==1.31.1 onnx==1.23.2
      - name: Fetch the read-aloud voices (Persian, Sorani) into tts/
        continue-on-error: true
        run: python scripts/fetch_tts.py
      - name: Leak guard (no indicator source may ever reach the public repo or site)
        run: python scripts/leak_guard.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }

      # GitHub drops most of our scheduled runs: a "every 15 minutes" cron fired about once every
      # three hours, so prices, the friction score, the correlation matrix, the hype half-life, the
      # silent-exit detector and the ledger all sat hours out of date. So each run starts the next
      # one itself, the way the bot does, and the cron is only the watchdog that restarts a broken
      # chain. Guards: a run that ended within five minutes is broken (the schedule restarts it),
      # A push run chains too, but only when no other sync run is queued or running: a push that
      # arrives while the chain's next run is pending replaces (cancels) that pending run, and on
      # 2026-11-08 that silently ended the chain for over an hour. A burst of pushes still yields
      # one chain, because GitHub keeps only the newest pending run of the group.
      - name: Start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ran=$(( $(date +%s) - ${{ steps.t0.outputs.at }} ))
          if [ "$ran" -lt 300 ]; then
            echo "::warning::the run ended after ${ran}s — too soon to chain another; the schedule will restart it"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            others=$(gh run list --repo "${{ github.repository }}" --workflow update.yml -L 20 \
              --json databaseId,status --jq '[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != "completed")] | length' || echo 1)
            if [ "$others" != "0" ]; then echo "another sync run is pending ($others) — it keeps the chain"; exit 0; fi
          fi
          for i in 1 2 3; do
            gh workflow run update.yml --repo "${{ github.repository }}" --ref main && exit 0
            echo "dispatch failed (attempt $i); retrying in 20s"
            sleep 20
          done
          echo "::warning::could not start the next run; the schedule will restart the sync"

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    # Pages takes one deployment at a time. The light rebuild and the sync used to deploy in parallel and the
    # loser waited out deploy-pages' 10-minute limit ("Timeout reached, aborting!", runs #702, #706-#709).
    # One shared queue for both workflows; a newer queued deploy replaces an older queued one.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      # deploy-pages caps its wait at 10 minutes, and Pages sometimes takes longer to process the ~210 MB site
      # ("Timeout reached, aborting!"). The artifact is already uploaded, so a second try simply deploys it again.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4

name: Sync Telegram → Site

on:
  schedule:
    - cron: "17 * * * *"      # هر ساعت (دقیقهٔ ۱۷)
  workflow_dispatch:
    inputs:
      pages:
        description: "تعداد صفحات برای بک‌فیل (هر صفحه ~۲۰ پست)"
        default: "3"
      translate_limit:
        description: "حداکثر پست برای ترجمه در این اجرا"
        default: "40"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Fetch & classify posts
        env:
          TG_CHANNEL: Coin_Kurd
          MAX_PAGES: ${{ github.event.inputs.pages || '3' }}
          BACKFILL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/fetch.py
      - name: Translate new posts (fa → ckb, en)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRANSLATE_LIMIT: ${{ github.event.inputs.translate_limit || '40' }}
        run: python scripts/translate.py
      - name: Commit data
        run: |
          git config user.name  "coinkurd-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: sync posts $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

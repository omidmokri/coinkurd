name: Daily podcast (نبض کریپتو)

# پادکست روزانهٔ بازار به چهار زبان (فارسی، کوردی سورانی، انگلیسی، عربی) — به درخواست مالک سایت، ۲۱ آبان ۱۴۰۵.
# هر روز از داده‌های همین مخزن ساخته می‌شود، کنترل کیفیت می‌شود و ساعت ۱۹:۰۰ به وقت تهران (۱۵:۳۰ UTC) یک پست
# آلبومی با چهار فایل صوتی در کانال Coin_Kurd می‌گذارد. هر زبانی که از کنترل کیفیت رد شود منتشر نمی‌شود.
# The owner asked for this daily post on 2026-11-12 (session chat); it is the one bot post the autopilot must keep.
on:
  schedule:
    # Watchdog only. GitHub ran this cron between 21:30 and 23:00 UTC every evening of November 2026 — hours after
    # the 19:00 Tehran slot — so the episode is normally started by the sync chain (update.yml, "Start today's
    # podcast"), which runs on time. This entry stays for the days that chain is broken; a late run still posts,
    # and the guard below keeps it from posting a second time.
    - cron: "50 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = make + check, publish nothing · publish = release + site + Telegram (at 19:00 Tehran, or now if later)"
        default: dry-run
        type: choice
        options: [dry-run, publish]

permissions:
  contents: write
  actions: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  # A run that would repost today's episode stops here instead of rebuilding it and re-cutting its release:
  # the sync chain can dispatch while the late cron is still queued, and publish.py's ledger check comes only
  # after the release and the commit.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: data/podcast, sparse-checkout-cone-mode: false }
      - id: check
        run: |
          f="data/podcast/$(date -u +%F).json"
          if [ -f "$f" ] && python3 -c "import json,sys;sys.exit(0 if json.load(open('$f')).get('telegram') else 1)"; then
            echo "::notice::today's episode is already in the channel — nothing to do"
            echo "go=0" >> "$GITHUB_OUTPUT"
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi

  episode:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 200  # up to 70 min to make the episode, then up to 100 waiting for 19:00 Tehran
    env:
      PODCAST_MODELS: ${{ github.workspace }}/../podcast-models
      PODCAST_FONTS: ${{ github.workspace }}/../podcast-fonts
      EP: ${{ github.workspace }}/_episode
      PYTHONUNBUFFERED: "1"
      # The writer needs a capable model, not the quickest one. ai_check.py picks by latency and had settled on
      # gemini-3.5-flash-lite (0.45 s); writing a 2000-word script it returned six unparsable answers in a row on
      # 2026-11-21 and put figures in the script that the facts do not carry. ai.py still falls back through the
      # list in data/ai_model.json when this model's quota runs out, so a busy day still gets an episode.
      GEMINI_MODEL: gemini-3.6-flash
      # Every free Gemini key in this repository's secrets, as one pool for scripts/ai.py — the same pool the site
      # sync uses (update.yml). Until 2026-11-21 this job passed only two of them, so the writer ran on a single key,
      # hit its per-day quota every evening and the episode was held: that is why nothing was published for a week.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COIN_KURD_API_KEY: ${{ secrets.COIN_KURD_API_KEY }}
      ALI_API_KEY: ${{ secrets.ALI_API_KEY }}
      AZARI_API_KEY: ${{ secrets.AZARI_API_KEY }}
      HAMA_ADI_KEY: ${{ secrets.HAMA_ADI_KEY }}
      HANA_ADI_KEY: ${{ secrets.HANA_ADI_KEY }}
      HANA2_ADI_KEY: ${{ secrets.HANA2_ADI_KEY }}
      KURD_ADI_KEY: ${{ secrets.KURD_ADI_KEY }}
      MOKRI_API_KEY: ${{ secrets.MOKRI_API_KEY }}
      OMID_API_KEY: ${{ secrets.OMID_API_KEY }}
      SALAH_API_KEY: ${{ secrets.SALAH_API_KEY }}
      SARA_API_KEY: ${{ secrets.SARA_API_KEY }}
      # The owner's own numbered keys (he names them OMID01_ADI_KEY, OMID02_ADI_KEY …). Fifteen are listed so he
      # can keep adding them in his own naming without this file changing again.
      OMID01_ADI_KEY: ${{ secrets.OMID01_ADI_KEY }}
      OMID02_ADI_KEY: ${{ secrets.OMID02_ADI_KEY }}
      OMID03_ADI_KEY: ${{ secrets.OMID03_ADI_KEY }}
      OMID04_ADI_KEY: ${{ secrets.OMID04_ADI_KEY }}
      OMID05_ADI_KEY: ${{ secrets.OMID05_ADI_KEY }}
      OMID06_ADI_KEY: ${{ secrets.OMID06_ADI_KEY }}
      OMID07_ADI_KEY: ${{ secrets.OMID07_ADI_KEY }}
      OMID08_ADI_KEY: ${{ secrets.OMID08_ADI_KEY }}
      OMID09_ADI_KEY: ${{ secrets.OMID09_ADI_KEY }}
      OMID10_ADI_KEY: ${{ secrets.OMID10_ADI_KEY }}
      OMID11_ADI_KEY: ${{ secrets.OMID11_ADI_KEY }}
      OMID12_ADI_KEY: ${{ secrets.OMID12_ADI_KEY }}
      OMID13_ADI_KEY: ${{ secrets.OMID13_ADI_KEY }}
      OMID14_ADI_KEY: ${{ secrets.OMID14_ADI_KEY }}
      OMID15_ADI_KEY: ${{ secrets.OMID15_ADI_KEY }}
      # Ten spare slots for keys added later: make a secret named KEY01_API_KEY … KEY10_API_KEY in
      # Settings -> Secrets and variables -> Actions and it joins the pool by itself. A slot with no secret behind
      # it arrives empty, and scripts/ai.py passes over anything not shaped like a Gemini key, so the unused ones
      # cost nothing and nothing here has to change again.
      KEY01_API_KEY: ${{ secrets.KEY01_API_KEY }}
      KEY02_API_KEY: ${{ secrets.KEY02_API_KEY }}
      KEY03_API_KEY: ${{ secrets.KEY03_API_KEY }}
      KEY04_API_KEY: ${{ secrets.KEY04_API_KEY }}
      KEY05_API_KEY: ${{ secrets.KEY05_API_KEY }}
      KEY06_API_KEY: ${{ secrets.KEY06_API_KEY }}
      KEY07_API_KEY: ${{ secrets.KEY07_API_KEY }}
      KEY08_API_KEY: ${{ secrets.KEY08_API_KEY }}
      KEY09_API_KEY: ${{ secrets.KEY09_API_KEY }}
      KEY10_API_KEY: ${{ secrets.KEY10_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python packages
        run: pip install numpy scipy soundfile soxr pyloudnorm num2words "sherpa-onnx<2" onnxruntime pillow requests
      - name: ffmpeg (static build from GitHub; apt is too slow on these runners)
        run: |
          curl -sSfL --retry 4 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ff && tar xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          echo "/tmp/ff/bin" >> "$GITHUB_PATH"
      - name: Fonts for the covers
        run: |
          mkdir -p "$PODCAST_FONTS"
          for p in vazirmatn space-grotesk archivo-black; do
            d="$PODCAST_FONTS/fontsource-$p-5.3.0"; mkdir -p "$d"
            curl -sSfL --retry 4 "https://registry.npmjs.org/@fontsource/$p/-/$p-5.3.0.tgz" | tar xz -C "$d"
          done
      - name: Voice models (cached)
        uses: actions/cache@v4
        with:
          path: ${{ env.PODCAST_MODELS }}
          key: podcast-models-v1
      - run: python scripts/podcast/models.py
      - name: Make the episode
        run: python scripts/podcast/run.py --out "$EP"
      - name: Keep the episode files for review (14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ env.EP }}/*.mp3
            ${{ env.EP }}/*.srt
            ${{ env.EP }}/*.jpg
            ${{ env.EP }}/*.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REF_BOT_TOKEN: ${{ secrets.REF_BOT_TOKEN }}
        run: |
          git config user.name "coinkurd-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "publish" ]; then
            python scripts/podcast/publish.py --ep "$EP"
          else
            python scripts/podcast/publish.py --ep "$EP" --dry-run
          fi

      - name: Tell the owner if the episode did not go out
        if: failure()
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ALERT_CHAT: ${{ secrets.TG_ALERT_CHAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/podcast/notify.py "$EP"

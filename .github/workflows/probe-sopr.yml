name: Probe SOPR sources (temporary)
on:
  push:
    branches: [probe-sopr]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: mkdir out && cd out && python3 ../probe/p.py
      - run: |
          git config user.name "probe" && git config user.email "probe@users.noreply.github.com"
          git add out && git commit -qm "probe output" && git push -q

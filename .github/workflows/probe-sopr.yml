name: Probe SOPR sources (temporary)
on:
  push:
    branches: [probe-sopr]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: mkdir out && cd out && python3 ../probe/p.py
      - uses: actions/upload-artifact@v4
        with: {name: probe, path: out/, retention-days: 2}

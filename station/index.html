<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="description" content="جهان انتخاب: ایستگاه مداری بازی‌گونهٔ entekhab.net بالای زمین واقعی. فضانوردت را بساز، راه برو و از هشت دروازه به بخش‌های سایت برو.">
<link rel="canonical" href="https://entekhab.net/station/">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:title" content="جهان انتخاب · ایستگاه مداری"><meta property="og:image" content="https://entekhab.net/assets/og.jpg">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>جهان انتخاب · ایستگاه مداری</title>
<meta name="theme-color" content="#000000">
<style>
@font-face{font-family:Vazirmatn;src:url(/assets/fonts/Vazirmatn-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(/assets/fonts/Vazirmatn-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(/assets/fonts/Vazirmatn-Black.woff2) format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/assets/fonts/SpaceGrotesk-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/assets/fonts/SpaceGrotesk-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--or:#f7931a;--gold:#ffd27a;--up:#34d399;--ink:#eef1f5;--mute:#9aa4b1;--line:rgba(255,255,255,.12);
  --foil:linear-gradient(100deg,#fff1c9 0%,#ffd27a 24%,#f7931a 60%,#a65a07 100%);--f:Vazirmatn,system-ui,sans-serif;--g:"Space Grotesk",Vazirmatn,system-ui,sans-serif;--e:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#w{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;cursor:grab}
#w:active{cursor:grabbing}
.glass{background:linear-gradient(155deg,rgba(255,255,255,.085),rgba(255,255,255,.018) 46%,rgba(255,255,255,.045)),rgba(6,8,12,.7);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 20px 50px rgba(0,0,0,.5)}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* HUD */
.hud{position:fixed;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.tl{top:14px;inset-inline-start:14px;display:grid;gap:10px;width:min(290px,calc(100vw - 190px))}
.tr{top:14px;inset-inline-end:14px;display:grid;justify-items:end;gap:10px}
.brand{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px}
.brand img{height:26px}
.brand b{font-weight:900;font-size:.98rem}
.brand small{display:block;font:500 .66rem var(--g);letter-spacing:.14em;color:var(--gold);direction:ltr;text-align:start}
.quests{padding:12px 14px;border-radius:16px}
.quests h3{margin:0 0 8px;font-size:.78rem;font-weight:700;color:var(--mute);display:flex;justify-content:space-between}
.quests h3 span{font:700 .78rem var(--g);color:var(--gold);direction:ltr}
.q{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:.84rem;color:#d7dde4;transition:color .3s}
.q i{flex:0 0 auto;width:18px;height:18px;border-radius:6px;border:1.5px solid rgba(255,255,255,.3);display:grid;place-items:center;transition:background .3s,border-color .3s}
.q.done{color:#7f8995;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.q.done i{background:var(--or);border-color:var(--or)}
.q.done i::after{content:"";width:8px;height:4px;border:2px solid #000;border-top:0;border-right:0;rotate:-45deg;margin-top:-2px}
.q small{margin-inline-start:auto;font:700 .74rem var(--g);color:var(--gold);direction:ltr}
.row{display:flex;gap:8px}
.ib{height:40px;min-width:40px;padding:0 12px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#dfe5ec;text-decoration:none;font-weight:700;font-size:.82rem;cursor:pointer}
.ib:hover{border-color:rgba(247,147,26,.6)}
.ib svg{width:18px;height:18px}
.lang{display:flex;padding:3px;border-radius:12px;gap:2px}
.lang button{border:0;background:none;color:#aab3bd;font:700 .72rem var(--g);padding:6px 8px;border-radius:9px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--or);color:#000}
#map{width:150px;height:150px;border-radius:50%;display:block}
.mapw{padding:6px;border-radius:50%}
.pv{position:fixed;top:14px;left:50%;translate:-50% 0;z-index:6;padding:6px 14px;border-radius:999px;font-size:.7rem;font-weight:700;color:#000;background:var(--gold);white-space:nowrap}

.hint{position:fixed;bottom:18px;left:50%;translate:-50% 0;z-index:5;padding:9px 16px;border-radius:999px;font-size:.8rem;color:#c9d1da;white-space:nowrap;transition:opacity .6s}
.hint kbd{font:700 .72rem var(--g);padding:2px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);margin:0 2px}

/* the card that appears near a gate or Nima */
.near{position:fixed;left:50%;bottom:74px;translate:-50% 20px;z-index:7;width:min(420px,calc(100vw - 28px));padding:18px 18px 16px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .35s,translate .45s var(--e)}
.near.on{opacity:1;translate:-50% 0;pointer-events:auto}
.near .k{font:700 .7rem var(--g);letter-spacing:.16em;color:var(--or);direction:ltr;display:block;text-align:start}
.near h4{margin:6px 0 4px;font-size:1.25rem;font-weight:900}
.near p{margin:0;color:#b9c1cb;font-size:.88rem;line-height:1.8}
.near .act{display:flex;align-items:center;gap:10px;margin-top:14px}
.go{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;border:0;color:#000;background:var(--foil);font-weight:900;font-size:.9rem;text-decoration:none;cursor:pointer;box-shadow:0 10px 28px rgba(247,147,26,.35)}
.near .kb{font-size:.78rem;color:var(--mute)}
.near .kb kbd{font:700 .72rem var(--g);padding:2px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.25)}

/* intro: who are you */
.intro{position:fixed;inset:0;z-index:20;display:grid;align-items:center;justify-items:end;padding:clamp(14px,5vw,70px);
  background:linear-gradient(90deg,rgba(0,0,0,.0) 30%,rgba(0,0,0,.55));transition:opacity .6s}
[dir=rtl] .intro{justify-items:start;background:linear-gradient(270deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.55))}
.intro.off{opacity:0;pointer-events:none}
.ic{width:min(400px,100%);padding:26px;border-radius:26px}
.ic .k{font:700 .72rem var(--g);letter-spacing:.18em;color:var(--or);direction:ltr;display:block;text-align:start}
.ic h1{margin:8px 0 6px;font-size:clamp(1.8rem,4vw,2.5rem);font-weight:900;line-height:1.15}
.ic p{margin:0 0 18px;color:#b9c1cb;line-height:1.85;font-size:.92rem}
.ic label{display:block;font-size:.78rem;color:var(--mute);font-weight:700;margin:14px 0 8px}
.ic input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;font:700 1rem var(--f)}
.sw{display:flex;gap:10px}
.sw button{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.2);cursor:pointer;transition:transform .2s,border-color .2s}
.sw button[aria-pressed=true]{border-color:var(--gold);transform:scale(1.12);box-shadow:0 0 0 3px rgba(247,147,26,.25)}
.ic .go{margin-top:22px;width:100%;justify-content:center;padding:14px}
.ic .keys{margin-top:14px;font-size:.76rem;color:#7f8995;line-height:1.9}

/* touch controls */
.pad{position:fixed;z-index:6;display:none;bottom:24px;touch-action:none}
.touch .pad{display:block}
.joy{left:22px;width:132px;height:132px;border-radius:50%}
.joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe1a8,#f7931a 60%,#9a5300);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.btns{right:22px;display:none;gap:12px;align-items:end}
.touch .btns{display:flex}
.btns button{width:66px;height:66px;border-radius:50%;color:#fff;font:900 .8rem var(--f);cursor:pointer}
.btns .act{width:78px;height:78px;background:var(--foil);color:#000;border:0}
.touch .hint{display:none}
.touch .near{bottom:176px}

.toast{position:fixed;top:84px;left:50%;translate:-50% -10px;z-index:8;padding:10px 18px;border-radius:999px;font-weight:700;font-size:.88rem;opacity:0;transition:opacity .3s,translate .4s var(--e);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;translate:-50% 0}
.flash{position:fixed;inset:0;z-index:9;background:radial-gradient(circle,rgba(255,220,160,.95),rgba(247,147,26,.5) 40%,transparent 70%);opacity:0;pointer-events:none;transition:opacity .5s}
.flash.on{opacity:1;transition:opacity .15s}
.pre .hud,.pre .hint,.pre .pad,.pre .ekg-fab{opacity:0;pointer-events:none}
.nogl{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;z-index:30;background:#000}

/* Nima's button sits up top here, out of the joystick's way */
.ekg-fab{bottom:auto!important;top:178px}
.ekg-panel{bottom:auto!important;top:252px;max-height:calc(100vh - 270px)!important}
.ekg-hint{bottom:auto!important;top:186px}
@media (max-width:700px){
  .tl{width:min(230px,calc(100vw - 150px))}
  #map{width:104px;height:104px}
  .quests{padding:10px 12px}.q{font-size:.76rem;padding:3px 0}
  .brand{padding:8px 10px}.brand img{height:20px}.brand b{font-size:.84rem}
  .pv{top:auto;bottom:4px;font-size:.6rem;padding:3px 10px}
  .ekg-fab{top:146px}.ekg-hint{display:none}.ekg-panel{top:212px;max-height:calc(100vh - 400px)!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="w" aria-label="Entekhab world"></canvas>

<div class="hud tl">
  <div class="brand glass"><img src="/assets/logo-h.webp" alt=""><div><b data-t="title">جهان انتخاب</b><small>ORBITAL STATION · LEO 408 KM</small></div></div>
  <div class="quests glass" id="quests"></div>
</div>
<div class="hud tr">
  <div class="row">
    <div class="lang glass" role="group" aria-label="Language"><button data-l="fa">FA</button><button data-l="ckb">KU</button><button data-l="ar">AR</button><button data-l="en">EN</button></div>
    <a class="ib glass" href="/" data-ta="exit" aria-label="خروج"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 17l5-5-5-5M15 12H3M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/></svg></a>
  </div>
  <div class="mapw glass"><canvas id="map" width="300" height="300" aria-hidden="true"></canvas></div>
</div>

<div class="hint glass" id="hint"></div>
<div class="near glass" id="near" role="dialog" aria-live="polite"><span class="k" id="nk"></span><h4 id="nt"></h4><p id="nd"></p><div class="act"><a class="go" id="ngo"></a><span class="kb" id="nkb"></span></div></div>
<div class="toast glass" id="toast"></div>
<div class="flash" id="flash"></div>

<div class="pad joy glass" id="joy"><i></i></div>
<div class="pad btns" id="btns"><button class="glass" id="bjump" data-t="jump">پرش</button><button class="act" id="bact" data-t="use">ورود</button></div>

<div class="intro" id="intro">
  <div class="ic glass">
    <span class="k">ENTEKHAB · WORLD</span>
    <h1 data-t="title">جهان انتخاب</h1>
    <p data-t="intro">به ایستگاه مداری انتخاب خوش آمدی. ۴۰۸ کیلومتر بالای زمین. هر دروازه تو را به یکی از بخش‌های سایت می‌برد.</p>
    <label for="nm" data-t="name">اسم تو در ایستگاه</label>
    <input id="nm" maxlength="18" autocomplete="off" spellcheck="false">
    <label data-t="suit">رنگ لباس فضایی</label>
    <div class="sw" id="suits"></div>
    <label data-t="visor">رنگ کلاه</label>
    <div class="sw" id="visors"></div>
    <button class="go" id="start" type="button" data-t="start">شروع</button>
    <div class="keys" data-t="keys">حرکت: WASD یا کلیدهای جهت · نگاه: بکش · پرش: Space · ورود: E</div>
  </div>
</div>

<script src="/assets/vendor/three/three.min.js"></script>
<script src="/assets/space/space.js?v=1"></script>
<script src="/assets/space/mascot.js?v=1"></script>
<script src="/assets/space/world.js?v=1"></script>
</body>
</html>

  return `<tr data-s="${esc(s.id)}"><td class="num" style="white-space:nowrap">${dt(s.t)}</td><td>${esc(nm(s.ind))}</td><td class="num">${esc((s.tv_sym || s.sym || '').replace(/^.*:/, ''))} · ${esc(s.tf || '')}</td>
   <td><span class="sd ${s.side}">${s.side === 'long' ? '▲ ' : s.side === 'short' ? '▼ ' : ''}${T(s.side)}</span></td><td>${what}</td><td class="num">${fm(s.price, s.price > 100 ? 0 : 4)}</td><td>${res}</td></tr>`;
}
function renderSigs() {
  const list = (SIG && SIG.signals) || [], ids = [...new Set(list.map(s => s.ind))];
  const si = $('#sInd'); if (!IND_ID) { const cur = si.value; si.innerHTML = `<option value="">${T('all')}</option>` + ids.map(i => `<option value="${esc(i)}">${esc(nm(i))}</option>`).join(''); si.value = cur; } else si.style.display = 'none';
  const fi = IND_ID || si.value, fs = $('#sSide').value;
  const all = list.filter(s => (!fi || s.ind === fi) && (!fs || s.side === fs)), L = all.slice(0, sLim);
  const relayOff = !(SIG && SIG.relay && SIG.relay.channel);
  const it = IND_ID && IND.items.find(x => x.id === IND_ID);
  const note = relayOff && (!it || it.engine !== 'server') ? `<div class="empty" style="margin-bottom:10px">📡 ${T('relayOff')}</div>` : '';
  $('#sigs').innerHTML = note + (L.length ? `<table class="sg"><tr><th>${T('when')}</th><th>${T('ind')}</th><th>${T('sym')}</th><th>${T('side')}</th><th>${T('what')}</th><th>${T('at')}</th><th>${T('res')}</th></tr>${L.map(row).join('')}</table>` + (all.length > L.length ? `<p style="text-align:center;margin-top:10px"><button class="btn" id="sMore">${T('more')} (${all.length - L.length})</button></p>` : '') : (note ? '' : `<div class="empty">${T('none')}</div>`));
  const st = (SIG && SIG.stats) || {}, keys = Object.keys(st).filter(k => !fi || k === fi);
  $('#stats').innerHTML = keys.length ? `<div class="kv">${keys.map(k => { const a = st[k]; return `<div><small>${esc(nm(k))}</small><b style="font-size:.85rem">${T('statN')} ${a.n} · ▲${a.long} ▼${a.short}${a.win != null ? ` · ${T('statW')} ${a.h} ${a.win}% · ${T('statA')} ${a.avg >= 0 ? '+' : ''}${a.avg}%` : ''}${a.trades ? ` · trades ${a.trades} (${a.twin}%)` : ''}</b></div>`; }).join('')}</div>` : '';
}
async function miniChart(s) {
  const daily = s.tf === '1D' || s.tf === '1W', iv = daily ? '1d' : ({ '1h': '1h', '2h': '2h', '4h': '4h', '15m': '15m', '30m': '30m' }[s.tf] || '1h');
  const ms = { '1d': 864e5, '4h': 144e5, '2h': 72e5, '1h': 36e5, '30m': 18e5, '15m': 9e5 }[iv], t0 = Date.parse(s.t);
  $('#mbody').innerHTML = `<h3 style="margin-bottom:6px">${esc(nm(s.ind))} · ${esc(s.sym || '')} · ${esc(s.tf)} · <span class="sd ${s.side}">${T(s.side)}</span></h3><p class="disc" style="margin:0 0 8px">${T('mini')} · ${dt(s.t)} · ${s.kind === 'state' ? stTxt(s) : T(s.kind)}</p><canvas id="mc"></canvas><p class="disc">${s.msg ? `<a href="${esc(s.msg)}" target="_blank" rel="noopener">Telegram ↗</a>` : ''}</p>`;
  $('#mod').hidden = false;
  if (!s.sym) return;
  const k = await j(`https://data-api.binance.vision/api/v3/klines?symbol=${s.sym}&interval=${iv}&startTime=${t0 - 60 * ms}&limit=130`);
  const c = $('#mc'); if (!k || !k.length || !c) return;
  const [x, W, H] = cnv(c, 340), hi = Math.max(...k.map(q => +q[2]), s.tp || 0), lo = Math.min(...k.map(q => +q[3]), s.sl || 1e18), bw = (W - 60) / k.length;
  const Y = v => 10 + (hi - v) / (hi - lo || 1) * (H - 30), X = i => 4 + i * bw;
  x.font = '10px Space Grotesk'; x.fillStyle = '#6b6f76'; for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; x.fillText(fm(v, v > 100 ? 0 : 4), W - 54, Y(v) + 3); x.strokeStyle = '#ffffff0d'; x.beginPath(); x.moveTo(0, Y(v)); x.lineTo(W - 58, Y(v)); x.stroke(); }
  k.forEach((q, i) => { const o = +q[1], h = +q[2], l = +q[3], cl = +q[4], up = cl >= o; x.strokeStyle = x.fillStyle = up ? '#22c55e' : '#ef4444'; x.beginPath(); x.moveTo(X(i) + bw / 2, Y(h)); x.lineTo(X(i) + bw / 2, Y(l)); x.stroke(); x.fillRect(X(i) + bw * .15, Math.min(Y(o), Y(cl)), bw * .7, Math.max(1, Math.abs(Y(o) - Y(cl)))); });
  const si = k.findIndex(q => +q[0] >= t0 - (daily ? 0 : ms)), ix = si < 0 ? k.length - 1 : si;
  const line = (v, col, lab) => { if (!v) return; x.strokeStyle = col; x.setLineDash([5, 4]); x.beginPath(); x.moveTo(X(ix), Y(v)); x.lineTo(W - 58, Y(v)); x.stroke(); x.setLineDash([]); x.fillStyle = col; x.fillText(lab, X(ix) + 4, Y(v) - 3); };
  line(s.price, '#f7931a', T('at') + ' ' + fm(s.price, s.price > 100 ? 0 : 4)); line(s.sl, '#ef4444', 'SL'); line(s.tp, '#22c55e', 'TP');
  x.fillStyle = s.side === 'short' ? '#ef4444' : s.side === 'long' ? '#22c55e' : '#f7931a'; const px = X(ix) + bw / 2, py = Y(s.price);
  x.beginPath(); if (s.side === 'short') { x.moveTo(px, py - 14); x.lineTo(px - 7, py - 26); x.lineTo(px + 7, py - 26); } else { x.moveTo(px, py + 14); x.lineTo(px - 7, py + 26); x.lineTo(px + 7, py + 26); } x.closePath(); x.fill();
}

/* ---------- detail ---------- */
function renderDetail() {
  const it = IND.items.find(x => x.id === IND_ID), D = $('#detail'); if (!it) { D.hidden = true; return; }
  const t = tl(it); D.hidden = false;
  $('.hero h1').innerHTML = esc(it.name); $('.hero p').innerHTML = `${esc((IND.groups[it.group] || {})[lang] || '')} — ${T(it.kind)} · ${T(it.access)} · Coin_Kurd / TradingView`; $('#pulse').hidden = true;
  D.innerHTML = `<p><a class="btn" href="/indicators/">${T('back')}</a></p>
   <div style="margin:12px 0"><span class="bdg s">${T(it.kind)}</span><span class="bdg ${it.access === 'open-source' ? 'o' : ''}">${T(it.access)}</span>${it.engine === 'server' ? `<span class="bdg l">● ${T('live')}</span>` : ''}<span class="bdg">${T('chart')}: ${esc(it.chart)}</span></div>
   <div class="det"><div class="big"><img src="${img(it, true)}" alt="${esc(it.name)} — TradingView chart by Coin_Kurd" data-zoom="${it.id}" width="${it.img.w}" height="${it.img.h}"></div>
   <div><p style="font-size:1rem;line-height:2">${esc(t.sum)}</p><h3 style="margin-top:14px">${T('how')}</h3><ul>${t.how.map(h => `<li>${esc(h)}</li>`).join('')}</ul>
   ${it.bt ? `<div class="card" style="margin-top:12px"><h3>${T('bt')} · <span class="num" style="font-size:.85rem">${esc(it.chart)}</span></h3><div class="kv"><div><small>${T('pnl')}</small><b class="pos">${it.bt.pnl}</b></div><div><small>${T('dd')}</small><b class="neg">${it.bt.dd}</b></div><div><small>${T('win')}</small><b>${it.bt.win}</b><small>${it.bt.trades}</small></div><div><small>${T('pf')}</small><b>${it.bt.pf}</b></div></div><p class="disc">${T('src')}</p></div>` : ''}
   <p class="disc" style="margin-top:10px"><b>${T('acc')}:</b> ${it.access === 'open-source' ? T('accOpen') : T('accInv')}</p>
   <div class="row" style="margin-top:10px"><a class="btn p" href="${it.url}" target="_blank" rel="noopener">${T('tv')}</a><a class="btn" href="https://t.me/Coin_Kurd" target="_blank" rel="noopener">Telegram</a><button class="btn" id="shr">↗ share</button></div></div></div>
   ${it.engine === 'server' ? `<div style="margin-top:16px">${liveCards(it.id)}</div>` : ''}`;
  const b = $('#shr'); if (b) b.onclick = () => share(`${it.name} — ${t.sum.slice(0, 120)}…`, location.href);
  $('#sigS h2 b').textContent = T('sigsOf');
}

function render() {
  if (!IND) return;
  const items = IND.items, st = (SIG && SIG.stats) || {};
  $('#pulse').innerHTML = [[T('n'), items.length], [T('ns'), items.filter(i => i.kind === 'strategy').length], [T('no'), items.filter(i => i.access === 'open-source').length], [T('nl'), items.filter(i => i.engine === 'server').length], [T('n30'), Object.values(st).reduce((a, b) => a + (b.n30 || 0), 0)]].map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join('');
  if (IND_ID) { renderDetail(); $('#liveS').hidden = true; } else $('#live').innerHTML = liveCards();
  renderLib(); renderSigs(); paintLive();
}
document.addEventListener('click', e => {
  const z = e.target.closest('[data-zoom]'); if (z && IND) { e.preventDefault(); const it = IND.items.find(x => x.id === z.dataset.zoom); $('#mbody').innerHTML = `<h3 style="margin-bottom:8px">${esc(it.name)}</h3><img src="${img(it, true)}" alt="${esc(it.name)}"><p class="disc">${esc(it.chart)} · © Coin_Kurd / TradingView</p>`; $('#mod').hidden = false; return; }
  const g = e.target.closest('#flt button'); if (g) { grp = g.dataset.g; renderLib(); return; }
  const r = e.target.closest('tr[data-s]'); if (r && SIG) { const s = SIG.signals.find(x => x.id === r.dataset.s); if (s) miniChart(s); return; }
  if (e.target.id === 'sMore') { sLim += 60; renderSigs(); return; }
  if (e.target.id === 'mx' || e.target.id === 'mod') $('#mod').hidden = true;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#mod').hidden = true; });
$('#sInd').onchange = () => { sLim = 40; renderSigs(); }; $('#sSide').onchange = () => { sLim = 40; renderSigs(); };
let rT = 0; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(paintLive, 200); });
uiLang(render);
(async () => {
  [IND, KIND, SIG] = await Promise.all([j('/data/indicators.json' + V()), j('/data/kind.json' + V()), j('/data/signals.json' + V())]);
  if (!IND) { $('#lib').innerHTML = '<p class="disc">—</p>'; return; }
  render();
  if (location.hash === '#signals' || window.IND_TAB === 'signals') document.getElementById('sigS').scrollIntoView();
})();
</script>

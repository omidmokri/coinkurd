 honest:'<b>Transparency:</b> every calculation runs in your browser with public Binance and exchangerate-api data; nothing is sent to us. These tools are educational, not financial advice.',nfa:'Educational, not financial advice'});
const PAL=['#f7931a','#38bdf8','#22c55e','#a78bfa','#f472b6','#facc15'];let M=null,SC=null,FX=null,MAC=null,cmpD=90,cmp=ls.get('ek_cmp',['BTC','ETH','SOL']);
const KL={};async function daily(c,limit){const k=c+limit;if(KL[k])return KL[k];const r=await j(`https://data-api.binance.vision/api/v3/klines?symbol=${c}USDT&interval=1d&limit=${limit}`);KL[k]=(r||[]).map(x=>({t:x[0],c:+x[4]}));return KL[k]}
const coins=()=>[...new Set(['BTC','ETH','SOL','BNB','XRP',...(M?.coins||[]).map(c=>c.coin)])].filter(c=>!['USDT','USDC','FDUSD','DAI'].includes(c));
const opt=(a,sel)=>a.map(c=>`<option${c===sel?' selected':''}>${c}</option>`).join('');
const pct=(v,d=2)=>v==null||!isFinite(v)?'—':`<span class="${v>=0?'pos':'neg'}">${v>=0?'+':''}${v.toFixed(d)}%</span>`;
const sd=a=>{const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1||1))};
const cor=(a,b)=>{const n=Math.min(a.length,b.length);if(n<5)return null;a=a.slice(-n);b=b.slice(-n);const ma=a.reduce((x,y)=>x+y)/n,mb=b.reduce((x,y)=>x+y)/n;let c=0,da=0,db=0;for(let i=0;i<n;i++){c+=(a[i]-ma)*(b[i]-mb);da+=(a[i]-ma)**2;db+=(b[i]-mb)**2}return da&&db?c/Math.sqrt(da*db):null};
/* ---- compare ---- */
async function renderCmp(){ls.set('ek_cmp',cmp);$('#cmpAdd').innerHTML=opt(coins().filter(c=>!cmp.includes(c)));
 $('#cmpChips').innerHTML=cmp.map((c,i)=>`<span class="chipc"><i style="background:${PAL[i]}"></i>${c}<button data-x="${c}" aria-label="remove">×</button></span>`).join('');
 const lim=cmpD+1,ser=await Promise.all(cmp.map(c=>daily(c,lim))),btc=await daily('BTC',lim);
 const all=ser.filter(s=>s.length>2);if(!all.length){$('#cmpSvg').innerHTML='';$('#cmpTab').innerHTML=`<tr><td class="err">${T('noData')}</td></tr>`;return}
 const t0=Math.max(...all.map(s=>s[0].t)),norm=ser.map(s=>s.filter(x=>x.t>=t0)).map(s=>s.length?s.map(x=>({t:x.t,v:(x.c/s[0].c-1)*100})):[]);
 const vs=norm.flat().map(x=>x.v),mn=Math.min(0,...vs),mx=Math.max(0,...vs),T0=t0,T1=Math.max(...norm.flat().map(x=>x.t)),X=t=>((t-T0)/((T1-T0)||1)*780+10).toFixed(1),Y=v=>(290-(v-mn)/((mx-mn)||1)*280).toFixed(1);
 let svg=`<line x1="10" x2="790" y1="${Y(0)}" y2="${Y(0)}" stroke="#ffffff30" stroke-dasharray="4 4"/>`;
 norm.forEach((s,i)=>{if(s.length>1)svg+=`<polyline fill="none" stroke="${PAL[i]}" stroke-width="2" vector-effect="non-scaling-stroke" points="${s.map(x=>X(x.t)+','+Y(x.v)).join(' ')}"/>`});
 $('#cmpSvg').innerHTML=svg;$('#cmpRange').innerHTML=`<span class="num">↑ ${mx.toFixed(1)}%</span> · <span class="num">↓ ${mn.toFixed(1)}%</span> · <span class="num">${new Date(T0).toISOString().slice(0,10)} → ${new Date(T1).toISOString().slice(0,10)}</span>`;
 const br=btc.filter(x=>x.t>=t0).map((x,i,a)=>i?Math.log(x.c/a[i-1].c):null).slice(1);
 $('#cmpTab').innerHTML=`<tr><th></th><th>${T('ret')}</th><th>${T('vol')}</th><th>${T('mdd')}</th><th>${T('corr')}</th><th>${T('score')}</th></tr>`+cmp.map((c,i)=>{const s=ser[i].filter(x=>x.t>=t0);if(s.length<3)return `<tr><td>${c}</td><td colspan="5" class="disc">—</td></tr>`;
  const r=s.slice(1).map((x,k)=>Math.log(x.c/s[k].c));let pk=-1,md=0;s.forEach(x=>{pk=Math.max(pk,x.c);md=Math.min(md,x.c/pk-1)});const sc=SC?.coins?.[c];
  return `<tr><td><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${PAL[i]}"></i> <a href="/coins/${c.toLowerCase()}/"><b>${c}</b></a></td><td class="num">${pct((s.at(-1).c/s[0].c-1)*100)}</td><td class="num">${(sd(r)*Math.sqrt(365)*100).toFixed(0)}%</td><td class="num">${pct(md*100,1)}</td><td class="num">${(()=>{const cr=c==='BTC'?1:cor(r,br);return cr==null?'—':cr.toFixed(2)})()}</td><td class="num">${sc?sc.score:'—'}</td></tr>`}).join('')}
$('#cmpAddB').onclick=()=>{const c=$('#cmpAdd').value;if(c&&!cmp.includes(c)&&cmp.length<6){cmp.push(c);renderCmp()}};
$('#cmpChips').onclick=e=>{const b=e.target.closest('[data-x]');if(b&&cmp.length>1){cmp=cmp.filter(x=>x!==b.dataset.x);renderCmp()}};
$('#cmpP').onclick=e=>{const b=e.target.closest('button');if(!b)return;cmpD=+b.dataset.d;$('#cmpP').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderCmp()};
/* ---- position size ---- */
function renderRisk(){const cap=+$('#rCap').value,rp=+$('#rPct').value,en=+$('#rEn').value,sl=+$('#rSl').value,tp=+$('#rTp').value,lev=Math.max(1,+$('#rLev').value||1),long=$('#rSide').value==='long';
 $('#rWarn').innerHTML='';if(!(cap>0&&rp>0&&en>0&&sl>0)){$('#rOut').innerHTML='';return}
 if(long?sl>=en:sl<=en){$('#rOut').innerHTML='';$('#rWarn').innerHTML=`<p class="err">${T('wStop')}</p>`;return}
 const dist=Math.abs(en-sl)/en,risk=cap*rp/100,size=risk/dist,units=size/en,rr=tp>0?Math.abs(tp-en)/Math.abs(en-sl):null,liq=lev>1?(long?en*(1-1/lev):en*(1+1/lev)):null;
 const cells=[[T('pos'),'$'+fm(size,2)],[T('units'),fm(units,6)],[T('maxLoss'),'$'+fm(risk,2)],[T('margin'),'$'+fm(size/lev,2)]];
 if(rr!=null){cells.push([T('rr'),rr.toFixed(2)],[T('be'),(100/(1+rr)).toFixed(1)+'%'],[T('profit'),'$'+fm(size*Math.abs(tp-en)/en,2)])}
 if(liq)cells.push([T('liq'),'$'+fm(liq,en<1?6:2)]);
 $('#rOut').innerHTML=cells.map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('');
 const w=[];if(liq&&(long?liq>=sl:liq<=sl))w.push(T('wLiq'));if(size/lev>cap)w.push(T('wBig'));$('#rWarn').innerHTML=w.map(x=>`<p class="warn">${x}</p>`).join('')}
['#rCap','#rPct','#rEn','#rSl','#rTp','#rLev','#rSide'].forEach(s=>$(s).addEventListener('input',renderRisk));
$('#rCoin').onchange=async()=>{const c=$('#rCoin').value;if(!c)return;const d=await j(`https://data-api.binance.vision/api/v3/ticker/price?symbol=${c}USDT`);if(d&&d.price){$('#rEn').value=+d.price;renderRisk()}};
/* ---- what if ---- */
async function whatIf(){const c=$('#wCoin').value,amt=+$('#wAmt').value,mode=$('#wMode').value,d=$('#wDate').value,o=$('#wOut');if(!(amt>0)||!d)return;o.innerHTML='…';
 const start=Date.parse(d+'T00:00:00Z');if(!(start<Date.now())){o.innerHTML=`<p class="err">${T('noData')}</p>`;return}
 async function hist(sym){const out=[];let s=start;for(let k=0;k<4;k++){const r=await j(`https://data-api.binance.vision/api/v3/klines?symbol=${sym}USDT&interval=1d&startTime=${s}&limit=1000`);if(!r||!r.length)break;r.forEach(x=>out.push({t:x[0],c:+x[4]}));if(r.length<1000)break;s=r.at(-1)[0]+864e5}return out}
 function run(h){if(!h.length||h[0].t-start>7*864e5)return null;const last=h.at(-1).c;if(mode==='once'){const u=amt/h[0].c;return{inv:amt,now:u*last,n:1}}
  let u=0,inv=0,n=0;for(let i=0;i<h.length;i+=7){u+=amt/h[i].c;inv+=amt;n++}return{inv,now:u*last,n}}
 const [a,b]=await Promise.all([hist(c),c==='BTC'?null:hist('BTC')]);const r=run(a),rb=b?run(b):null;if(!r){o.innerHTML=`<p class="err">${T('noData')}</p>`;return}
 o.innerHTML=[[T('inv'),'$'+fm(r.inv,2)],[T('now'),'$'+fm(r.now,2)],[T('pnl'),pct((r.now/r.inv-1)*100)],[T('buys'),r.n]].concat(rb?[[T('vsBtc'),'$'+fm(rb.now,2)+' '+pct((rb.now/rb.inv-1)*100)]]:[]).map(([x,y])=>`<div><small>${x}</small><b>${y}</b></div>`).join('')}
$('#wGo').onclick=whatIf;
/* ---- regional currencies ---- */
async function renderFx(){const c=$('#fCoin').value,q=+$('#fQty').value||0,cur=$('#fCur').value,R=ls.get('ek_fx',{});if(R[cur]&&!$('#fRate').value)$('#fRate').value=R[cur];
 const px=await j(`https://data-api.binance.vision/api/v3/ticker/price?symbol=${c}USDT`),usd=px&&px.price?+px.price*q:null;
 const off=FX&&FX.rates?(cur==='IRT'?FX.rates.IRR/10:FX.rates[cur]):null,mkt=cur==='IRT'&&MAC&&MAC.usdt_irt?MAC.usdt_irt.value:null,mine=+$('#fRate').value||null,rate=mine||mkt||off;
 $('#fOut').innerHTML=[[T('val')+' (USD)',usd==null?'—':'$'+fm(usd,2)],[T('val')+' — '+T('curs')[cur],usd==null||!rate?'—':fm(usd*rate,0)],[mine?T('custom'):mkt?T('mkt'):T('official'),rate?fm(rate,2):'—'],[T('official'),off?fm(off,2):'—']].map(([x,y])=>`<div><small>${x}</small><b>${y}</b></div>`).join('');
 $('#fNote').innerHTML=(FX?.time_last_update_utc?T('fxSrc')+esc(FX.time_last_update_utc.slice(5,22))+'. ':'')+(mkt&&!mine?T('mktSrc'):['IRT','IQD'].includes(cur)?T('fxWarn'):'')}
$('#fRate').addEventListener('change',()=>{const R=ls.get('ek_fx',{}),v=+$('#fRate').value;if(v>0)R[$('#fCur').value]=v;else delete R[$('#fCur').value];ls.set('ek_fx',R);renderFx()});
['#fCoin','#fQty'].forEach(s=>$(s).addEventListener('input',renderFx));$('#fCur').addEventListener('change',()=>{$('#fRate').value='';renderFx()});
function forms(){const cs=coins();['#wCoin','#fCoin'].forEach(s=>{const v=$(s).value||'BTC';$(s).innerHTML=opt(cs,v)});$('#rCoin').innerHTML='<option value="">—</option>'+opt(cs);
 $('#rSide').innerHTML=Object.entries(T('sides')).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');$('#wMode').innerHTML=Object.entries(T('modes')).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
 const fc=$('#fCur').value||'IQD';$('#fCur').innerHTML=Object.entries(T('curs')).map(([k,v])=>`<option value="${k}"${k===fc?' selected':''}>${v} (${k})</option>`).join('');
 if(!$('#wDate').value){const d=new Date(Date.now()-365*864e5);$('#wDate').value=d.toISOString().slice(0,10)}$('#wDate').max=new Date().toISOString().slice(0,10);
 $('#tlinks').innerHTML=T('links').map(([h,a,b])=>`<a href="${h}"><b>${a}</b><small>${b}</small></a>`).join('')}
function render(){forms();renderCmp();renderRisk();renderFx()}
(async()=>{const [m,s,fx,mc]=await Promise.all([j('/data/market.json'+V()),j('/data/score.json'+V()),j('https://open.er-api.com/v6/latest/USD'),j('/data/macro.json'+V())]);M=m;SC=s;MAC=mc;FX=fx&&fx.result==='success'?fx:null;uiLang(render);
 if(location.hash){const t=document.querySelector(location.hash);if(t)setTimeout(()=>t.scrollIntoView({behavior:'smooth'}),300)}})();
